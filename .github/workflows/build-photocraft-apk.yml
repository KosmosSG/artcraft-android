
name: Build PhotoCraft APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android


      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Checking Android SDK tools..."
          find "$SDK_ROOT/cmdline-tools" \
            -maxdepth 3 -name sdkmanager -type f \
            -print 2>/dev/null || true

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -maxdepth 3 -name sdkmanager -type f \
            -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found."
            exit 1
          fi

          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version


      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build PhotoCraft APK
        run: bash build-debug.sh -photocraft

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: PhotoCraft-Android-Debug
          path: output/*.apk
          if-no-files-found: error
