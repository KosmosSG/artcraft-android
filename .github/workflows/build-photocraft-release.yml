      - name: Verify APK signing and identity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(output/*.apk)
          test "${#apks[@]}" -eq 1 || { echo "Expected exactly one APK"; exit 1; }

          APK="${apks[0]}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -n "$APKSIGNER" && test -n "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          KEY_PASS="$(cat keys/.keystore-password)"
          EXPECTED="$(keytool -list -v \
            -keystore keys/artcraft-builder.jks \
            -storepass "$KEY_PASS" \
            -alias artcraftbuilder | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')"

          test -n "$EXPECTED" && test -n "$ACTUAL" && test "$EXPECTED" = "$ACTUAL" || {
            echo "APK signing certificate does not match permanent key"
            exit 1
          }

          "$AAPT" dump badging "$APK" | grep "^package:"
          echo "APK signature matches permanent signing key"
