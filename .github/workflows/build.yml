name: Android upstream integration compile (not replacement APKs)

on:
  push:
    branches:
      - 'integration/android-v041-preserve-releases-20261028'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    strategy:
      fail-fast: false
      matrix:
        app:
          - photocraft
          - vectorcraft
          - filmcraft
          - lightcraft
          - pdfcraft
          - effectcraft
          - designcraft
          - figcraft
          - wordcraft
          - soundcraft
          - deckcraft
          - cadcraft
          - gridcraft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        timeout-minutes: 3
        run: |
          pip install --upgrade pillow

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache sccache compilation artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}-
            sccache-${{ runner.os }}-${{ matrix.app }}-
            sccache-${{ runner.os }}-

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure JDK for build script
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Cache Gradle wrapper & dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-
            gradle-${{ runner.os }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry & Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('lib/build-common.sh') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-${{ matrix.app }}-
            cargo-registry-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
            chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          fi
          cargo ndk -V

      - name: Configure Android SDK and NDK
        run: |
          # Use pre-installed Android SDK and NDK on the runner
          if [ -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            LATEST_NDK=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              echo "ANDROID_NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
              echo "NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
            fi
          fi
          echo "ARTCRAFT_BUILD_TOOLS_VERSION=35.0.0" >> $GITHUB_ENV

      - name: Build isolated integration package at reviewed upstream pin
        timeout-minutes: 150
        env:
          INTEGRATION_APP: ${{ matrix.app }}
          ARTCRAFT_INTEGRATION_BUILD: '1'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_LTO: 'thin'
          CARGO_BUILD_JOBS: '2'
        run: |
          python3 tools/android_integration.py validate
          TAG=$(python3 -c 'import json,os; print(json.load(open("configs/android-integration.json"))["apps"][os.environ["INTEGRATION_APP"]]["upstream_tag"])')
          bash build.sh -"$INTEGRATION_APP" -tag="$TAG" -packagename="com.artcraft.$INTEGRATION_APP.integration"
          sccache --show-stats || true

      - name: Verify built APK integrity
        run: |
          count=0
          for apk in output/*.apk; do
            [ -f "$apk" ] || continue
            count=$((count + 1))
            size=$(stat -c%s "$apk" 2>/dev/null || echo 0)
            if [ "$size" -lt 1000000 ]; then
              echo "::error::APK $apk is empty or too small ($size bytes)" >&2
              exit 1
            fi
            if ! unzip -tq "$apk" >/dev/null 2>&1; then
              echo "::error::APK $apk is corrupted (failed zip integrity test)" >&2
              exit 1
            fi
            echo "Verified valid APK: $apk ($(( size / 1048576 )) MB)"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No APK found in output/" >&2
            exit 1
          fi

      # Compiling the generic upstream shell does not preserve released app features.
      # Deliberately retain logs only until each release baseline has been ported.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-log
          path: logs/
          if-no-files-found: ignore
