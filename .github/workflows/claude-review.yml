name: Claude CLI Read-Only Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      # Work around an upstream Claude Code GitHub Action regression:
      # its action marker environment variables are misinterpreted by the CLI.
      - name: Install Claude Code with marker-clearing wrapper
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$RUNNER_TEMP/claude"
          chmod +x "$RUNNER_TEMP/claude"

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          prompt: |
            Perform a read-only review of this pull request and its actual changes.
            Focus on Android compatibility, regressions to existing ArtCraft customizations,
            build and test risks, security, signing, and release safety.
            Do not edit files, create commits, merge, sign, publish, or trigger workflows.
            Return concise actionable findings with file paths and line references.
            If no actionable issue is found, state that clearly.
          claude_args: |
            --max-turns 5
            --allowedTools "Read,Glob,Grep"

      # Emit only narrowly selected, redacted error metadata. Never print the full SDK output.
      - name: Report sanitized Claude error metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          path = os.path.join(os.environ["RUNNER_TEMP"], "claude-execution-output.json")
          if not os.path.isfile(path):
              print("Claude execution output file was not produced.")
              raise SystemExit(0)
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print("Could not parse Claude execution output:", type(exc).__name__)
              raise SystemExit(0)
          found = []
          def walk(value):
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key.lower() in ("error", "errors") and isinstance(item, (dict, list, str)):
                          found.append(item)
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
          walk(data)
          if not found:
              print("No structured error object found; top-level keys:", ", ".join(map(str, data.keys())) if isinstance(data, dict) else type(data).__name__)
              raise SystemExit(0)
          def safe(obj, depth=0):
              if depth > 3:
                  return
              if isinstance(obj, dict):
                  for key in ("type", "code", "status", "name", "message"):
                      val = obj.get(key)
                      if isinstance(val, (str, int, float)):
                          val = str(val)
                          val = re.sub(r"sk-ant-[A-Za-z0-9_-]+", "[REDACTED_API_KEY]", val)
                          val = re.sub(r"Bearer\s+\S+", "Bearer [REDACTED]", val, flags=re.I)
                          val = re.sub(r"gh[pousr]_[A-Za-z0-9_]+", "[REDACTED_TOKEN]", val)
                          print(f"{key}: {val[:180]}")
                  for val in obj.values():
                      if isinstance(val, (dict, list)):
                          safe(val, depth + 1)
              elif isinstance(obj, list):
                  for val in obj[:5]:
                      safe(val, depth + 1)
              elif isinstance(obj, str):
                  print("error:", obj[:180])
          for item in found[:3]:
              safe(item)
          PY
