name: DeckCraft upstream stable monitor (fail-closed)

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deckcraft-upstream-monitor
  cancel-in-progress: true

jobs:
  inspect-stable-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare official stable upstream with last audited DeckCraft source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDITED_TAG: v0.9.0
          AUDITED_COMMIT: fe510bdac68118f2c9a714e69d0ff572e3f9a0c7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.error import HTTPError, URLError

          url = "https://api.github.com/repos/storytold/deckcraft/releases/latest"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "User-Agent": "artcraft-deckcraft-upstream-audit",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  release = json.load(response)
          except (HTTPError, URLError, TimeoutError) as exc:
              raise SystemExit(f"FAIL CLOSED: cannot verify upstream release: {exc}")
          tag = release.get("tag_name", "")
          if release.get("draft") or release.get("prerelease") or not tag.startswith("v"):
              raise SystemExit("FAIL CLOSED: latest GitHub release is not a published stable tag")
          notes = [
              "## DeckCraft upstream release monitor",
              f"Latest official stable tag: `{tag}`",
              f"Last audited tag: `{os.environ['AUDITED_TAG']}`",
          ]
          if tag != os.environ["AUDITED_TAG"]:
              notes.extend([
                  "**NEW SOURCE REQUIRES PORTING AND ALL RELEASE GATES.**",
                  "DeckCraft Android candidate workflow is pinned to the previous source.",
                  "No automatic source replacement, key rotation, APK release or tag creation has occurred.",
                  "Do not distribute until all Android features, signing and device gates are verified.",
              ])
              status = "UNVERIFIED_UPDATE"
          else:
              notes.append("No new upstream version. Existing Android candidate is NOT production approved.")
              status = "NO_CHANGE"
          notes.append(f"Monitor result: `{status}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n\n".join(notes) + "\n")
          print(status, tag)
          if status != "NO_CHANGE":
              raise SystemExit("BLOCKED: upstream changed; rebuild and release are intentionally denied without updated source and full checks")
          PY
