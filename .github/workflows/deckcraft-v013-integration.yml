name: DeckCraft 0.14.1 Android integration unsigned (no release)
on:
  push:
    branches: [integration/deckcraft-features-20261031]
    paths:
      - '.github/workflows/deckcraft-v013-integration.yml'
      - 'deckcraft/**'
      - 'tools/approved-branding/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deckcraft-v013-integration
  cancel-in-progress: false
jobs:
  compile-unsigned:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/integration/deckcraft-features-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      ARTCRAFT_TARGET_SDK: '35'
    steps:
      - name: Checkout reviewed D/C/S PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DeckCraft source and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deckcraft/android/patch_dcs_host.py deckcraft/android/patch_unsaved_dcs.py deckcraft/android/patch_deckcraft_fonts.py deckcraft/android/patch_deckcraft_tablet.py deckcraft/android/patch_deckcraft_host.py deckcraft/android/patch_gpu_diagnostics.py
          test -s deckcraft/android/dcs_bridge.rs
          test -s deckcraft/android/dcs_java.inc
          test -s deckcraft/android/dcs_tests.rs
          test -s deckcraft/android/save_close.rs
          test -s tools/approved-branding/assets/DeckCraft.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('tools/approved-branding/assets/manifest.json').read_text())
          assert manifest['app']=='deckcraft'
          assert manifest['version_name']=='0.14.1-android.13'
          assert manifest['version_code']==100000017
          assert manifest['previous_version_code']==100000016
          assert manifest['package']=='com.artcraft.deckcraft'
          print('PASS: D/C/S sources and 0.14.1-android.13 metadata present')
          PY
      - name: Checkout pinned Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: builder
          persist-credentials: false
      - name: Checkout official stable DeckCraft v0.14.1
        uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: ee39ff67816d0039143ec7c98ea604cefe0cd2e5
          path: builder/source/deckcraft
          persist-credentials: false
      - name: Checkout upstream UI dependency matched to DeckCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/egui
          ref: 6d518fc799681571963842f95b55a6b68431b15a
          path: egui-source
          persist-credentials: false
      - name: Checkout upstream windowing dependency with ordered IME reset
        uses: actions/checkout@v4
        with:
          repository: storytold/winit
          ref: a517b3846ee8457d84ee4975110bfda6797c44dc
          path: winit-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 4 GiB scan boundaries without allocating 4 GiB
        run: |
          mkdir -p /tmp/deck-font-tests
          javac -d /tmp/deck-font-tests deckcraft/android/FontScanBudget.java deckcraft/tests/FontScanBudgetTest.java
          java -cp /tmp/deck-font-tests FontScanBudgetTest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK, build tools and image dependency
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 -m pip install 'Pillow==11.3.0' 'toml==0.10.2'
      - name: Port current Android enhancements, D/C/S, fonts and recovery to official upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          test "$(git -C builder/source/deckcraft rev-parse HEAD)" = ee39ff67816d0039143ec7c98ea604cefe0cd2e5
          python3 - <<'PY'
          from pathlib import Path
          source=Path('builder/source/deckcraft/Cargo.toml')
          s=source.read_text()
          old='version = "0.14.1"'
          assert s.count(old)==1, 'Official v0.14.1 source changed; stop'
          source.write_text(s.replace(old,'version = "0.14.1-android.13"',1))
          project=Path('builder/lib/android_project.py')
          s=project.read_text()
          formula='return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert s.count(formula)==1, 'Pinned version generator changed; stop'
          project.write_text(s.replace(formula,'return 100000017',1))
          PY
          python3 deckcraft/android/patch_v013_host.py builder
          python3 deckcraft/android/patch_shared_fonts.py builder
          python3 deckcraft/android/patch_update_settings.py builder
          python3 deckcraft/android/port_egui037.py builder egui-source winit-source
          python3 deckcraft/android/patch_gpu_diagnostics.py builder
          git -C builder/source/deckcraft diff --check
          python3 deckcraft/android/adaptive_safe.py builder deckcraft
          python3 tools/approved-branding/approved_branding.py check
          python3 tools/approved-branding/approved_branding.py install builder deckcraft
          python3 - <<'PY'
          from pathlib import Path
          dialogs=Path('builder/source/deckcraft/crates/ui-egui/src/dialogs/body.rs').read_text()
          ui=Path('builder/source/deckcraft/crates/ui-egui/src/lib.rs').read_text()
          java=Path('builder/templates/android/SafActivity.java').read_text()
          assert 'deckcraft.unsaved.dcs' in dialogs
          assert 'android_pending_close' in ui
          assert 'AndroidSaveFinished' in Path('builder/source/deckcraft/crates/ui-egui/src/services.rs').read_text()
          assert 'dkUnsavedDialog' in java
          shell=Path('builder/lib/build-common.sh').read_text()
          assert 'self.inner.android_capture_unsaved_dcs_raw(ctx, raw);' in shell
          assert 'if self.inner.session.active().is_some() {{' in shell
          assert 'pub fn android_capture_unsaved_dcs_raw' in ui
          dialog_shell=Path('builder/source/deckcraft/crates/ui-egui/src/dialogs.rs').read_text()
          assert 'egui::Modal::new(egui::Id::new(("deckcraft.confirm.modal"' in dialog_shell
          assert 'let java_action =' in Path('builder/source/deckcraft/crates/ui-egui/src/dialogs/body.rs').read_text()
          assert 'ctx.memory_mut(|m| { if let Some(id)' in ui
          assert 'modal_focus_requested' in java
          assert 'egui::Button::new("").left_text(label)' in ui
          assert 'view.dark' in Path('builder/source/deckcraft/crates/ui-egui/src/menus.rs').read_text()
          # GPU instrumentation reports the actual adapter selected at startup.
          assert 'app.gpuDiagnostics' in Path('builder/source/deckcraft/crates/ui-egui/src/lib.rs').read_text()
          assert 'GPU Diagnostics…' in Path('builder/source/deckcraft/crates/ui-egui/src/menus.rs').read_text()
          assert '"app.gpuDiagnostics" => self.dialog' in Path('builder/source/deckcraft/crates/ui-egui/src/app/commands.rs').read_text()
          assert '"gpuDiagnostics" => "GPU Diagnostics"' in Path('builder/source/deckcraft/crates/ui-egui/src/dialogs.rs').read_text()
          assert 'Slide rasterizer: vello_cpu' in Path('builder/source/deckcraft/crates/ui-egui/src/dialogs/body.rs').read_text()
          assert 'cc.wgpu_render_state.as_ref()' in shell
          assert 'state.adapter.get_info()' in shell
          assert 'deckcraft.android.gpu.adapter' in shell
          assert 'renderer: eframe::Renderer::Wgpu' in shell
          assert 'Backends::VULKAN | eframe::wgpu::Backends::GL' in shell

          canvas=Path('builder/source/deckcraft/crates/ui-egui/src/canvas.rs').read_text()
          assert 'deckcraft_android_pinch_anchor' in canvas
          assert 'egui::Event::Zoom(_)' in canvas
          assert 'let zooming = (resp.hovered() || touch_zoom_anchor.is_some())' in canvas
          assert 'zooming.then_some(touch_zoom_anchor.or(hover))' in canvas
          assert 'let touch_pan = allowed && native_pan && anchor.is_some();' in canvas
          assert '(resp.hovered() || on_bar || touch_pan_active) && !zooming' in canvas
          assert 'else if !touch_pan_active' in canvas
          assert 'let scroll_gain = if ui.input(' in canvas
          assert 'offset -= frame_scroll;' in canvas
          assert 'if touch_pan_active { 1.65_f32 } else { 1.7_f32 }' in canvas
          assert 'egui::smooth_scroll_delta already performs event-aware' in canvas
          assert 'delta.x.clamp(-72.0, 72.0)' in canvas
          assert 'delta.y.clamp(-72.0, 72.0)' in canvas
          assert 'deckcraft_trackpad_smooth' not in canvas
          assert 'now - last_input < 0.22' not in canvas
          dialog_shell=Path('builder/source/deckcraft/crates/ui-egui/src/dialogs.rs').read_text()
          assert 'egui::RichText::new("DeckCraft").size(20.0)' in dialog_shell
          assert '.halign(egui::Align::Center)' in dialog_shell
          assert 'ui.add_sized([24.0, 26.0]' in dialog_shell
          keys=Path('builder/source/deckcraft/crates/ui-egui/src/app/keys.rs').read_text()
          assert 'ctx.request_repaint_after(std::time::Duration::from_millis(24))' in keys
          assert 'ctx.request_repaint();' in keys
          assert 'Self::android_editing_ctrl_w(&events)' in keys
          assert 'self.close_presentation();' in keys
          assert 'self.route_ime_controls_only(ctx, &events);' in keys
          assert 'deckcraft.android.ctrl_w' in keys
          assert 'handled_clipboard' in keys
          assert 'self.publish_clipboard(ctx, false);' in keys
          assert 'self.publish_clipboard(ctx, true);' in keys
          assert 'self.session.execute("edit.paste", &json!({"text": pasted}))' in keys
          assert 'if touch_pan_active { 1.65_f32 } else { 1.7_f32 }' in canvas
          assert 'android_capture_editor_close_raw' in ui
          assert 'self.inner.android_capture_editor_close_raw(ctx, raw);' in shell
          assert 'dkTakeEditorClose' in java
          assert 'dkTakeEditorArrow' in java
          assert 'KEYCODE_DPAD_LEFT' in java
          assert 'self.inner.android_capture_editor_arrows_raw(ctx, raw);' in shell
          assert 'self.dk.editor_arrow(ctx);' in shell
          assert 'android_capture_editor_arrows_raw' in ui
          assert 'deckcraft.android.editor_arrow' in keys
          assert 'Mods { shift: action & 16 != 0' in keys
          bridge=Path('builder/templates/android/dcs_bridge.rs').read_text()
          assert 'pub fn editor_close(' in bridge
          assert 'pub fn editor_clipboard(' in bridge
          assert 'pub fn editor_arrow(' in bridge
          assert 'pub fn editor_flush_clipboard(' in bridge
          assert 'dkSetEditorClipboardText' in java
          assert 'self.dk.editor_flush_clipboard(ctx);' in shell
          assert 'deckcraft.android.clipboard.pending' in keys
          assert 'android_queue_clipboard_sync(ctx)' in keys
          assert 'dkTakeEditorClipboard' in java
          assert 'dkEditorClipboardText' in java
          assert 'self.inner.android_capture_editor_clipboard_raw(ctx, raw);' in shell
          assert 'android_capture_editor_clipboard_raw' in ui
          assert 'ctx.request_repaint();' in ui
          assert 'deckcraft.android.clip_action' in keys
          assert 'self.session.execute("text.selectAll", &json!({}))' in keys
          assert 'if touch_pan_active { 1.65_f32 } else { 1.7_f32 }' in canvas
          ribbon=Path('builder/source/deckcraft/crates/ui-egui/src/ribbon/home.rs').read_text()
          assert 'Paste (Ctrl+V)' in ribbon
          menu=Path('builder/source/deckcraft/crates/ui-egui/src/menus.rs').read_text()
          assert 'app.importFont' in menu, 'Font import command missing from menu'
          # Rust menu_tree regression test checks the actual Help/File split.
          assert 'fn import_font_is_help_only_no_duplicate_file_menu()' in ui
          print('PASS: Android.12 native egui trackpad smoothing only; no double-filter/inertia; arrows/clipboard stable')
          print('PASS: Android two-finger pan reaches canvas after hover cancellation and does not navigate on fitted page')
          print('PASS: Android canvas pinch fallback scoped by touch origin; existing wheel zoom retained')
          print('PASS: Android.4 blocking modal and focus, eager D/C/S, selectable theme, left menus')
          print('PASS: modal D/C/S captured before UI; Esc/Back cannot exit with open document')
          print('PASS: Android.4 D/C/S and acknowledged SAF behavior staged')
          PY
          python3 -m py_compile builder/lib/android_project.py
          bash -n builder/lib/build-common.sh
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.14.1-android.13.apk
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.14.1-android.13.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android4-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionName='0.14.1-android.13'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionCode='100000017'" /tmp/deckcraft-android4-badging.txt
          mkdir -p unsigned
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os, subprocess, sys
          src=Path(sys.argv[1])
          native='lib/arm64-v8a/libdeckcraft_android.so'
          strip=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          assert strip.is_file(),f'Android NDK LLVM strip unavailable: {strip}'
          saw_native=False
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  contents=original.read(entry.filename)
                  if entry.filename==native:
                      saw_native=True
                      assert contents[:4]==b'\x7fELF'
                      temp=Path('/tmp/deckcraft-android11-arm64-native.so')
                      temp.write_bytes(contents)
                      before=len(contents)
                      subprocess.run([str(strip),'--strip-unneeded',str(temp)],check=True)
                      contents=temp.read_bytes()
                      assert contents[:4]==b'\x7fELF' and len(contents)<before, 'Native strip did not reduce ELF'
                      print(f'Native ARM64 ELF stripped safely: {before:,} -> {len(contents):,} bytes ({(before-len(contents))/before:.1%} smaller)')
                  unsigned.writestr(entry,contents)
          assert saw_native,'Refusing APK without DeckCraft ARM64 native library'
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.14.1-android.13-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.14.1-android.13-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.14.1-android.13'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000017'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: 0.14.1-android.13, production package, ARM64, DEX, valid unsigned payload')
          PY
          (cd unsigned && sha256sum *.apk > SHA256SUMS.txt)
          cat > unsigned/README.txt <<'TXT'
          DeckCraft 0.14.1-android.13 ARM64 unsigned integration candidate.
          This artifact is unsigned. For device testing, use a disposable test key
          and uninstall the previous APK after backing up documents. Reserve the
          original DeckCraft production key for approved release candidates.
          Verify certificate SHA256 against installed DeckCraft Android.3
          (or its publicly released original-key APK) before installing.
          Based on PR #91; ports Android enhancements to official DeckCraft 0.14.1.
          Shared font scanning: 4 GiB byte/cache budget; 20 MiB per font.
          Source tests and compilation are not physical-device verification.
          Physical tablet testing and public release still require owner approval.
          TXT
          echo "### DeckCraft 0.14.1-android.13 unsigned ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo "Build complete; NO production signing or GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          cat unsigned/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified unsigned APK for Linux Lab signing
        uses: actions/upload-artifact@v4
        with:
          name: DeckCraft-v0.14.1-android.13-ARM64-UNSIGNED-LinuxLab
          path: unsigned/
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable builder signing key and build outputs
        if: always()
        shell: bash
        run: rm -rf builder/keys builder/output
