name: DeckCraft 0.13.1 Android integration unsigned (no release)
on:
  push:
    branches: [integration/deckcraft-features-20261031]
    paths:
      - '.github/workflows/deckcraft-v013-integration.yml'
      - 'deckcraft/**'
      - 'tools/approved-branding/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deckcraft-v013-integration
  cancel-in-progress: false
jobs:
  compile-unsigned:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/integration/deckcraft-features-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      ARTCRAFT_TARGET_SDK: '35'
    steps:
      - name: Checkout reviewed D/C/S PR branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DeckCraft source and scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile deckcraft/android/patch_dcs_host.py deckcraft/android/patch_unsaved_dcs.py deckcraft/android/patch_deckcraft_fonts.py deckcraft/android/patch_deckcraft_tablet.py deckcraft/android/patch_deckcraft_host.py
          test -s deckcraft/android/dcs_bridge.rs
          test -s deckcraft/android/dcs_java.inc
          test -s deckcraft/android/dcs_tests.rs
          test -s deckcraft/android/save_close.rs
          test -s tools/approved-branding/assets/DeckCraft.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('tools/approved-branding/assets/manifest.json').read_text())
          assert manifest['app']=='deckcraft'
          assert manifest['version_name']=='0.13.1-android.1'
          assert manifest['version_code']==100000005
          assert manifest['previous_version_code']==100000004
          assert manifest['package']=='com.artcraft.deckcraft'
          print('PASS: D/C/S sources and Android.4 metadata present')
          PY
      - name: Checkout pinned Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: builder
          persist-credentials: false
      - name: Checkout official stable DeckCraft v0.13.1
        uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: 4ce2944630b04188dee8504c14151994d06c416a
          path: builder/source/deckcraft
          persist-credentials: false
      - name: Checkout upstream UI dependency matched to DeckCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/egui
          ref: 6d518fc799681571963842f95b55a6b68431b15a
          path: egui-source
          persist-credentials: false
      - name: Checkout upstream windowing dependency with ordered IME reset
        uses: actions/checkout@v4
        with:
          repository: storytold/winit
          ref: a517b3846ee8457d84ee4975110bfda6797c44dc
          path: winit-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 4 GiB scan boundaries without allocating 4 GiB
        run: |
          mkdir -p /tmp/deck-font-tests
          javac -d /tmp/deck-font-tests deckcraft/android/FontScanBudget.java deckcraft/tests/FontScanBudgetTest.java
          java -cp /tmp/deck-font-tests FontScanBudgetTest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK, build tools and image dependency
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 -m pip install 'Pillow==11.3.0' 'toml==0.10.2'
      - name: Port current Android enhancements, D/C/S, fonts and recovery to official upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          test "$(git -C builder/source/deckcraft rev-parse HEAD)" = 4ce2944630b04188dee8504c14151994d06c416a
          python3 - <<'PY'
          from pathlib import Path
          source=Path('builder/source/deckcraft/Cargo.toml')
          s=source.read_text()
          old='version = "0.13.1"'
          assert s.count(old)==1, 'Official v0.13.1 source changed; stop'
          source.write_text(s.replace(old,'version = "0.13.1-android.1"',1))
          project=Path('builder/lib/android_project.py')
          s=project.read_text()
          formula='return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert s.count(formula)==1, 'Pinned version generator changed; stop'
          project.write_text(s.replace(formula,'return 100000005',1))
          PY
          python3 deckcraft/android/patch_v013_host.py builder
          python3 deckcraft/android/patch_shared_fonts.py builder
          python3 deckcraft/android/patch_update_settings.py builder
          python3 deckcraft/android/port_egui037.py builder egui-source winit-source
          git -C builder/source/deckcraft diff --check
          python3 deckcraft/android/adaptive_safe.py builder deckcraft
          python3 tools/approved-branding/approved_branding.py check
          python3 tools/approved-branding/approved_branding.py install builder deckcraft
          python3 - <<'PY'
          from pathlib import Path
          dialogs=Path('builder/source/deckcraft/crates/ui-egui/src/dialogs/body.rs').read_text()
          ui=Path('builder/source/deckcraft/crates/ui-egui/src/lib.rs').read_text()
          java=Path('builder/templates/android/SafActivity.java').read_text()
          assert 'deckcraft.unsaved.dcs' in dialogs
          assert 'android_pending_close' in ui
          assert 'AndroidSaveFinished' in Path('builder/source/deckcraft/crates/ui-egui/src/services.rs').read_text()
          assert 'dkUnsavedDialog' in java
          print('PASS: Android.4 D/C/S and acknowledged SAF behavior staged')
          PY
          python3 -m py_compile builder/lib/android_project.py
          bash -n builder/lib/build-common.sh
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.13.1-android.1.apk
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.13.1-android.1.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android4-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionName='0.13.1-android.1'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionCode='100000005'" /tmp/deckcraft-android4-badging.txt
          mkdir -p unsigned
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import sys
          src=Path(sys.argv[1])
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  unsigned.writestr(entry,original.read(entry.filename))
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.13.1-android.1-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.13.1-android.1-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.13.1-android.1'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000005'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: 0.13.1-android.1, production package, ARM64, DEX, valid unsigned payload')
          PY
          (cd unsigned && sha256sum *.apk > SHA256SUMS.txt)
          cat > unsigned/README.txt <<'TXT'
          DeckCraft 0.13.1-android.1 ARM64 unsigned integration candidate.
          This artifact cannot be installed until signed locally with the EXISTING
          DeckCraft production key. Never generate a new or shared key.
          Verify certificate SHA256 against installed DeckCraft Android.3
          (or its publicly released original-key APK) before installing.
          Based on PR #91; ports Android enhancements to official DeckCraft 0.13.1.
          Shared font scanning: 4 GiB byte/cache budget; 20 MiB per font.
          Source tests and compilation are not physical-device verification.
          Physical tablet testing and public release still require owner approval.
          TXT
          echo "### DeckCraft Android.4 unsigned ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo "Build complete; NO production signing or GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          cat unsigned/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified unsigned APK for Linux Lab signing
        uses: actions/upload-artifact@v4
        with:
          name: DeckCraft-v0.13.1-android.1-ARM64-UNSIGNED-LinuxLab
          path: unsigned/
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable builder signing key and build outputs
        if: always()
        shell: bash
        run: rm -rf builder/keys builder/output
