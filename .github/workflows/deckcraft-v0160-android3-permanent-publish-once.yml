          hits=[flt for flt in filters_for('deckcraft') if legacy in [d.get('mime_type') for d in flt.get('data',[])]]
          assert len(hits)==1, hits
          assert hits[0]['actions']==['android.intent.action.VIEW']
          assert hits[0]['categories']==['android.intent.category.DEFAULT']
          assert hits[0]['data']==[{'mime_type':legacy}]
          assert 'ppt' not in module.ASSOCIATIONS['deckcraft'], 'Never claim unsupported legacy PPT import'
          assert not any(legacy in str(flt) for flt in filters_for('wordcraft')), 'Do not change WordCraft'
          assert any('application/vnd.openxmlformats-officedocument.presentationml.presentation' in str(flt) for flt in filters_for('deckcraft')), 'PPTX association lost'
