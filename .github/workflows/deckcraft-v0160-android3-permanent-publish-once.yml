name: DeckCraft v0.16.0-android.3 OWNER-APPROVED ORIGINAL-SIGN AND PUBLISH ONCE
# Owner passed DeckCraft Android.3 device test and approved signing and publish 2026-11-07.
# This job uses the immutable device-tested source; production package differs
# from the separately installable candidate package, so must be rebuilt.
on:
  push:
    branches: [release/deckcraft-v0160-android3-original-sign-20261107]
    paths:
      - '.github/workflows/deckcraft-v0160-android3-permanent-publish-once.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: deckcraft-v0160-android3-prod-release-once
  cancel-in-progress: false
jobs:
  compile-unsigned:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/deckcraft-v0160-android3-original-sign-20261107' && github.event.head_commit.message == 'Owner-approved DeckCraft Android.3 permanent sign and stable publish (one-time)'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      ARTCRAFT_TARGET_SDK: '35'
      SOURCE_SHA: '227ea22107cb8b6cdb96c926be2d68510beada32'
      ORIGINAL_CERT_SHA256: '7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9'
      TAG: deckcraft-v0.16.0-android.3
    steps:
      - name: Checkout immutable OWNER-TESTED Android.3 source
        uses: actions/checkout@v4
        with:
          ref: 227ea22107cb8b6cdb96c926be2d68510beada32
          persist-credentials: false
      - name: Audit owner's successful device-tested Android.3 run and unused release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Already published, refuse overwrite"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists, refuse retarget"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42382107666" | jq -e --arg sha "$SOURCE_SHA" '
            .head_sha==$sha and .status=="completed" and .conclusion=="success" and
            .head_branch=="feature/deckcraft-v0160-android3-magicos-mime-test-20261107" and
            .name=="DeckCraft v0.16.0 Android.3 MagicOS MIME ARM64 TEST ONLY (NO RELEASE)"
          ' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13578542805" | jq -e '
            .name=="DeckCraft-v0.16.0-android.3-ARM64-TEMP-SIGNED-and-UNSIGNED"
            and (.expired|not) and .workflow_run.id==42382107666
          ' >/dev/null
          echo 'PASS: original Android.3 tested source and run; release tag unused'
      - name: Verify DeckCraft source and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6d6935753f07cedb557206c0c641d3250971c69e
          EXPECTED="$(printf '%s\n' .github/workflows/deckcraft-v0160-test.yml deckcraft/android/patch_v016_ctrlw.py deckcraft/android/patch_v016_magicos_mime.py deckcraft/android/patch_v016_menu.py deckcraft/android/patch_v016_pptx_save.py)"
          ACTUAL="$(git diff --name-only 6d6935753f07cedb557206c0c641d3250971c69e HEAD)"
          test "$ACTUAL" = "$EXPECTED" || { echo 'STOP: published baseline modifications detected'; exit 1; }
          test -s deckcraft/android/patch_v016_menu.py
          test -s deckcraft/android/patch_v016_ctrlw.py
          test -s deckcraft/android/patch_v016_pptx_save.py
          test -s deckcraft/android/patch_v016_magicos_mime.py
          test -s deckcraft/android/PHASE2_REBUILD_ONCE_20261104.md
          grep -Fx 'AUTHORIZED_PHASE2_PACKAGING_REPAIR_REBUILD_ONCE' deckcraft/android/PHASE2_REBUILD_ONCE_20261104.md
          test -s deckcraft/android/PHASE2_CORRECT_VERSION_ONCE_20261104.md
          grep -Fx 'OWNER_APPROVES_V0150_ANDROID1_ONE_TEST_20261104' deckcraft/android/PHASE2_CORRECT_VERSION_ONCE_20261104.md
          python3 -m py_compile deckcraft/android/patch_v016_menu.py deckcraft/android/patch_v016_ctrlw.py deckcraft/android/patch_v016_pptx_save.py deckcraft/android/patch_v016_magicos_mime.py deckcraft/android/patch_dcs_host.py deckcraft/android/patch_unsaved_dcs.py deckcraft/android/patch_deckcraft_fonts.py deckcraft/android/patch_deckcraft_tablet.py deckcraft/android/patch_deckcraft_host.py deckcraft/android/patch_gpu_diagnostics.py deckcraft/android/patch_gpu_cache.py deckcraft/android/patch_app_menu_updater.py
          test -s deckcraft/android/dcs_bridge.rs
          test -s deckcraft/android/dcs_java.inc
          test -s deckcraft/android/dcs_tests.rs
          test -s deckcraft/android/save_close.rs
          test -s tools/approved-branding/assets/DeckCraft.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('tools/approved-branding/assets/manifest.json').read_text())
          assert manifest['app']=='deckcraft'
          assert manifest['version_name']=='0.14.1-android.17'
          assert manifest['version_code']==100000021
          assert manifest['previous_version_code']==100000020
          assert manifest['package']=='com.artcraft.deckcraft'
          print('PASS: D/C/S sources and protected Android.17 branding metadata present')
          PY
      - name: Checkout pinned Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: builder
          persist-credentials: false
      - name: Checkout pinned official stable DeckCraft v0.16.0
        uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: a3e2254d3de32ed1718f156f070b54a34b949b54
          path: builder/source/deckcraft
          persist-credentials: false
      - name: Checkout upstream UI dependency matched to DeckCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/egui
          ref: 6d518fc799681571963842f95b55a6b68431b15a
          path: egui-source
          persist-credentials: false
      - name: Checkout upstream windowing dependency with ordered IME reset
        uses: actions/checkout@v4
        with:
          repository: storytold/winit
          ref: a517b3846ee8457d84ee4975110bfda6797c44dc
          path: winit-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 4 GiB scan boundaries without allocating 4 GiB
        run: |
          mkdir -p /tmp/deck-font-tests
          javac -d /tmp/deck-font-tests deckcraft/android/FontScanBudget.java deckcraft/tests/FontScanBudgetTest.java
          java -cp /tmp/deck-font-tests FontScanBudgetTest
      - name: Install patch-time Python dependencies
        run: python3 -m pip install 'Pillow==11.3.0' 'toml==0.10.2'
      - name: Port current Android enhancements, D/C/S, fonts and recovery to official upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          test "$(git -C builder/source/deckcraft rev-parse HEAD)" = a3e2254d3de32ed1718f156f070b54a34b949b54
          # Guard upstream identity and representative v0.16.0 fixes before any Android patches.
          python3 - <<'PY'
          from pathlib import Path
          base=Path('builder/source/deckcraft')
          assert 'version = "0.16.0"' in (base/'Cargo.toml').read_text()
          probes={
              'crates/fonts/src/fontdb.rs': 'is_monospace_family',
              'crates/engine/src/cmd/design/tests.rs': 'background_rejects_invalid_index',
              'crates/model/src/tests.rs': 'colour_alpha_follows_alpha_mod_and_off',
              'crates/ui-egui/src/backstage.rs': 'Page::About',
          }
          for file,marker in probes.items():
              assert marker in (base/file).read_text(), f'Upstream v0.16.0 change missing: {file} / {marker}'
          print('PASS: protected v0.16.0 source pin and representative upstream fixes')
          PY
          python3 - <<'PY'
          from pathlib import Path
          source=Path('builder/source/deckcraft/Cargo.toml')
          s=source.read_text()
          old='version = "0.16.0"'
          assert s.count(old)==1, 'Official v0.16.0 source changed; stop'
          source.write_text(s.replace(old,'version = "0.16.0-android.3"',1))
          project=Path('builder/lib/android_project.py')
          s=project.read_text()
          formula='return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert s.count(formula)==1, 'Pinned version generator changed; stop'
          project.write_text(s.replace(formula,'return 100000025',1))
          PY
          python3 deckcraft/android/patch_v013_host.py builder
          python3 deckcraft/android/patch_shared_fonts.py builder
          python3 deckcraft/android/patch_update_settings.py builder
          python3 deckcraft/android/port_egui037.py builder egui-source winit-source
          python3 deckcraft/android/patch_gpu_diagnostics.py builder
          python3 deckcraft/android/patch_gpu_cache.py builder
          python3 deckcraft/android/patch_app_menu_updater.py builder
          python3 deckcraft/android/patch_v016_menu.py builder
          python3 deckcraft/android/patch_v016_ctrlw.py builder
