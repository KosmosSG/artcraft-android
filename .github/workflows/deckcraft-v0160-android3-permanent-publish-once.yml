          java=Path('builder/templates/android/SafActivity.java').read_text()
          for marker in ('handleIncomingFiles(getIntent())', 'handleIncomingFiles(intent)', 'public String intentPoll()'):
              assert marker in java, marker
          kotlin=Path('builder/templates/android/SafActivity.java').read_text()
          assert 'private boolean dkCaptureCtrlW(' in kotlin
