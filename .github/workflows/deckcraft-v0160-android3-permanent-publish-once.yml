          print('PASS: grouped Dk menu, verified updater, PPTX ACTION_VIEW+EDIT, nonblocking PPTX Save As, IME Ctrl+W')
          # Verify MagicOS experiment is isolated to an additional DeckCraft VIEW-only filter.
          import importlib.util
          import toml
          spec=importlib.util.spec_from_file_location('associations_probe','builder/lib/file_associations.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          legacy='application/vnd.ms-powerpoint'
          def filters_for(app):
