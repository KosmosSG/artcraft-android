      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK, build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft -appname=DeckCraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.16.0-android.3.apk
          # Production package is original; Android.3 source and MIME filter are unchanged.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.16.0-android.3.apk | grep -F "name='com.artcraft.deckcraft'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree builder/output/deckcraft-0.16.0-android.3.apk AndroidManifest.xml > /tmp/deckcraft-v016-manifest.txt
          grep -F 'android.intent.action.VIEW' /tmp/deckcraft-v016-manifest.txt
          grep -F 'android.intent.action.EDIT' /tmp/deckcraft-v016-manifest.txt
          grep -F 'application/vnd.openxmlformats-officedocument.presentationml.presentation' /tmp/deckcraft-v016-manifest.txt
          grep -F 'application/vnd.ms-powerpoint' /tmp/deckcraft-v016-manifest.txt
          # Confirm the final APK offers both view/edit; MagicOS Settings visibility is OEM-controlled.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.16.0-android.3.apk | grep -F "application-label:'DeckCraft'"
          # Abort if any later packaging step reverted to Android.17.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.16.0-android.3.apk | grep -F "versionName='0.16.0-android.3'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.16.0-android.3.apk | grep -F "versionCode='100000025'"
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.16.0-android.3.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android4-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionName='0.16.0-android.3'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionCode='100000025'" /tmp/deckcraft-android4-badging.txt
          mkdir -p unsigned
          # The builder generates a new disposable key on this ephemeral checkout.
          test -s builder/keys/artcraft-builder.jks
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > unsigned/TEMP-SIGNATURE-VERIFICATION.txt
          cp "$APK" unsigned/DeckCraft-v0.16.0-android.3-arm64-v8a-TEMP-SIGNED.apk
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os, subprocess, sys
          src=Path(sys.argv[1])
          native='lib/arm64-v8a/libdeckcraft_android.so'
          strip=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          assert strip.is_file(),f'Android NDK LLVM strip unavailable: {strip}'
          saw_native=False
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  contents=original.read(entry.filename)
                  if entry.filename==native:
                      saw_native=True
                      assert contents[:4]==b'\x7fELF'
                      temp=Path('/tmp/deckcraft-android11-arm64-native.so')
                      temp.write_bytes(contents)
                      before=len(contents)
                      subprocess.run([str(strip),'--strip-unneeded',str(temp)],check=True)
                      contents=temp.read_bytes()
                      assert contents[:4]==b'\x7fELF' and len(contents)<before, 'Native strip did not reduce ELF'
                      print(f'Native ARM64 ELF stripped safely: {before:,} -> {len(contents):,} bytes ({(before-len(contents))/before:.1%} smaller)')
                  unsigned.writestr(entry,contents)
          assert saw_native,'Refusing APK without DeckCraft ARM64 native library'
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.16.0-android.3-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.16.0-android.3-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.16.0-android.3'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000025'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: 0.16.0-android.3 production package, ARM64, DEX, valid unsigned payload')
          PY
          (cd unsigned && sha256sum *.apk > SHA256SUMS.txt)
          cat > unsigned/README.txt <<'TXT'
          DeckCraft 0.16.0-android.3 ARM64 testing candidate.
          The TEMP-SIGNED APK uses a fresh disposable builder key, NOT the original
          production certificate. Back up documents before uninstalling existing DeckCraft.
          The UNSIGNED APK is also provided for independent disposable-key signing.
          Reserve the original key for owner-approved releases only.
          Test candidate package installs separately from production DeckCraft.
          Do not confuse this test certificate with an original-key release.
          Based on PR #91; ports Android enhancements to official DeckCraft 0.16.0.
          Shared font scanning: 4 GiB byte/cache budget; 20 MiB per font.
          Source tests and compilation are not physical-device verification.
          Android.3 experimentally advertises the legacy PowerPoint MIME as VIEW-only
          solely to test HONOR MagicOS default-app eligibility. This does NOT add
          or certify legacy binary .ppt import. Do not set this candidate as
          the persistent default for .ppt files; test with supported .pptx only.
          Physical tablet testing and public release still require owner approval.
          TXT
          echo "### DeckCraft 0.16.0-android.3 unsigned ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo 'Android.3 MagicOS VIEW-only legacy-MIME test; previous working features and modern PPTX handlers preserved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'EXPERIMENTAL: legacy .ppt import is NOT supported or advertised by extension; device-verify MagicOS defaults before any release.' >> "$GITHUB_STEP_SUMMARY"
          echo "Build complete; NO production signing or GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          cat unsigned/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Sign with EXISTING ORIGINAL DeckCraft certificate; verify bytes and identity
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DECKCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.DECKCRAFT_KEYSTORE_PASSWORD }}
          KEYALIAS: ${{ secrets.DECKCRAFT_KEY_ALIAS }}
          KEYPASS: ${{ secrets.DECKCRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_B64" || -z "$STOREPASS" || -z "$KEYALIAS" || -z "$KEYPASS" ]]; then
            echo "::error::Missing original DeckCraft signing secret"; exit 1
          fi
          keyfile="$RUNNER_TEMP/deckcraft-original.p12"
          certfile="$RUNNER_TEMP/deckcraft-original.pem"
          trap 'rm -f "$keyfile" "$certfile"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$keyfile" \
            -alias "$KEYALIAS" -storepass:env STOREPASS > "$certfile"
          actual="$(openssl x509 -in "$certfile" -outform DER | sha256sum | cut -d' ' -f1)"
          [[ "$actual" == "$ORIGINAL_CERT_SHA256" ]] || {
            echo "::error::Original signing certificate mismatch, refuse sign"; exit 1
          }
          input="unsigned/DeckCraft-v0.16.0-android.3-arm64-v8a-UNSIGNED.apk"
          mkdir -p verified-release
          output="verified-release/deckcraft-v0.16.0-android.3-arm64-v8a.apk"
          test -s "$input"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$input"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$input" >/dev/null 2>&1; then
            echo "::error::Unexpected signed input APK"; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keyfile" --ks-type PKCS12 --ks-key-alias "$KEYALIAS" \
            --ks-pass env:STOREPASS --key-pass env:KEYPASS \
            --v2-signing-enabled true --v4-signing-enabled false \
            --out "$output" "$input"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$output" > "$RUNNER_TEMP/signer-verified.txt"
          python3 - "$RUNNER_TEMP/signer-verified.txt" <<'PY'
          import os,re,sys
          report=open(sys.argv[1]).read()
          assert any(f'Verified using v{x} scheme (APK Signature Scheme v{x}): true' in report for x in (2,3))
          found=re.findall(r'^Signer #(\d+) certificate SHA-256 digest: ([a-fA-F0-9:]+)\s*$',report,re.M)
          assert len(found)==1 and found[0][0]=='1'
          assert found[0][1].replace(':','').lower()==os.environ['ORIGINAL_CERT_SHA256']
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$output" > "$RUNNER_TEMP/signed-badging.txt"
          grep -F "name='com.artcraft.deckcraft'" "$RUNNER_TEMP/signed-badging.txt"
          grep -F "versionName='0.16.0-android.3'" "$RUNNER_TEMP/signed-badging.txt"
          grep -F "versionCode='100000025'" "$RUNNER_TEMP/signed-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$output" AndroidManifest.xml > "$RUNNER_TEMP/signed-manifest.txt"
          grep -F 'application/vnd.openxmlformats-officedocument.presentationml.presentation' "$RUNNER_TEMP/signed-manifest.txt"
          grep -F 'application/vnd.ms-powerpoint' "$RUNNER_TEMP/signed-manifest.txt"
          python3 - "$input" "$output" <<'PY'
          import sys,hashlib,zipfile
          def payload(apk):
            with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
              assert 'classes.dex' in names
              assert not any(n.endswith(('.p12','.jks','.keystore')) for n in names)
              return {n:hashlib.sha256(z.read(n)).hexdigest() for n in names if not n.upper().startswith('META-INF/')}
          assert payload(sys.argv[1])==payload(sys.argv[2]),'Signing changed payload'
          print('PASS: Original-key-signed APK, payload unchanged by signing')
          PY
          printf '%s\n' "$actual" > verified-release/signing-certificate-sha256.txt
          (cd verified-release && sha256sum deckcraft-v0.16.0-android.3-arm64-v8a.apk > SHA256SUMS.txt)
          cat > verified-release/RELEASE-NOTES.md <<'NOTES'
          ## DeckCraft v0.16.0-android.3 — Stable ARM64

          Owner-tested on HONOR MagicPad 4 and expressly approved for original
          signing and publishing on 7 November 2026.
          Original tested source commit: 227ea22107cb8b6cdb96c926be2d68510beada32.
          Owner-tested GitHub Actions run: 42382107666.

          - Fixed MagicOS PowerPoint default-app discovery using an additional
            VIEW-only PowerPoint MIME registration.
          - .pptx file opening from HONOR Files, responsive Ctrl+W D/C/S during
            text editing, nonblocking .pptx Save As (no black screen).
          - Preserved approved Dk menu, Light/Dark selection, direct About,
            font import/shared fonts, app updater, touch/trackpad gestures,
            clipboard, keyboard tools, autosave and recovery.
          - Integrated official DeckCraft upstream v0.16.0.
          - The legacy PowerPoint MIME registration is only for Android file
            discovery. Legacy binary .ppt importing is NOT supported.
          - Compiled from identical pinned Android.3 tested application source,
            with production package identity instead of separate test package.
          - Signed using existing DeckCraft production certificate; supports
            in-place upgrades of earlier original-key DeckCraft installations.

          Package: com.artcraft.deckcraft
          Version: 0.16.0-android.3
          versionCode: 100000025
          Production certificate SHA256:
          7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9

          Back up documents before upgrading. The separate candidate package
          is not upgraded in place by this stable production APK.
          NOTES
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
      - name: Retain permanent-signed production APK as an independent handoff
        uses: actions/upload-artifact@v4
        with:
          name: DeckCraft-v0.16.0-android.3-ARM64-ORIGINAL-SIGNED-RELEASE-READY
          path: verified-release/
          retention-days: 14
          if-no-files-found: error
      - name: Publish once, preserving earlier stable releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DECKCRAFT_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing release, refuse overwrite"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Existing tag, refuse move"; exit 1
          fi
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
          test "$(tr -d '\r\n' < verified-release/signing-certificate-sha256.txt)" = "$ORIGINAL_CERT_SHA256"
          gh release create "$TAG" \
            verified-release/deckcraft-v0.16.0-android.3-arm64-v8a.apk \
            verified-release/SHA256SUMS.txt \
            verified-release/signing-certificate-sha256.txt \
            verified-release/RELEASE-NOTES.md \
            -R "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'DeckCraft v0.16.0-android.3 — Stable ARM64 (MagicOS PowerPoint Default)' \
            --notes-file verified-release/RELEASE-NOTES.md \
            --latest=false
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" --arg target "$SOURCE_SHA" '
            .tag_name==$tag and .draft==false and .prerelease==false and
            .target_commitish==$target and
            ([.assets[]|select(.name=="deckcraft-v0.16.0-android.3-arm64-v8a.apk" and .state=="uploaded")]|length)==1
          ' <<< "$published" >/dev/null
          echo 'SUCCESS: DeckCraft original-signed v0.16.0-android.3 published'
      - name: Erase original keystore, disposable key, APK copies from CI runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/deckcraft-original.p12" "$RUNNER_TEMP/deckcraft-original.pem" builder/keys builder/output unsigned verified-release
