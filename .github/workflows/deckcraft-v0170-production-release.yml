      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK, build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft -appname=DeckCraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.17.0-android.3.apk
          # Production-package identity must match the original published DeckCraft.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.17.0-android.3.apk | grep -F "name='com.artcraft.deckcraft'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree builder/output/deckcraft-0.17.0-android.3.apk AndroidManifest.xml > /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.VIEW' /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.EDIT' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.openxmlformats-officedocument.presentationml.presentation' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.ms-powerpoint' /tmp/deckcraft-v017-manifest.txt
          # Confirm the final APK offers both view/edit; MagicOS Settings visibility is OEM-controlled.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.17.0-android.3.apk | grep -F "application-label:'DeckCraft'"
          # Abort if any later packaging step reverted to Android.17.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.17.0-android.3.apk | grep -F "versionName='0.17.0-android.3'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.17.0-android.3.apk | grep -F "versionCode='100000028'"
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.17.0-android.3.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android4-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionName='0.17.0-android.3'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionCode='100000028'" /tmp/deckcraft-android4-badging.txt
          mkdir -p unsigned
          # The builder generates a new disposable key on this ephemeral checkout.
          test -s builder/keys/artcraft-builder.jks
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > unsigned/TEMP-SIGNATURE-VERIFICATION.txt
          # Never distribute the disposable-key intermediate APK.
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os, subprocess, sys
          src=Path(sys.argv[1])
          native='lib/arm64-v8a/libdeckcraft_android.so'
          strip=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          assert strip.is_file(),f'Android NDK LLVM strip unavailable: {strip}'
          saw_native=False
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  contents=original.read(entry.filename)
                  if entry.filename==native:
                      saw_native=True
                      assert contents[:4]==b'\x7fELF'
                      temp=Path('/tmp/deckcraft-android11-arm64-native.so')
                      temp.write_bytes(contents)
                      before=len(contents)
                      subprocess.run([str(strip),'--strip-unneeded',str(temp)],check=True)
                      contents=temp.read_bytes()
                      assert contents[:4]==b'\x7fELF' and len(contents)<before, 'Native strip did not reduce ELF'
                      print(f'Native ARM64 ELF stripped safely: {before:,} -> {len(contents):,} bytes ({(before-len(contents))/before:.1%} smaller)')
                  unsigned.writestr(entry,contents)
          assert saw_native,'Refusing APK without DeckCraft ARM64 native library'
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.17.0-android.3-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.17.0-android.3-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.17.0-android.3'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000028'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: 0.17.0-android.3, production package, ARM64, DEX, valid unsigned payload')
          PY
          echo 'PASS: clean unsigned production-package ARM64 payload'
      - name: Apply original key to production APK and validate signature and package
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DECKCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DECKCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DECKCRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export DECKCRAFT_KEYSTORE_PASSWORD="$STORE_PASSWORD"
          export DECKCRAFT_KEY_PASSWORD="$KEY_PASSWORD"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=unsigned/DeckCraft-v0.17.0-android.3-arm64-v8a-UNSIGNED.apk
          mkdir -p dist
          APK=dist/deckcraft-v0.17.0-android.3-arm64-v8a.apk
          test -s "$UNSIGNED" && test -s "$RUNNER_TEMP/deckcraft-prod.p12"
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/deckcraft-prod.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:DECKCRAFT_KEYSTORE_PASSWORD \
            --key-pass env:DECKCRAFT_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" "$UNSIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/deckcraft-verify.txt"
          certificate="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/deckcraft-verify.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          expected=7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9
          test "$certificate" = "$expected" || { echo '::error::Final signed APK certificate mismatch'; exit 1; }
          "$TOOLS/zipalign" -c -P 16 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/deckcraft-badging.txt"
          grep -F "name='com.artcraft.deckcraft'" "$RUNNER_TEMP/deckcraft-badging.txt"
          grep -F "versionName='0.17.0-android.3'" "$RUNNER_TEMP/deckcraft-badging.txt"
          grep -F "versionCode='100000028'" "$RUNNER_TEMP/deckcraft-badging.txt"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names=archive.namelist()
              assert archive.testzip() is None
              assert len(names)==len(set(names))
              libs=[x for x in names if x.startswith('lib/') and x.endswith('.so')]
              assert libs and all(x.startswith('lib/arm64-v8a/') for x in libs), libs
              assert 'classes.dex' in names
              assert not any(x.lower().endswith(('.jks','.p12','.keystore')) for x in names)
          print('PASS: signed APK verified, ARM64-only ELF, valid DEX, no key material')
          PY
          (cd dist && sha256sum deckcraft-v0.17.0-android.3-arm64-v8a.apk > SHA256SUMS.txt)
          printf '%s\n' "$expected" > dist/signing-certificate-sha256.txt
      - name: Create release notes with device-test provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/RELEASE-NOTES.md <<'EOF'
          ## DeckCraft v0.17.0-android.3 — Stable ARM64

          Approved on HONOR MagicPad 4 on 10 November 2026. Integrates the
          official Storytold DeckCraft v0.17.0 upstream (fc51f46c83067da0f0425204fb8a2e5270e114be).

          - Keeps compact Dk menu, original icon, Appearance, font import/shared/refresh with 5,000 files / 4 GiB limit, updater, ESC/keyboard shortcuts, Ctrl+W D/C/S, clipboard, recovery, and previously approved touch/trackpad behavior.
          - Dk > App Updates now uses PhotoCraft-style direct startup and preview-release toggles, visible checkmarks synchronized with saved preferences, bottom ON/OFF feedback, and no startup settings popup.
          - Preserves .pptx open and nonblocking Save As, plus the HONOR MagicOS VIEW-only legacy PowerPoint MIME discovery workaround. Legacy binary .ppt import is NOT supported.
          - ARM64-only optimized and verified APK; upgrade-safe original signing certificate.

          Package: com.artcraft.deckcraft
          versionName: 0.17.0-android.3
          versionCode: 100000028
          Signing certificate SHA256: 7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9

          Owner-tested source commit: fa8d5b55613850ff5c68280b612ee133fd975380
          Owner-tested Actions run: 42844571315
          Owner-approved test was an otherwise equivalent separately installable temporary-key APK.
          This production package was rebuilt from the same code with the original production signing identity, to update previous official DeckCraft installations.
          Back up documents before updating. The separate temporary candidate is not updated in place.
          EOF
      - name: Publish new stable tag and verified assets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'KosmosSG/artcraft-android'
          test "$GITHUB_REF" = 'refs/heads/integration/deckcraft-upstream-20261110'
          tag=deckcraft-v0.17.0-android.3
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release already exists'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo '::error::Refusing existing tag'; exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test "$(cat dist/signing-certificate-sha256.txt)" = 7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9
          gh release create "$tag" \
            dist/deckcraft-v0.17.0-android.3-arm64-v8a.apk \
            dist/SHA256SUMS.txt dist/signing-certificate-sha256.txt dist/RELEASE-NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeckCraft v0.17.0-android.3 — Stable ARM64" \
            --notes-file dist/RELEASE-NOTES.md --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/deckcraft-release.json"
          python3 - "$RUNNER_TEMP/deckcraft-release.json" <<'PY'
          import json,sys
          release=json.load(open(sys.argv[1]))
          assert not release['isDraft'] and not release['isPrerelease']
          assets={a['name'] for a in release['assets']}
          for name in ('deckcraft-v0.17.0-android.3-arm64-v8a.apk','SHA256SUMS.txt','signing-certificate-sha256.txt','RELEASE-NOTES.md'):
              assert name in assets,name
          print('PASS: stable DeckCraft release published:',release['url'])
          PY
          echo '### DeckCraft v0.17.0-android.3 original-key stable release' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Purge signing material and disposable build outputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deckcraft-prod.p12" "$RUNNER_TEMP/deckcraft-prod.pem"
          rm -rf builder/keys builder/output unsigned
