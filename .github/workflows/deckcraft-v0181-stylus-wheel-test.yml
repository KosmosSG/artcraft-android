          import toml
          spec=importlib.util.spec_from_file_location('associations_probe','builder/lib/file_associations.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          legacy='application/vnd.ms-powerpoint'
          def filters_for(app):
              return toml.loads('intent_filter = '+module.intent_filter_toml(app))['intent_filter']
          hits=[flt for flt in filters_for('deckcraft') if legacy in [d.get('mime_type') for d in flt.get('data',[])]]
