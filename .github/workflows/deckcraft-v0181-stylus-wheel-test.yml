          print('PASS: Android.12 native egui trackpad smoothing only; no double-filter/inertia; arrows/clipboard stable')
          print('PASS: Android two-finger pan reaches canvas after hover cancellation and does not navigate on fitted page')
          print('PASS: Android canvas pinch fallback scoped by touch origin; existing wheel zoom retained')
          print('PASS: Android.4 blocking modal and focus, eager D/C/S, selectable theme, left menus')
          print('PASS: modal D/C/S captured before UI; Esc/Back cannot exit with open document')
          print('PASS: Android.4 D/C/S and acknowledged SAF behavior staged')
          PY
          python3 -m py_compile builder/lib/android_project.py
          bash -n builder/lib/build-common.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK, build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft.candidate.v0181a1 -appname=DeckCraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.18.1-android.1.apk
          # Ensure candidate is separate, and that Android can offer PPTX 'Open with'.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.1.apk | grep -F "name='com.artcraft.deckcraft.candidate.v0181a1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree builder/output/deckcraft-0.18.1-android.1.apk AndroidManifest.xml > /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.VIEW' /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.EDIT' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.openxmlformats-officedocument.presentationml.presentation' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.ms-powerpoint' /tmp/deckcraft-v017-manifest.txt
          # Confirm the final APK offers both view/edit; MagicOS Settings visibility is OEM-controlled.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.1.apk | grep -F "application-label:'DeckCraft'"
          # Abort if any later packaging step reverted to Android.17.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.1.apk | grep -F "versionName='0.18.1-android.1'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.1.apk | grep -F "versionCode='100000029'"
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.18.1-android.1.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android4-badging.txt
          grep -F "name='com.artcraft.deckcraft.candidate.v0181a1'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionName='0.18.1-android.1'" /tmp/deckcraft-android4-badging.txt
          grep -F "versionCode='100000029'" /tmp/deckcraft-android4-badging.txt
          mkdir -p unsigned
          # The builder generates a new disposable key on this ephemeral checkout.
          test -s builder/keys/artcraft-builder.jks
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > unsigned/TEMP-SIGNATURE-VERIFICATION.txt
          cp "$APK" unsigned/DeckCraft-v0.18.1-android.1-arm64-v8a-TEMP-SIGNED.apk
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os, subprocess, sys
          src=Path(sys.argv[1])
          native='lib/arm64-v8a/libdeckcraft_android.so'
          strip=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          assert strip.is_file(),f'Android NDK LLVM strip unavailable: {strip}'
          saw_native=False
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  contents=original.read(entry.filename)
                  if entry.filename==native:
                      saw_native=True
                      assert contents[:4]==b'\x7fELF'
                      temp=Path('/tmp/deckcraft-v0181-arm64-native.so')
                      temp.write_bytes(contents)
                      before=len(contents)
                      subprocess.run([str(strip),'--strip-unneeded',str(temp)],check=True)
                      contents=temp.read_bytes()
                      assert contents[:4]==b'\x7fELF' and len(contents)<before, 'Native strip did not reduce ELF'
                      print(f'Native ARM64 ELF stripped safely: {before:,} -> {len(contents):,} bytes ({(before-len(contents))/before:.1%} smaller)')
                  unsigned.writestr(entry,contents)
          assert saw_native,'Refusing APK without DeckCraft ARM64 native library'
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.18.1-android.1-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.18.1-android.1-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft.candidate.v0181a1'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.18.1-android.1'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000029'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: 0.18.1-android.1, SEPARATE TEST package, ARM64, DEX, valid unsigned payload')
          PY
          (cd unsigned && sha256sum *.apk > SHA256SUMS.txt)
          cat > unsigned/README.txt <<'TXT'
          DeckCraft 0.18.1-android.1 ARM64 testing candidate.
          The TEMP-SIGNED APK uses a fresh disposable builder key, NOT the original
          production certificate. Back up documents before uninstalling existing DeckCraft.
          The UNSIGNED APK is also provided for independent disposable-key signing.
          Reserve the original key for owner-approved releases only.
          Test candidate package installs separately from production DeckCraft.
          Do not confuse this test certificate with an original-key release.
          Preserves Android v0.17 published features while testing official upstream v0.18.1.
          Adds PhotoCraft-style 8-slot wheel, burgundy/coral Dk hub and live customization.
          Shared font scanning: 4 GiB byte/cache budget; 20 MiB per font.
          Source tests and compilation are not physical-device verification.
          Android.3 retains the tested experimental filter that advertises the legacy PowerPoint MIME as VIEW-only
          solely to test HONOR MagicOS default-app eligibility. This does NOT add
          or certify legacy binary .ppt import. Do not set this candidate as
          the persistent default for .ppt files; test with supported .pptx only.
          Physical tablet testing and public release still require owner approval.
          TXT
          echo "### DeckCraft 0.18.1-android.1 unsigned ARM64" >> "$GITHUB_STEP_SUMMARY"
          echo 'Android.3 upstream 0.18.1 and retained MagicOS VIEW-only MIME test; previous working features and modern PPTX handlers preserved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'EXPERIMENTAL: legacy .ppt import is NOT supported or advertised by extension; device-verify MagicOS defaults before any release.' >> "$GITHUB_STEP_SUMMARY"
          echo "Build complete; NO production signing or GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          cat unsigned/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload temporary-signed and unsigned ARM64 testing APKs
        uses: actions/upload-artifact@v4
        with:
          name: DeckCraft-v0.18.1-android.1-ARM64-TEMP-SIGNED-and-UNSIGNED
          path: unsigned/
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable builder signing key and build outputs
        if: always()
        shell: bash
        run: rm -rf builder/keys builder/output
