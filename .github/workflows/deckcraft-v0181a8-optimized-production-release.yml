      - name: Install Android NDK, build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Test save acknowledgement and font rendering
        working-directory: builder/source/deckcraft
        run: cargo test -p deckcraft-ui-egui --lib android_
      - name: Compile DeckCraft integration ARM64 (disposable packaging key only)
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          bash builder/build.sh -deckcraft -packagename=com.artcraft.deckcraft -appname=DeckCraft -appicon="$GITHUB_WORKSPACE/tools/approved-branding/assets/DeckCraft.png"
          test -s builder/output/deckcraft-0.18.1-android.8.apk
          # Ensure candidate is separate, and that Android can offer PPTX 'Open with'.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.8.apk | grep -F "name='com.artcraft.deckcraft'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree builder/output/deckcraft-0.18.1-android.8.apk AndroidManifest.xml > /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.VIEW' /tmp/deckcraft-v017-manifest.txt
          grep -F 'android.intent.action.EDIT' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.openxmlformats-officedocument.presentationml.presentation' /tmp/deckcraft-v017-manifest.txt
          grep -F 'application/vnd.ms-powerpoint' /tmp/deckcraft-v017-manifest.txt
          # Confirm the final APK offers both view/edit; MagicOS Settings visibility is OEM-controlled.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.8.apk | grep -F "application-label:'DeckCraft'"
          # Abort if any later packaging step reverted to Android.17.
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.8.apk | grep -F "versionName='0.18.1-android.8'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging builder/output/deckcraft-0.18.1-android.8.apk | grep -F "versionCode='100000036'"
      - name: Strip disposable signature, validate unsigned APK and record SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=builder/output/deckcraft-0.18.1-android.8.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/deckcraft-android8-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-android8-badging.txt
          grep -F "versionName='0.18.1-android.8'" /tmp/deckcraft-android8-badging.txt
          grep -F "versionCode='100000036'" /tmp/deckcraft-android8-badging.txt
          mkdir -p unsigned
          # The builder generates a new disposable key on this ephemeral checkout.
          test -s builder/keys/artcraft-builder.jks
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > unsigned/TEMP-SIGNATURE-VERIFICATION.txt
          python3 - "$APK" <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import os, subprocess, sys
          src=Path(sys.argv[1])
          native='lib/arm64-v8a/libdeckcraft_android.so'
          strip=Path(os.environ['ANDROID_NDK_HOME'])/'toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          assert strip.is_file(),f'Android NDK LLVM strip unavailable: {strip}'
          saw_native=False
          with ZipFile(src) as original, ZipFile('unsigned/unsigned-before-align.apk','w') as unsigned:
              for entry in original.infolist():
                  upper=entry.filename.upper()
                  if upper.startswith('META-INF/') and (upper.endswith(('.RSA','.DSA','.EC','.SF','.MF')) or upper.startswith('META-INF/SIG-')):
                      continue
                  contents=original.read(entry.filename)
                  if entry.filename==native:
                      saw_native=True
                      assert contents[:4]==b'\x7fELF'
                      temp=Path('/tmp/deckcraft-v0181a8-arm64-native.so')
                      temp.write_bytes(contents)
                      before=len(contents)
                      subprocess.run([str(strip),'--strip-unneeded',str(temp)],check=True)
                      contents=temp.read_bytes()
                      assert contents[:4]==b'\x7fELF' and len(contents)<before, 'Native strip did not reduce ELF'
                      print(f'Native ARM64 ELF stripped safely: {before:,} -> {len(contents):,} bytes ({(before-len(contents))/before:.1%} smaller)')
                  unsigned.writestr(entry,contents)
          assert saw_native,'Refusing APK without DeckCraft ARM64 native library'
          PY
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 unsigned/unsigned-before-align.apk unsigned/DeckCraft-v0.18.1-android.8-arm64-v8a-UNSIGNED.apk
          rm unsigned/unsigned-before-align.apk
          FINAL=unsigned/DeckCraft-v0.18.1-android.8-arm64-v8a-UNSIGNED.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$FINAL"
          if "$BUILD_TOOLS/apksigner" verify "$FINAL" >/dev/null 2>&1; then
              echo "::error::Temporary signing certificate still valid; refusing unsigned artifact"
              exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$FINAL" > /tmp/deckcraft-unsigned-badging.txt
          grep -F "name='com.artcraft.deckcraft'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionName='0.18.1-android.8'" /tmp/deckcraft-unsigned-badging.txt
          grep -F "versionCode='100000036'" /tmp/deckcraft-unsigned-badging.txt
          python3 - "$FINAL" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs),libs
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in names)
          print('PASS: production package, arm64, DEX and unsigned optimized ELF')
          PY
          (cd unsigned && sha256sum *.apk > SHA256SUMS.txt)
