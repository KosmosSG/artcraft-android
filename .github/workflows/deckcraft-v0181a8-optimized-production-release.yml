name: DeckCraft v0.18.1 Android.8 OPTIMIZED ORIGINAL-SIGNED STABLE RELEASE
on:
  push:
    branches: [release/deckcraft-v0181-android8-optimized-20261114]
    paths:
      - '.github/workflows/deckcraft-v0181a8-optimized-production-release.yml'
      - 'deckcraft/android/patch_v016_menu.py'
      - 'deckcraft/android/patch_v017_photocraft_updates.py'
      - 'deckcraft/android/patch_v017_checked_updates.py'
      - 'deckcraft/android/patch_v018_stylus_wheel.py'
      - 'deckcraft/android/patch_v0181_android2_polish.py'
      - 'deckcraft/android/patch_v0181_android3_brand_hub_slider.py'
      - 'deckcraft/android/patch_v0181_android4_wheel_dialog.py'
      - 'deckcraft/android/patch_v0181_android5_dk_logo_scale.py'
      - 'deckcraft/android/patch_v0181_android6_photocraft_wheel_parity.py'
      - 'deckcraft/android/patch_v0181_android7_gray_hub_defaults_hover.py'
      - 'deckcraft/android/patch_v0181_android8_native_hover_delivery.py'
      - 'deckcraft/android/stylus_wheel.rs'
      - 'deckcraft/android/patch_v016_ctrlw.py'
      - 'deckcraft/android/patch_v016_pptx_save.py'
      - 'deckcraft/android/patch_v016_magicos_mime.py'
permissions:
  contents: write
concurrency:
  group: deckcraft-v0181a8-original-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sign-and-publish:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/deckcraft-v0181-android8-optimized-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      ARTCRAFT_TARGET_SDK: '35'
    steps:
      - name: Checkout protected published DeckCraft v0.17.0-android.3 source baseline
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify DeckCraft source and scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6aaa775a26c0380067f3044d547f84eedaebb2b7
          EXPECTED="$(printf '%s\n' .github/workflows/deckcraft-v0181-stylus-wheel-test.yml .github/workflows/deckcraft-v0181a2-wheel-polish-test.yml .github/workflows/deckcraft-v0181a3-wheel-polish-test.yml .github/workflows/deckcraft-v0181a4-wheel-dialog-test.yml .github/workflows/deckcraft-v0181a5-dk-logo-test.yml .github/workflows/deckcraft-v0181a6-photocraft-wheel-test.yml .github/workflows/deckcraft-v0181a7-wheel-gray-hover-test.yml .github/workflows/deckcraft-v0181a8-coldstart-hover-test.yml .github/workflows/deckcraft-v0181a8-optimized-production-release.yml deckcraft/android/patch_v0181_android2_polish.py deckcraft/android/patch_v0181_android3_brand_hub_slider.py deckcraft/android/patch_v0181_android4_wheel_dialog.py deckcraft/android/patch_v0181_android5_dk_logo_scale.py deckcraft/android/patch_v0181_android6_photocraft_wheel_parity.py deckcraft/android/patch_v0181_android7_gray_hub_defaults_hover.py deckcraft/android/patch_v0181_android8_native_hover_delivery.py deckcraft/android/patch_v018_stylus_wheel.py deckcraft/android/stylus_wheel.rs)"
          ACTUAL="$(git diff --name-only 6aaa775a26c0380067f3044d547f84eedaebb2b7 HEAD)"
          test "$ACTUAL" = "$EXPECTED" || { echo 'STOP: published baseline modifications detected'; exit 1; }
          git fetch --depth=1 origin 38e7a806be8229a3eb739775eb892e2503141392
          test "$(git diff --name-only 38e7a806be8229a3eb739775eb892e2503141392 HEAD)" = '.github/workflows/deckcraft-v0181a8-optimized-production-release.yml' || { echo '::error::Android.8 tested source must remain unchanged'; exit 1; }
          test -s deckcraft/android/patch_v016_menu.py
          test -s deckcraft/android/patch_v017_photocraft_updates.py
          test -s deckcraft/android/patch_v017_checked_updates.py
          test -s deckcraft/android/patch_v0181_android2_polish.py
          test -s deckcraft/android/patch_v0181_android3_brand_hub_slider.py
          test -s deckcraft/android/patch_v0181_android4_wheel_dialog.py
          test -s deckcraft/android/patch_v0181_android5_dk_logo_scale.py
          test -s deckcraft/android/patch_v0181_android6_photocraft_wheel_parity.py
          test -s deckcraft/android/patch_v0181_android7_gray_hub_defaults_hover.py
          test -s deckcraft/android/patch_v0181_android8_native_hover_delivery.py
          test -s docs/ARTCRAFT_ANDROID_UPDATE_MENU_STANDARD.md
          test -s deckcraft/android/patch_v016_ctrlw.py
          test -s deckcraft/android/patch_v016_pptx_save.py
          test -s deckcraft/android/patch_v016_magicos_mime.py
          test -s deckcraft/android/PHASE2_REBUILD_ONCE_20261104.md
          grep -Fx 'AUTHORIZED_PHASE2_PACKAGING_REPAIR_REBUILD_ONCE' deckcraft/android/PHASE2_REBUILD_ONCE_20261104.md
          test -s deckcraft/android/PHASE2_CORRECT_VERSION_ONCE_20261104.md
          grep -Fx 'OWNER_APPROVES_V0150_ANDROID1_ONE_TEST_20261104' deckcraft/android/PHASE2_CORRECT_VERSION_ONCE_20261104.md
          python3 -m py_compile deckcraft/android/patch_v0181_android4_wheel_dialog.py
          python3 -m py_compile deckcraft/android/patch_v0181_android5_dk_logo_scale.py
          python3 -m py_compile deckcraft/android/patch_v0181_android6_photocraft_wheel_parity.py
          python3 -m py_compile deckcraft/android/patch_v0181_android7_gray_hub_defaults_hover.py
          python3 -m py_compile deckcraft/android/patch_v0181_android8_native_hover_delivery.py
          python3 -m py_compile deckcraft/android/patch_v0181_android3_brand_hub_slider.py
          python3 -m py_compile deckcraft/android/patch_v0181_android2_polish.py
          python3 -m py_compile deckcraft/android/patch_v018_stylus_wheel.py
          python3 -m py_compile deckcraft/android/patch_v017_checked_updates.py deckcraft/android/patch_v017_photocraft_updates.py deckcraft/android/patch_v016_menu.py deckcraft/android/patch_v016_ctrlw.py deckcraft/android/patch_v016_pptx_save.py deckcraft/android/patch_v016_magicos_mime.py deckcraft/android/patch_dcs_host.py deckcraft/android/patch_unsaved_dcs.py deckcraft/android/patch_deckcraft_fonts.py deckcraft/android/patch_deckcraft_tablet.py deckcraft/android/patch_deckcraft_host.py deckcraft/android/patch_gpu_diagnostics.py deckcraft/android/patch_gpu_cache.py deckcraft/android/patch_app_menu_updater.py
          test -s deckcraft/android/dcs_bridge.rs
          test -s deckcraft/android/dcs_java.inc
          test -s deckcraft/android/dcs_tests.rs
          test -s deckcraft/android/save_close.rs
          test -s tools/approved-branding/assets/DeckCraft.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('tools/approved-branding/assets/manifest.json').read_text())
          assert manifest['app']=='deckcraft'
          assert manifest['version_name']=='0.14.1-android.17'
          assert manifest['version_code']==100000021
          assert manifest['previous_version_code']==100000020
          assert manifest['package']=='com.artcraft.deckcraft'
          print('PASS: D/C/S sources and protected Android.17 branding metadata present')
          PY
      - name: Verify original production signing identity before compilation
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DECKCRAFT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DECKCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DECKCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DECKCRAFT_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'KosmosSG/artcraft-android'
          test "$GITHUB_REF" = 'refs/heads/release/deckcraft-v0181-android8-optimized-20261114'
          test -n "$KEYSTORE_B64" || { echo '::error::Original DeckCraft KEYSTORE secret missing'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo '::error::Original DeckCraft STORE PASSWORD missing'; exit 1; }
          test -n "$KEY_ALIAS" || { echo '::error::Original DeckCraft KEY ALIAS missing'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo '::error::Original DeckCraft KEY PASSWORD missing'; exit 1; }
          if gh release view deckcraft-v0.18.1-android.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This release already exists; refusing overwrite"; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/deckcraft-v0.18.1-android.8" >/dev/null 2>&1; then
            echo "::error::This tag already exists; refusing overwrite"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/deckcraft-prod.p12"
          test -s "$RUNNER_TEMP/deckcraft-prod.p12"
          keytool -exportcert -rfc -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/deckcraft-prod.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/deckcraft-prod.pem"
          actual="$(openssl x509 -in "$RUNNER_TEMP/deckcraft-prod.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected=7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9
          test "$actual" = "$expected" || {
            echo "::error::Production keystore does not match previously published DeckCraft signing certificate"; exit 1;
          }
          echo 'PASS: Original DeckCraft production signing certificate continuity verified'
      - name: Checkout pinned Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: builder
          persist-credentials: false
      - name: Checkout pinned official stable DeckCraft v0.18.1
        uses: actions/checkout@v4
        with:
          repository: storytold/deckcraft
          ref: 7cc73ab1895ed2e30c8afbcada20c70b9ea0a440
          path: builder/source/deckcraft
          persist-credentials: false
      - name: Checkout upstream UI dependency matched to DeckCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/egui
          ref: 6d518fc799681571963842f95b55a6b68431b15a
          path: egui-source
          persist-credentials: false
      - name: Checkout upstream windowing dependency with ordered IME reset
        uses: actions/checkout@v4
        with:
          repository: storytold/winit
          ref: a517b3846ee8457d84ee4975110bfda6797c44dc
          path: winit-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 4 GiB scan boundaries without allocating 4 GiB
        run: |
          mkdir -p /tmp/deck-font-tests
          javac -d /tmp/deck-font-tests deckcraft/android/FontScanBudget.java deckcraft/tests/FontScanBudgetTest.java
          java -cp /tmp/deck-font-tests FontScanBudgetTest
      - name: Install patch-time Python dependencies
        run: python3 -m pip install 'Pillow==11.3.0' 'toml==0.10.2'
      - name: Port current Android enhancements, D/C/S, fonts and recovery to official upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          test "$(git -C builder/source/deckcraft rev-parse HEAD)" = 7cc73ab1895ed2e30c8afbcada20c70b9ea0a440
          # Guard upstream identity and representative v0.18.1 fixes before any Android patches.
          python3 - <<'PY'
          from pathlib import Path
          base=Path('builder/source/deckcraft')
          assert 'version = "0.18.1"' in (base/'Cargo.toml').read_text()
          probes={
              'crates/fonts/src/fontdb.rs': 'is_monospace_family',
              'crates/engine/src/cmd/design/tests.rs': 'background_rejects_invalid_index',
              'crates/model/src/tests.rs': 'colour_alpha_follows_alpha_mod_and_off',
              'crates/ui-egui/src/backstage.rs': 'Page::About',
          }
          for file,marker in probes.items():
              assert marker in (base/file).read_text(), f'Upstream v0.18.1 change missing: {file} / {marker}'
          print('PASS: protected v0.18.1 source pin and representative upstream fixes')
          PY
          python3 - <<'PY'
          from pathlib import Path
          source=Path('builder/source/deckcraft/Cargo.toml')
          s=source.read_text()
          old='version = "0.18.1"'
          assert s.count(old)==1, 'Official v0.18.1 source changed; stop'
          source.write_text(s.replace(old,'version = "0.18.1-android.8"',1))
          project=Path('builder/lib/android_project.py')
          s=project.read_text()
          formula='return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert s.count(formula)==1, 'Pinned version generator changed; stop'
          project.write_text(s.replace(formula,'return 100000036',1))
          PY
          python3 deckcraft/android/patch_v013_host.py builder
          python3 deckcraft/android/patch_shared_fonts.py builder
          python3 deckcraft/android/patch_update_settings.py builder
          python3 deckcraft/android/port_egui037.py builder egui-source winit-source
          python3 deckcraft/android/patch_gpu_diagnostics.py builder
          python3 deckcraft/android/patch_gpu_cache.py builder
          python3 deckcraft/android/patch_app_menu_updater.py builder
          python3 deckcraft/android/patch_v016_menu.py builder
          python3 deckcraft/android/patch_v016_ctrlw.py builder
          python3 deckcraft/android/patch_v016_pptx_save.py builder
          python3 deckcraft/android/patch_v016_magicos_mime.py builder
          python3 deckcraft/android/patch_v017_photocraft_updates.py builder
          python3 deckcraft/android/patch_v017_checked_updates.py builder
          python3 deckcraft/android/patch_v018_stylus_wheel.py builder
          python3 deckcraft/android/patch_v0181_android2_polish.py builder tools/approved-branding/assets/DeckCraft.png
          python3 deckcraft/android/patch_v0181_android3_brand_hub_slider.py builder tools/approved-branding/assets/DeckCraft.png
          python3 deckcraft/android/patch_v0181_android4_wheel_dialog.py builder
          python3 deckcraft/android/patch_v0181_android5_dk_logo_scale.py builder
          python3 deckcraft/android/patch_v0181_android6_photocraft_wheel_parity.py builder
          python3 deckcraft/android/patch_v0181_android7_gray_hub_defaults_hover.py builder
          python3 deckcraft/android/patch_v0181_android8_native_hover_delivery.py builder
          python3 - <<'PY'
          from pathlib import Path
          ui=Path('builder/source/deckcraft/crates/ui-egui/src/lib.rs').read_text()
          for marker in ('App Updates', 'Appearance', 'Presentation Shortcuts', 'About DeckCraft',
                         'app.checkUpdates', 'app.updateSettings'):
              assert marker in ui, marker
          associations=Path('builder/lib/file_associations.py').read_text()
          for marker in ('"deckcraft": ["deckcraft", "pptx", "potx", "ppsx"]',
                         'application/vnd.openxmlformats-officedocument.presentationml.presentation',
                         'android.intent.action.VIEW'):
              assert marker in associations, marker
          java=Path('builder/templates/android/SafActivity.java').read_text()
          for marker in ('handleIncomingFiles(getIntent())', 'handleIncomingFiles(intent)', 'public String intentPoll()'):
              assert marker in java, marker
          kotlin=Path('builder/templates/android/SafActivity.java').read_text()
          assert 'private boolean dkCaptureCtrlW(' in kotlin
          assert 'public boolean onKeyShortcut(' in kotlin
          assert 'Intent.ACTION_EDIT.equals(action)' in kotlin
          files=Path('builder/source/deckcraft/crates/ui-egui/src/app/files.rs').read_text()
          assert 'deckcraft_engine::cmd::file::save_bytes(&doc.doc, "pptx")' in files
          assert 'setTitle("Startup Update Settings")' not in java
          for marker in ('public void deckUpdateSettings()', 'public void deckPreviewSettings()',
                         'Dk Update checks at startup: ', 'Dk Preview releases: '):
              assert marker in java, marker
          for marker in ('Toggle Update Check at Startup', 'Toggle Preview Releases'):
              assert marker in ui, marker
          assert java.count('deckWriteMenuFlags();') == 3
          assert 'deckcraft-updates-flags.txt' in java
          assert '✓  Toggle Update Check at Startup' in ui
          assert '✓  Toggle Preview Releases' in ui
          assert 'mod android_wheel' in ui
          assert 'Stylus Wheel' in ui
          assert 'android_wheel::overlay(self, &ctx)' in Path('builder/source/deckcraft/crates/ui-egui/src/app.rs').read_text()
          wheel=Path('builder/source/deckcraft/crates/ui-egui/src/android_wheel.rs').read_text()
          for s in ('Wheel size', 'Opacity', 'deckcraft-stylus-wheel.v1', 'PointerGone',
                    'Dk', 'PINK', 'BURGUNDY'):
              assert s in wheel, s
          assert 'dkWheelTakeSignal' in java
          assert 'dkWheelTakeHover' in java
          assert 'dispatchGenericMotionEvent' in java
          assert 'pub fn paint_monochrome' in Path('builder/source/deckcraft/crates/ui-egui/src/icons.rs').read_text()
          assert 'deckcraft.wheel.hover.raw' in wheel
          assert 'approved_dk_logo' in wheel
          assert 'deckcraft_slider(ui, "Wheel size"' in wheel
          assert 'deckcraft_slider(ui, "Opacity"' in wheel
          assert 'const DEFAULT_SIZE: f32 = 75.0;' in wheel
          assert 'const DEFAULT_OPACITY: f32 = 100.0;' in wheel
          assert 'size: DEFAULT_SIZE, opacity: DEFAULT_OPACITY' in wheel
          assert 'w.size=DEFAULT_SIZE;' in wheel and 'w.opacity=DEFAULT_OPACITY;' in wheel
          assert 'Stylus Wheel — Default' in wheel
          assert 'PhotoCraft-style wheel' not in wheel
          assert 'const POSITIONS:[&str;8]' in wheel
          assert '.stroke(Stroke::new(1.0,outline))' in wheel
          assert 'if ui.button("Restore Default").clicked()' in wheel
          print('PASS: light/dark 8-slot bordered dialog, proper position labels, fresh/reset defaults 75%/100%')
          assert 'painter.circle_filled(c,HUB*scale,BURGUNDY);' in wheel
          assert 'vec2(40.92,25.48)*scale' in wheel, 'Dk Android.8 +15% scale missing'
          assert 'vec2(35.58,22.16)*scale' not in wheel, 'Old Android.7 Dk glyph scale survived'
          assert 'Color32::from_rgb(105,105,109)' in wheel and 'Color32::from_rgb(181,182,186)' in wheel, 'Grey dialog borders missing'
          assert 'Color32::from_rgb(114,77,87)' not in wheel and 'Color32::from_rgb(224,195,203)' not in wheel, 'Old red/pink borders survived'
          assert 'ctx.request_repaint_after(std::time::Duration::from_millis(80));' in wheel, 'Cold-start pen hover polling missing'
          assert 'dkSetupNativeHover();' in java, 'Native surface hover attach absent'
          assert 'nativeView.setOnHoverListener((view,event)->{' in java, 'Direct native hover listener absent'
          assert 'decor.getViewTreeObserver().addOnGlobalLayoutListener(' in java, 'First-layout native hover install missing'
          assert 'dkCaptureRealStylusHover(event);' in java, 'Stylus hover not forwarded to bridge'
          assert 'dkRealStylusHover.set(-1L);' in java, 'Exit/focus hover clear missing'
          assert 'w.stylus_cursor=Some(pos);' in wheel and 'w.stylus_cursor=None;' in wheel, 'Stylus enter/exit state missing'
          assert 'Order::Tooltip,Id::new("deckcraft-stylus-hover-cursor")' in wheel, 'No independent hover cursor'
          assert 'deckcraft-wheel-bottom-notification' in wheel
          assert 'const DEFAULT: [usize; 8] = [2, 3, 4, 1, 7, 0, 6, 5];' in wheel
          assert 'const SIZE: f32 = 312.0;' in wheel
          assert 'let normal_a=' in wheel and 'let normal_b=' in wheel
          assert 'FEEDBACK_FADE: Duration = Duration::from_millis(500)' in wheel
          assert 'painter.rect_filled(rect,13.0,Color32::from_rgba_unmultiplied(' in wheel
          assert 'vec2(61.0,38.0)*scale' not in wheel, 'Oversized old Dk glyph retained'
          from PIL import Image as WheelImage
          rgba=WheelImage.frombytes('RGBA',(128,80),
              Path('builder/source/deckcraft/crates/ui-egui/src/android_wheel_logo.rgba').read_bytes())
          a=rgba.getchannel('A')
          for xy in ((0,0),(127,0),(0,79),(127,79),(64,0),(0,40),(127,40)):
              assert a.getpixel(xy)<9, ("square launcher tile leaked into wheel centre",xy)
          assert a.getextrema()[1]>220, 'Dk logo letters not legible'
          print('PASS: round launcher-colour hub, glyph-only Dk, coral size/opacity sliders')

          assert Path('builder/source/deckcraft/crates/ui-egui/src/android_wheel_logo.rgba').stat().st_size == 128*80*4
          assert 'self.wheel_input(ctx);' in Path('builder/templates/android/dcs_bridge.rs').read_text()
          assert 'self.wheel_hover(ctx);' in Path('builder/templates/android/dcs_bridge.rs').read_text()
          print('PASS: Android-only stylus hover, exactly branded Dk mark, white-only wheel icons staged')
          assert 'flags.lines().any(|line| line == "startup=1")' in ui
          assert 'flags.lines().any(|line| line == "preview=1")' in ui
          print('PASS: saved startup/preview checkmarks mirrored from Android preferences, including relaunch')
          print('PASS: PhotoCraft-style direct startup/preview toggles with bottom ON/OFF toasts; no modal')
          print('PASS: grouped Dk menu, verified updater, PPTX ACTION_VIEW+EDIT, nonblocking PPTX Save As, IME Ctrl+W')
          # Verify MagicOS experiment is isolated to an additional DeckCraft VIEW-only filter.
          import importlib.util
          import toml
          spec=importlib.util.spec_from_file_location('associations_probe','builder/lib/file_associations.py')
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          legacy='application/vnd.ms-powerpoint'
          def filters_for(app):
              return toml.loads('intent_filter = '+module.intent_filter_toml(app))['intent_filter']
          hits=[flt for flt in filters_for('deckcraft') if legacy in [d.get('mime_type') for d in flt.get('data',[])]]
          assert len(hits)==1, hits
          assert hits[0]['actions']==['android.intent.action.VIEW']
          assert hits[0]['categories']==['android.intent.category.DEFAULT']
          assert hits[0]['data']==[{'mime_type':legacy}]
          assert 'ppt' not in module.ASSOCIATIONS['deckcraft'], 'Never claim unsupported legacy PPT import'
          assert not any(legacy in str(flt) for flt in filters_for('wordcraft')), 'Do not change WordCraft'
          assert any('application/vnd.openxmlformats-officedocument.presentationml.presentation' in str(flt) for flt in filters_for('deckcraft')), 'PPTX association lost'
          print('PASS: DeckCraft-only VIEW+DEFAULT legacy MIME compatibility probe; .ppt not advertised by extension')
          PY
          git -C builder/source/deckcraft diff --check
          python3 deckcraft/android/adaptive_safe.py builder deckcraft
          python3 tools/approved-branding/approved_branding.py check
          python3 tools/approved-branding/approved_branding.py install builder deckcraft
          # Published Android.17 branding metadata stays protected, including
          # the original owner-approved Dk icon and resource SHA256 entries.
          # Override test APK metadata ONLY in this disposable builder checkout.
          python3 - <<'PY'
          from pathlib import Path
          import json
          baseline=Path('tools/approved-branding/assets/manifest.json')
          original=json.loads(baseline.read_text())
          assert original['app']=='deckcraft'
          assert original['version_name']=='0.14.1-android.17'
          assert original['version_code']==100000021
          staged=Path('builder/tools/approved-branding/assets/manifest.json')
          cfg=json.loads(staged.read_text())
          assert cfg==original, 'Branding copied manifest drifted; refuse build'
          cfg['version_name']='0.18.1-android.8'
          cfg['version_code']=100000036
          cfg['package']='com.artcraft.deckcraft'
          staged.write_text(json.dumps(cfg,indent=2)+'\n')
          project=Path('builder/lib/android_project.py')
          src=project.read_text()
          old="    version = '0.14.1-android.17'\n    code = 100000021\n"
          new="    version = '0.18.1-android.8'\n    code = 100000036\n"
          assert src.count(old)==1, 'Approved-branding version override changed; stop'
          project.write_text(src.replace(old,new,1))
          assert json.loads(baseline.read_text())==original, 'Protected branding manifest was modified'
          print('PASS: approved Dk artwork preserved; disposable Gradle and branding metadata use Android.20-test')
          PY
