          name: DeckCraft-v0.18.1-android.8-ORIGINAL-SIGNED-OPTIMIZED
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish new stable tag and verified assets only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'KosmosSG/artcraft-android'
          test "$GITHUB_REF" = 'refs/heads/release/deckcraft-v0181-android8-optimized-20261114'
          tag=deckcraft-v0.18.1-android.8
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release already exists'; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo '::error::Refusing existing tag'; exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test "$(cat dist/signing-certificate-sha256.txt)" = 7911c60bdcae5bea6a252e33164855cad150194b8ca567a4f752acd010c80dc9
          gh release create "$tag" \
            dist/DeckCraft-v0.18.1-android.8-arm64-v8a.apk \
            dist/SHA256SUMS.txt dist/signing-certificate-sha256.txt dist/RELEASE-NOTES.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DeckCraft v0.18.1-android.8 — Stable ARM64" \
            --notes-file dist/RELEASE-NOTES.md --latest=false
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/deckcraft-release.json"
          python3 - "$RUNNER_TEMP/deckcraft-release.json" <<'PY'
          import json,sys
          release=json.load(open(sys.argv[1]))
          assert not release['isDraft'] and not release['isPrerelease']
          assets={a['name'] for a in release['assets']}
          for name in ('DeckCraft-v0.18.1-android.8-arm64-v8a.apk','SHA256SUMS.txt','signing-certificate-sha256.txt','RELEASE-NOTES.md'):
              assert name in assets,name
          print('PASS: stable DeckCraft release published:',release['url'])
          PY
          echo '### DeckCraft v0.18.1-android.8 original-key stable release' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Purge signing material and disposable build outputs
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/deckcraft-prod.p12" "$RUNNER_TEMP/deckcraft-prod.pem"
          rm -rf builder/keys builder/output unsigned
