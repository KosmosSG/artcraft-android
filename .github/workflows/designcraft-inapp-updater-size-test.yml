name: DesignCraft in-app updater + APK size ARM64 TEMP TEST ONLY
on:
  push:
    branches: [feature/designcraft-v019-inapp-downloader-size-policy-20261110]
    paths: [.github/workflows/designcraft-inapp-updater-size-test.yml]
permissions:
  contents: read
concurrency:
  group: designcraft-updater-size-test
  cancel-in-progress: true
jobs:
  android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ARTCRAFT_TARGET_SDK: '35'
      ARTCRAFT_BUILD_TOOLS_VERSION: '35.0.0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: debuginfo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source compatibility and updater contract
        run: |
          set -euo pipefail
          python3 tools/designcraft/test_inapp_updater_contract.py
          python3 -m py_compile tools/designcraft/install_v017_updater.py tools/designcraft/patch_v017_android.py tools/android_apk_size_audit.py
          git clone --quiet --depth 1 --branch v0.19.0 https://github.com/storytold/designcraft.git "$RUNNER_TEMP/designcraft-v019"
          python3 tools/designcraft/dry_run_v019_source_port.py "$RUNNER_TEMP/designcraft-v019"
      - name: Stage isolated Android checkout from protected baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/designcraft-builder"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/designcraft-builder/"
          python3 "$GITHUB_WORKSPACE/tools/designcraft/prepare_v019_test_builder.py" "$RUNNER_TEMP/designcraft-builder"
          bash -n "$RUNNER_TEMP/designcraft-builder/lib/build-common.sh"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - name: Set up pinned NDK and Pillow
        run: |
          set -euo pipefail
          python3 -m pip install --user pillow
          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          test -d "$NDK_PATH" || sdkmanager --install 'ndk;27.2.12479018'
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
      - name: Build disposable-signed .test APK, no production keys
        timeout-minutes: 43
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/designcraft-builder"
          bash build-debug.sh -designcraft -designcraft-v017 -packagename=com.artcraft.designcraft.test -appname='DesignCraft Updater TEST'
      - name: Verify test package, disposable signing, ABI and file size
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/designcraft-builder/output/designcraft-0.19.0-android.1-debug.apk"
          test -s "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK")"
          grep -Fq "name='com.artcraft.designcraft.test'" <<<"$BADGING"
          grep -Fq "versionName='0.19.0-android.1'" <<<"$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/cert-check.txt"
          grep -Fq 'CN=ArtCraft Android Builder' "$RUNNER_TEMP/cert-check.txt"
          python3 tools/android_apk_size_audit.py "$APK" --arm64-only --baseline-bytes 256640934 \
              --max-growth-percent 100 --report "$RUNNER_TEMP/designcraft-builder/output/apk-size-report.json"
          sha256sum "$APK" > "$RUNNER_TEMP/designcraft-builder/output/APK-SHA256.txt"
          echo 'DISPOSABLE TEST: production updates are blocked in the test package.'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: DesignCraft-inapp-updater-size-TEMP-ARM64-UNVERIFIED
          path: |
            ${{ runner.temp }}/designcraft-builder/output/designcraft-0.19.0-android.1-debug.apk
            ${{ runner.temp }}/designcraft-builder/output/apk-size-report.json
            ${{ runner.temp }}/designcraft-builder/output/APK-SHA256.txt
          retention-days: 5
          if-no-files-found: error
