name: One-time cleanup of obsolete DesignCraft Actions artifacts (protect releases)
on:
  push:
    branches: [maintenance/designcraft-old-actions-artifacts-20261109]
    paths: [.github/workflows/designcraft-obsolete-artifacts-cleanup-20261109.yml]
permissions:
  actions: write
  contents: read
concurrency:
  group: designcraft-obsolete-artifact-cleanup-20261109
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'KosmosSG/artcraft-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete ONLY old disposable DesignCraft Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Clean obsolete test/build artifacts, never Release assets or signing material."""
          import json,os,time,urllib.request,urllib.error
          from datetime import datetime,timezone
          repo="KosmosSG/artcraft-android"
          cutoff=datetime.fromisoformat("2026-11-06T00:00:00+00:00")
          gh=os.environ["GH_TOKEN"]
          assert gh and os.environ.get("GITHUB_REPOSITORY")==repo
          headers={
            "Authorization":"Bearer "+gh,
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "User-Agent":"designcraft-obsolete-artifact-cleanup"
          }
          def request(path,method="GET"):
              url="https://api.github.com/repos/"+repo+"/"+path
              with urllib.request.urlopen(
                  urllib.request.Request(url,headers=headers,method=method),timeout=30
              ) as r:
                  return json.load(r) if method=="GET" else r.status
          candidates=[]
          scanned=0
          for page in range(1,101):
              data=request(f"actions/artifacts?per_page=100&page={page}")
              items=data.get("artifacts",[])
              scanned+=len(items)
              for a in items:
                  name=a["name"]
                  lower=name.casefold()
                  age=datetime.fromisoformat(a["created_at"].replace("Z","+00:00"))
                  if "designcraft" not in lower or age>=cutoff:
                      continue
                  # Restrict to temporary CI artifacts, NEVER original-key
                  # signing backups, permanent signed candidates, published releases,
                  # or test reports without clear disposable markers.
                  temporary=("debug","candidate","preview","test","unverified",
                             "diagnostic","font","arm64","payload")
                  protected=("permanent","original","keystore","backup",
                             "recovery","release","signed")
                  if any(x in lower for x in temporary) and not any(x in lower for x in protected):
                      candidates.append(a)
              if len(items)<100:
                  break
          candidates.sort(key=lambda a:a["created_at"])
          if len(candidates)>50:
              raise SystemExit(f"Refusing mass deletion: {len(candidates)} candidates > 50")
          print(f"Scanned {scanned} Actions artifacts, selected {len(candidates)} obsolete DesignCraft-only temporary items before {cutoff.isoformat()}")
          print("Using ONLY DELETE /actions/artifacts/{id}; no releases, tags, code, keys, other app artifacts are touched.")
          saved=0
          for a in candidates:
              size=int(a["size_in_bytes"])
              print(f"DELETE id={a['id']} age={a['created_at']} size={size} name={a['name']}",flush=True)
              code=request(f"actions/artifacts/{a['id']}",method="DELETE")
              if code!=204:
                  raise SystemExit(f"Unexpected deletion result for {a['id']}: {code}")
              saved+=size
          line=f"Deleted {len(candidates)} obsolete DesignCraft-only Actions artifacts, approximately {saved/1048576:.1f} MiB. Published releases, signed APKs, Git tags, signing keys and other applications were not touched."
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Obsolete DesignCraft CI artifact cleanup\n\n"+line+"\n\nGitHub may take 6–12 hours to recalculate the storage quota.\n")
          PY
