name: EffectCraft v0.24.1 Android.5 Refined Wheel + Hover Pointer ARM64 TEST

on:
  push:
    branches:
      - fix/effectcraft-v0241-android5-wheel-icons-hover-pointer-20261114
    paths:
      - .github/workflows/effectcraft-v0241-android5-icons-hover-test.yml
      - tools/effectcraft/patch_stylus_wheel.py
      - tools/effectcraft/patch_stylus_native.py
      - tools/effectcraft/stylus_wheel.rs
      - tools/effectcraft/test_android5_wheel_hover.py
      - tools/effectcraft/patch_wheel_photocraft_parity.py
      - tools/effectcraft/patch_updater_download.py
      - tools/effectcraft/patch_updater_photocraft_dialog.py
      - tools/effectcraft/UpdaterDownload.java.inc
      - tools/effectcraft/UpdaterDownload.java.inc
      - tools/effectcraft/render_wheel_ec_logo.py
      - tools/effectcraft/integrate_updater.py
      - tools/effectcraft/menu_corner.py
      - tools/effectcraft/test_corner_menu.py
      - tools/effectcraft/patch_android_gestures.py
      - tools/effectcraft/test_android_gestures.py
      - tools/effectcraft/patch_android_menu_scroll.py
      - tools/effectcraft/test_android_menu_scroll.py
      - tools/effectcraft/patch_android_local_diag.py
      - tools/effectcraft/test_android_local_diag.py
      - tools/effectcraft/patch_android13_input.py
      - tools/effectcraft/test_android13_input.py
      - tools/effectcraft/patch_android14_glass.py
      - tools/effectcraft/test_android14_glass.py
      - tools/effectcraft/test_keyboard_launcher.py
      - tools/effectcraft/test_dcs_dispatch.py
      - tools/effectcraft/test_android_shortcut_runtime.py
      - tools/effectcraft/v020_compat.py
      - tools/effectcraft/test_v020_compat.py
      - tools/effectcraft/patch_android_lifecycle.py
      - tools/effectcraft/android_event_loop_lifetime.rs
      - tools/effectcraft/test_android_lifecycle.py
      - tools/effectcraft/v021_compat.py
      - tools/effectcraft/test_v021_compat.py
      - tools/effectcraft/v020_winit_compat.py
      - tools/effectcraft/test_v020_winit_compat.py
      - tools/effectcraft/FontsBridge.java.inc
      - tools/effectcraft/android_updater.rs
      - tools/effectcraft/test_font_runtime_wiring.py
      - tools/effectcraft/test_recursive_fonts.py
      - tools/effectcraft/test_recursive_walk.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effectcraft-v0241-android5-icons-hover
  cancel-in-progress: false

jobs:
  check-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_SHA: 582344dd4ef462362c02e56e3094de7af01847ab
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      ARTCRAFT_TARGET_SDK: '35'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate compatibility helper and existing EffectCraft regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/effectcraft -p 'test_*.py' -v
      - name: Fetch immutable official stable EffectCraft v0.24.1 (not upstream main)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          git clone --depth 1 --branch v0.24.1 https://github.com/storytold/effectcraft.git source/effectcraft
          test "$(git -C source/effectcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          grep -Fq 'pub fn session() -> Session' source/effectcraft/crates/host/src/lib.rs
      - name: Prepare isolated Android integration; stop on incompatible upstream hooks
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/effectcraft/prepare_candidate.py .
          PYTHONPATH=tools/effectcraft python3 - <<'PY'
          from pathlib import Path
          from v021_compat import stage_trial_metadata, stage_trial_branding_metadata, menu_path_and_anchor
          stage_trial_metadata(Path('.'))
          stage_trial_branding_metadata(Path('.'))
          path, anchor = menu_path_and_anchor(Path('source/effectcraft'))
          print('Verified EffectCraft v0.20 menu location:', path)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('lib/build-common.sh')
          s=p.read_text()
          old='version_line = f\'version = "{app_version}-android.15"\' if app == "effectcraft" else "version.workspace = true"'
          assert s.count(old)==1, "STOP: Android baseline version staging drift"
          s=s.replace(old, old.replace('android.15','android.5'),1)
          assert s.count('version_code = 16820015')==1, "STOP: baseline versionCode drift"
          s=s.replace('version_code = 16820015','version_code = 16850005',1)
          p.write_text(s)
          p=Path('tools/approved-branding/assets/manifest.json')
          m=json.loads(p.read_text())
          assert m['app']=='effectcraft' and m['version_name']=='0.21.0-android.15' and m['version_code']==16820015
          m['version_name']='0.24.1-android.5'; m['version_code']=16850005
          p.write_text(json.dumps(m, indent=2) + chr(10))
          PY
          python3 tools/effectcraft/integrate_updater.py .
          python3 -m py_compile tools/effectcraft/patch_stylus_wheel.py tools/effectcraft/patch_stylus_native.py tools/effectcraft/render_wheel_ec_logo.py tools/effectcraft/patch_wheel_photocraft_parity.py tools/effectcraft/patch_updater_download.py tools/effectcraft/patch_updater_photocraft_dialog.py
          python3 tools/effectcraft/patch_stylus_wheel.py .
          python3 tools/effectcraft/patch_wheel_photocraft_parity.py .
          python3 tools/effectcraft/patch_updater_download.py .
          python3 tools/effectcraft/patch_updater_photocraft_dialog.py .
          grep -Fq 'setNeutralButton("Skip This Version"' templates/android/SafActivity.java
          grep -Fq 'setPositiveButton("Install"' templates/android/SafActivity.java
          grep -Fq 'ecTrustedReleaseAsset' templates/android/SafActivity.java
          grep -Fq 'size_percent: 75.0, opacity_percent: 85.0' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'self.size_percent = 75.0;' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'Lucide-style Undo2 / Redo2' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'vec2(42.5, 28.05) * scale' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'ec-wheel-bottom-feedback' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'ui.menu_button("Stylus Wheel"' source/effectcraft/crates/ui-egui/src/header.rs
          grep -Fq 'ui.menu_button("App Updates"' source/effectcraft/crates/ui-egui/src/header.rs
          grep -Fq 'ecBeginDownload' templates/android/SafActivity.java
          grep -Fq 'REQUEST_INSTALL_PACKAGES' lib/build-common.sh
          grep -Fq 'pub(crate) struct Wheel' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'ecWheelDeviceIds' templates/android/SafActivity.java
          grep -Fq 'dispatchGenericMotionEvent' templates/android/SafActivity.java
          grep -Fq 'SOURCE_STYLUS' templates/android/SafActivity.java
          echo 'Omit rejected Android diagnostic menu additions'
          echo 'All legacy font/DCS/updater hooks accepted source changes (compile still required).'
      - name: Configure Java 21, Rust 1.95, Android SDK 35 / NDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android
      - name: Install Android compile prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Rebase Android pointer input onto exact upstream winit fork; retain IME reset APIs
        shell: bash
        env:
          WINIT_SHA: a517b3846ee8457d84ee4975110bfda6797c44dc
        run: |
          set -euo pipefail
          # Only the isolated runner's vendor directory is changed: the GitHub branch
          # still retains the original shared Android winit for other app releases.
          mv vendor/winit "$RUNNER_TEMP/effectcraft-original-winit"
          git init -q vendor/winit
          git -C vendor/winit remote add origin https://github.com/storytold/winit.git
          git -C vendor/winit fetch --quiet --depth 1 origin "$WINIT_SHA"
          git -C vendor/winit checkout --quiet --detach FETCH_HEAD
          test "$(git -C vendor/winit rev-parse HEAD)" = "$WINIT_SHA"
          python3 tools/effectcraft/v020_winit_compat.py \
            "$RUNNER_TEMP/effectcraft-original-winit/src/platform_impl/android/mod.rs" \
            "vendor/winit/src/platform_impl/android/mod.rs"
          test "$(git -C vendor/winit diff --name-only)" = 'src/platform_impl/android/mod.rs'
          python3 tools/effectcraft/patch_android_lifecycle.py vendor/winit
          python3 tools/effectcraft/patch_android13_input.py vendor/winit
          echo 'Omit rejected native diagnostics overlay'
          python3 tools/effectcraft/patch_android14_glass.py vendor/winit
          python3 tools/effectcraft/patch_stylus_native.py vendor/android-activity
          grep -Fq 'ec_stylus_native_capture' vendor/android-activity/src/native_activity/mod.rs
          grep -Fq 'source & 0x00004002' vendor/android-activity/src/lib.rs
          rustc --test tools/effectcraft/android_event_loop_lifetime.rs -o "$RUNNER_TEMP/ec-lifetime-tests"
          "$RUNNER_TEMP/ec-lifetime-tests" --nocapture
          echo 'Android.14 adds glass touchscreen two-finger pan with deadzone, touch cancellation to block selection, preserves pinch, and guards canvas selection during trackpad scroll; approved Android.13 menu scroll remains unchanged.' >> "$GITHUB_STEP_SUMMARY"
          grep -Fq 'ImeResetCompleted' vendor/winit/src/event.rs
          grep -Fq 'reset_ime_with_request' vendor/winit/src/window.rs
          grep -Fq 'MouseWheel' vendor/winit/src/platform_impl/android/mod.rs
          grep -Fq 'MouseInput' vendor/winit/src/platform_impl/android/mod.rs
          echo 'Exact official pinned winit + limited Android motion adaptation, no production-signing job' >> "$GITHUB_STEP_SUMMARY"
      - name: Build temporary-key EffectCraft 0.24.1 Android test package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user Pillow==11.3.0
          python3 tools/effectcraft/render_wheel_ec_logo.py .
          test "$(wc -c < source/effectcraft/crates/ui-egui/src/stylus_wheel_ec.rgba)" -eq 96768
          grep -Fq 'include_bytes!("stylus_wheel_ec.rgba")' source/effectcraft/crates/ui-egui/src/stylus_wheel.rs
          grep -Fq 'ec_stylus_native_hover_point' vendor/android-activity/src/lib.rs
          python3 tools/effectcraft/install_packager.py
          test -s tools/effectcraft/icon/ec-approved-512.png
          test ! -e keys/artcraft-builder.jks
          test ! -e keys/.keystore-password
          cp tools/effectcraft/icon/ec-approved-512.png source/effectcraft/ec-approved-512.png
          python3 tools/approved-branding/approved_branding.py install . effectcraft
          bash build.sh -effectcraft -packagename=com.artcraft.effectcraft.v024wheeltest5 -appname=EffectCraft-v024-Wheel5-TEST -appicon=source/effectcraft/ec-approved-512.png
          test -s output/effectcraft-0.24.1.apk
          mkdir -p candidate
          cp output/effectcraft-0.24.1.apk candidate/EffectCraft-v0.24.1-android.5-TEST-arm64-v8a.apk
      - name: Verify test-only package, version, ABI, and disposable signing
        shell: bash
        run: |
          set -euo pipefail
          APK=candidate/EffectCraft-v0.24.1-android.5-TEST-arm64-v8a.apk
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > candidate/certificate.txt
          if grep -iq '10c93a0a55b9d66b6c64ac87372d5f3118c74a11c99fecb6e9f3951d2cbe8577' candidate/certificate.txt; then
            echo 'STOP: test APK must NOT use the original EffectCraft production certificate' >&2
            exit 1
          fi
          "$SDK/aapt" dump badging "$APK" > candidate/badging.txt
          grep -F "name='com.artcraft.effectcraft.v024wheeltest5'" candidate/badging.txt
          grep -F "versionName='0.24.1-android.5'" candidate/badging.txt
          grep -F "versionCode='16850005'" candidate/badging.txt
          "$SDK/zipalign" -c -P 16 -v 4 "$APK"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = Path('candidate/EffectCraft-v0.24.1-android.5-TEST-arm64-v8a.apk')
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              libs=[x for x in names if x.startswith('lib/') and x.endswith('.so')]
              assert libs and all(x.startswith('lib/arm64-v8a/') for x in libs)
              assert any(x.endswith('.dex') for x in names)
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent/'SHA256SUMS.txt').write_text(digest+'  '+apk.name+'\n')
          (apk.parent/'verification.json').write_text(json.dumps({
              'upstream_tag':'v0.24.1','upstream_sha':'582344dd4ef462362c02e56e3094de7af01847ab',
              'package':'com.artcraft.effectcraft.v024wheeltest5',
              'versionName':'0.24.1-android.5','versionCode':16850005,
              'apk_size_bytes':apk.stat().st_size,'builder_commit':__import__('os').environ['GITHUB_SHA'],
              'apk_sha256':digest,'production_signing_verified':False,
              'device_tested':False,'eligible_for_release':False
          },indent=2))
          PY
          cat candidate/verification.json
          cat candidate/certificate.txt
          echo 'This APK uses a temporary key and separate package; it is NOT a production upgrade or an approved release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload private Actions test artifact (never a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-v0.24.1-android5-TEMPORARY-ARM64-TEST-ONLY
          path: candidate/
          retention-days: 3
          if-no-files-found: error
      - name: Delete disposable build keystore
        if: always()
        run: rm -rf keys
