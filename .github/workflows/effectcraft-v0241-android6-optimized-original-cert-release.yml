name: EffectCraft v0.24.1-android.6 VERIFIED optimized original-key signing & publication

on:
  push:
    branches:
      - release/effectcraft-v0241-android6-optimized-original-cert-20261114
    paths:
      - .github/workflows/effectcraft-v0241-android6-optimized-original-cert-release.yml
      - tools/effectcraft/patch_stylus_wheel.py
      - tools/effectcraft/patch_stylus_native.py
      - tools/effectcraft/stylus_wheel.rs
      - tools/effectcraft/test_android5_wheel_hover.py
      - tools/effectcraft/test_android6_menu_icons.py
      - tools/effectcraft/patch_wheel_photocraft_parity.py
      - tools/effectcraft/patch_updater_download.py
      - tools/effectcraft/patch_updater_photocraft_dialog.py
      - tools/effectcraft/UpdaterDownload.java.inc
      - tools/effectcraft/UpdaterDownload.java.inc
      - tools/effectcraft/render_wheel_ec_logo.py
      - tools/effectcraft/integrate_updater.py
      - tools/effectcraft/menu_corner.py
      - tools/effectcraft/test_corner_menu.py
      - tools/effectcraft/patch_android_gestures.py
      - tools/effectcraft/test_android_gestures.py
      - tools/effectcraft/patch_android_menu_scroll.py
      - tools/effectcraft/test_android_menu_scroll.py
      - tools/effectcraft/patch_android_local_diag.py
      - tools/effectcraft/test_android_local_diag.py
      - tools/effectcraft/patch_android13_input.py
      - tools/effectcraft/test_android13_input.py
      - tools/effectcraft/patch_android14_glass.py
      - tools/effectcraft/test_android14_glass.py
      - tools/effectcraft/test_keyboard_launcher.py
      - tools/effectcraft/test_dcs_dispatch.py
      - tools/effectcraft/test_android_shortcut_runtime.py
      - tools/effectcraft/v020_compat.py
      - tools/effectcraft/test_v020_compat.py
      - tools/effectcraft/patch_android_lifecycle.py
      - tools/effectcraft/android_event_loop_lifetime.rs
      - tools/effectcraft/test_android_lifecycle.py
      - tools/effectcraft/v021_compat.py
      - tools/effectcraft/test_v021_compat.py
      - tools/effectcraft/v020_winit_compat.py
      - tools/effectcraft/test_v020_winit_compat.py
      - tools/effectcraft/FontsBridge.java.inc
      - tools/effectcraft/android_updater.rs
      - tools/effectcraft/test_font_runtime_wiring.py
      - tools/effectcraft/test_recursive_fonts.py
      - tools/effectcraft/test_recursive_walk.py
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: effectcraft-v0241-android6-original-cert-optimized-release
  cancel-in-progress: false

jobs:
  check-and-compile:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/effectcraft-v0241-android6-optimized-original-cert-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_SHA: 582344dd4ef462362c02e56e3094de7af01847ab
      ARTCRAFT_TARGET_SDK: '35'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight original EffectCraft certificate and release eligibility (before build)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EFFECTCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.EFFECTCRAFT_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.EFFECTCRAFT_KEY_PASSWORD }}
          KEYALIAS: 'effectcraft'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STOREPASS KEYPASS KEYALIAS; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Original EffectCraft signing prerequisite $name missing; no build or release attempted."
              exit 1
            fi
          done
          if gh release view effectcraft-v0.24.1-android.6 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite existing EffectCraft release"
            exit 1
          fi
          KEY="$RUNNER_TEMP/effectcraft-original.p12"
          CERT="$RUNNER_TEMP/effectcraft-original.pem"
          trap 'rm -f "$KEY" "$CERT"' EXIT
          # Never echo secrets. Report which type of prerequisite failed.
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEY"; then
            echo '::error::Keystore Base64 is invalid; re-upload EFFECTCRAFT_KEYSTORE_BASE64 from your local .p12 file.'
            exit 1
          fi
          chmod 600 "$KEY"
          if [[ ! -s "$KEY" ]]; then
            echo '::error::Decoded EffectCraft keystore is empty'
            exit 1
          fi
          if ! keytool -list -storetype PKCS12 -keystore "$KEY" \
              -storepass:env STOREPASS >/dev/null 2>&1; then
            echo '::error::PKCS12 keystore could not be opened. Check EFFECTCRAFT_KEYSTORE_PASSWORD and the uploaded original .p12 file; avoid trailing spaces.'
            exit 1
          fi
          if ! keytool -exportcert -rfc -storetype PKCS12 \
              -keystore "$KEY" -alias "$KEYALIAS" -storepass:env STOREPASS \
              > "$CERT" 2>/dev/null; then
            echo '::error::Keystore opened, but the signing alias could not be exported. Confirm EFFECTCRAFT_KEY_ALIAS is effectcraft.'
            exit 1
          fi
          ACTUAL="$(openssl x509 -in "$CERT" -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$ACTUAL" != "10c93a0a55b9d66b6c64ac87372d5f3118c74a11c99fecb6e9f3951d2cbe8577" ]]; then
            echo "::error::Production keystore does not match original EffectCraft certificate."
            exit 1
          fi
          echo "PASS: Original EffectCraft certificate matches published original, signing can proceed."
      - name: Retrieve immutable size-optimized original-package ARM64 pre-sign artifact
        uses: actions/download-artifact@v4
        with:
          name: EffectCraft-v0.24.1-android6-OPTIMIZED-ORIGINAL-PACKAGE-PRE-SIGN
          repository: KosmosSG/artcraft-android
          run-id: 43560490041
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact approved candidate, producer commit, ABI and temporary certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="candidate/EffectCraft-v0.24.1-android.6-PRE-SIGN-arm64-v8a.apk"
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          if [[ ! -x "$SDK/apksigner" || ! -x "$SDK/aapt" || ! -x "$SDK/zipalign" ]]; then
            echo '::error::Android build tools 35.0.0 not found on runner'; exit 1
          fi
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          apk=Path("candidate/EffectCraft-v0.24.1-android.6-PRE-SIGN-arm64-v8a.apk")
          checks=Path("candidate/verification.json")
          assert apk.is_file() and checks.is_file(), "Missing verified candidate"
          j=json.loads(checks.read_text())
          expected = {
            "package":"com.artcraft.effectcraft",
            "versionName":"0.24.1-android.6",
            "versionCode":16850006,
            "upstream_tag":"v0.24.1",
            "upstream_sha":"582344dd4ef462362c02e56e3094de7af01847ab",
            "builder_commit":"8d6abe637ac4882f058a80fdd834c043190cf77c",
            "apk_size_bytes":36087718,
            "production_signing_verified":False,
          }
          for k,v in expected.items():
              assert j.get(k)==v, f"Artifact metadata mismatch: {k}"
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest=="d8caf90a6e2a7b2d45767ddb3e51e33d1db3f028647a75076b933ce4a7b23c12", "APK payload SHA256 mismatch"
          assert j["apk_sha256"]==digest
          assert apk.stat().st_size < 39040934, "Original release APK size gate failed"
          with zipfile.ZipFile(apk) as z:
              libs=[n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs and all(n.startswith("lib/arm64-v8a/") for n in libs)
              assert any(n.endswith(".dex") for n in z.namelist())
          print("PASS: immutable owner-approved, optimized original-package candidate verified")
          PY
          "$SDK/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/pre-sign-cert.txt"
          if grep -Fiq '10c93a0a55b9d66b6c64ac87372d5f3118c74a11c99fecb6e9f3951d2cbe8577' "$RUNNER_TEMP/pre-sign-cert.txt"; then
            echo '::error::Pre-sign APK unexpectedly uses the production signing key'; exit 1
          fi
          "$SDK/aapt" dump badging "$APK" > "$RUNNER_TEMP/pre-sign-badging.txt"
          grep -F "name='com.artcraft.effectcraft'" "$RUNNER_TEMP/pre-sign-badging.txt"
          grep -F "versionName='0.24.1-android.6'" "$RUNNER_TEMP/pre-sign-badging.txt"
          grep -F "versionCode='16850006'" "$RUNNER_TEMP/pre-sign-badging.txt"
          "$SDK/zipalign" -c -P 16 -v 4 "$APK"
      - name: Sign with original EffectCraft certificate verified against published Android.1
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.EFFECTCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.EFFECTCRAFT_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.EFFECTCRAFT_KEY_PASSWORD }}
          KEYALIAS: 'effectcraft'
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          KEY="$RUNNER_TEMP/effectcraft-original.p12"
          REF="$RUNNER_TEMP/effectcraft-android1.apk"
          trap 'rm -f "$KEY" "$REF" "$RUNNER_TEMP/aligned.apk" "$RUNNER_TEMP/certificate.pem"' EXIT
          mkdir -p verified-release
          SRC=candidate/EffectCraft-v0.24.1-android.6-PRE-SIGN-arm64-v8a.apk
          OUT=verified-release/EffectCraft-v0.24.1-android.6-arm64-v8a.apk
          curl -fsSL --retry 3 -o "$REF" 'https://github.com/KosmosSG/artcraft-android/releases/download/effectcraft-v0.23.1-android.1/EffectCraft-v0.23.1-android.1-arm64-v8a.apk'
          echo '7ea5fcdf1dcb37269e3d98f26a04453f18d79102759194429b590fd950bda10a  '"$REF" | sha256sum --check
          "$SDK/apksigner" verify --verbose --print-certs "$REF" > "$RUNNER_TEMP/reference.txt"
          REF_CERT="$(python3 - "$RUNNER_TEMP/reference.txt" <<'PY'
          import re,sys
          text=open(sys.argv[1]).read()
          hits=re.findall(r'certificate SHA-256 digest:\s*([a-fA-F0-9:]{64,95})',text,re.I)
          if len(hits)!=1: raise SystemExit("STOP: published cert could not be uniquely verified")
          print(hits[0].replace(':','').lower())
          PY
          )"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          keytool -exportcert -rfc -keystore "$KEY" -alias "$KEYALIAS" -storepass:env STOREPASS > "$RUNNER_TEMP/certificate.pem"
          ACTUAL_CERT="$(openssl x509 -in "$RUNNER_TEMP/certificate.pem" -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$REF_CERT" != "10c93a0a55b9d66b6c64ac87372d5f3118c74a11c99fecb6e9f3951d2cbe8577" ]]; then
            echo '::error::Published Android.1 reference signer differs from pinned original EffectCraft fingerprint'; exit 1
          fi
          if [[ "$ACTUAL_CERT" != "$REF_CERT" ]]; then
            echo '::error::Original EffectCraft release signer mismatch; refusing publication'
            exit 1
          fi
          "$SDK/zipalign" -P 16 -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$SDK/apksigner" sign --ks "$KEY" --ks-key-alias "$KEYALIAS" \
            --ks-pass env:STOREPASS --key-pass env:KEYPASS \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$SDK/apksigner" verify --verbose --print-certs "$OUT" > "$RUNNER_TEMP/signed-report.txt"
          python3 - "$RUNNER_TEMP/signed-report.txt" "$REF_CERT" <<'PY'
          import re,sys
          txt=open(sys.argv[1]).read()
          vals=[x.replace(':','').lower() for x in re.findall(
              r'certificate SHA-256 digest:\s*([a-fA-F0-9:]{64,95})',txt,re.I)]
          assert vals==[sys.argv[2]], 'Signed release certificate DOES NOT match published EffectCraft'
          print('PASS: original EffectCraft signing certificate and signature')
          PY
          "$SDK/aapt" dump badging "$OUT" | tee "$RUNNER_TEMP/signed-badging.txt"
          grep -F "name='com.artcraft.effectcraft'" "$RUNNER_TEMP/signed-badging.txt"
          grep -F "versionName='0.24.1-android.6'" "$RUNNER_TEMP/signed-badging.txt"
          grep -F "versionCode='16850006'" "$RUNNER_TEMP/signed-badging.txt"
          "$SDK/zipalign" -c -P 16 -v 4 "$OUT"
          python3 - "$SRC" "$OUT" <<'PY'
          import zipfile,sys,hashlib
          def content(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).digest() for n in z.namelist()
                          if not n.startswith('META-INF/') and not n.endswith('.idsig')}
          assert content(sys.argv[1])==content(sys.argv[2]),'Production signing altered the app payload!'
          print('PASS: exact approved binary payload preserved after permanent signing')
          PY
          # Publication is forbidden unless the signed APK is strictly smaller
          # than the published previous production APK (39,040,934 bytes).
          if [[ "$(stat -c%s "$OUT")" -ge 39040934 ]]; then
            echo '::error::Optimized production APK is not smaller than the prior release'; exit 1
          fi
          (cd verified-release && sha256sum EffectCraft-v0.24.1-android.6-arm64-v8a.apk > SHA256SUMS.txt)
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
      - name: Upload original-key permanently signed APK (recovery copy)
        uses: actions/upload-artifact@v4
        with:
          name: EffectCraft-v0.24.1-android6-OPTIMIZED-ORIGINAL-SIGNED
          path: verified-release/
          retention-days: 14
          if-no-files-found: error
      - name: Publish original-key signed GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='effectcraft-v0.24.1-android.6'
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Refusing to overwrite an existing release tag'; exit 1
          fi
          (cd verified-release && sha256sum --check SHA256SUMS.txt)
          cat > verified-release/RELEASE_NOTES.md <<'EOF'
          EffectCraft v0.24.1-android.6 — Optimized ARM64 production release.

          Official Storytold EffectCraft v0.24.1 with the protected ArtCraft
          Android integrations preserved. Original application package:
          com.artcraft.effectcraft. Original release signing certificate is
          checked against the published v0.23.1-android.1 APK before signing.

          New PhotoCraft-style 8-slot Stylus Wheel with EffectCraft's exact
          launcher-logo Ec mark and navy/lavender palette; high-quality native
          Effect fx and refined Hand, Undo/Redo, Crop, Layers and Filter icons.
          Wheel defaults: size 75%, opacity 85%; persistent customization,
          actual-size preview, stylus-button invocation, hover-pointer
          support, canvas-hover isolation and bottom-center notifications.
          Streamlined Ec Android menu with duplicate separator removed.
          PhotoCraft-style App Updates: in-app HTTPS APK download, progress,
          release notes, Install/Later/Skip, automatic checks and Android
          installer approval.

          Preserved: ESC and keyboard shortcuts, Ctrl+W D/C/S, Ctrl+Q,
          shared SAF font import/refresh, appearance menu, touch/trackpad
          pan/pinch and selection suppression during navigation.

          APK-size optimizations: stripped Rust symbols, thin link-time
          optimization and one codegen unit with release opt-level 3. Build
          pipeline refuses publication unless the signed APK is smaller
          than the prior 39,040,934-byte EffectCraft production release.

          Built for ARM64 / HONOR MagicPad 4. Automated checks verify the
          binary, identity, original signing certificate and checksum.
          User authorizes this release; Android.6 device-specific pen hover
          behavior remains subject to on-device validation.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'EffectCraft v0.24.1-android.6 — ARM64' \
            --notes-file verified-release/RELEASE_NOTES.md \
            verified-release/EffectCraft-v0.24.1-android.6-arm64-v8a.apk \
            verified-release/SHA256SUMS.txt
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets
          echo "Published verified release $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Purge temporary signing material
        if: always()
        run: rm -rf keys
