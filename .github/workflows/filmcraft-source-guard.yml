name: FilmCraft source guard (no build, no signing, no publishing)
on:
  push:
    branches:
      - filmcraft-android-candidate
    paths:
      - .github/workflows/filmcraft-source-guard.yml
      - tools/filmcraft/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filmcraft-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-pin-audit:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/filmcraft-android-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate local pin and safety gates
        run: |
          python3 tools/filmcraft/upstream_guard.py
      - name: Validate FilmCraft feature overlay without an APK build
        run: |
          python3 -m py_compile tools/filmcraft/runtime_patch.py tools/filmcraft/upstream_guard.py
          python3 tools/filmcraft/runtime_patch.py --self-test
          rustfmt --edition 2024 --emit stdout tools/filmcraft/filmcraft_features.rs > /dev/null
      - name: Verify official stable release and immutable tag
        run: |
          set -euo pipefail
          python3 tools/filmcraft/upstream_guard.py --online | tee filmcraft-source-audit.json
          {
            echo '### Read-only FilmCraft official source audit'
            echo '```json'
            cat filmcraft-source-audit.json
            echo '```'
            echo 'No APK built; no key accessed; no source branch modified; no release published.'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Save non-sensitive source audit
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-source-audit
          path: filmcraft-source-audit.json
          if-no-files-found: error
          retention-days: 14
