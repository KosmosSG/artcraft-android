name: GridCraft production signing secrets preflight (no build or publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-signing-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate GridCraft-only production secrets without exposing private material
        shell: bash
        env:
          GRIDCRAFT_KEYSTORE_BASE64: ${{ secrets.GRIDCRAFT_KEYSTORE_BASE64 }}
          GRIDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.GRIDCRAFT_KEYSTORE_PASSWORD }}
          GRIDCRAFT_KEY_ALIAS: ${{ secrets.GRIDCRAFT_KEY_ALIAS }}
          GRIDCRAFT_KEY_PASSWORD: ${{ secrets.GRIDCRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in GRIDCRAFT_KEYSTORE_BASE64 GRIDCRAFT_KEYSTORE_PASSWORD GRIDCRAFT_KEY_ALIAS GRIDCRAFT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GridCraft secret: $name"
              exit 1
            fi
          done
          [ "$GRIDCRAFT_KEY_ALIAS" = gridcraft ] || { echo "::error::Unexpected GridCraft alias"; exit 1; }
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          printf '%s' "$GRIDCRAFT_KEYSTORE_BASE64" | base64 --decode > "$workdir/key.jks"
          test -s "$workdir/key.jks"
          export GRIDCRAFT_KEYSTORE_PASSWORD
          keytool -list -keystore "$workdir/key.jks" -storetype PKCS12 \
            -storepass:env GRIDCRAFT_KEYSTORE_PASSWORD -alias gridcraft >/dev/null
          # A PKCS12 key created with Java keytool uses the store password as its key password.
          [ "$GRIDCRAFT_KEYSTORE_PASSWORD" = "$GRIDCRAFT_KEY_PASSWORD" ] || {
            echo "::error::GridCraft key password differs from the PKCS12 store password"
            exit 1
          }
          fingerprint="$(
            keytool -exportcert -rfc -keystore "$workdir/key.jks" \
              -storetype PKCS12 -storepass:env GRIDCRAFT_KEYSTORE_PASSWORD -alias gridcraft \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed 's/^.*=//'
          )"
          expected="09:D2:92:70:9D:4D:CC:E8:4A:65:E8:28:BD:D8:A2:CE:93:DE:62:FA:4D:C6:C5:84:BD:62:69:83:9D:A8:09:0D"
          [ "$fingerprint" = "$expected" ] || {
            echo "::error::Signer mismatch — do NOT sign or publish APK"
            exit 1
          }
          echo "PASS: GridCraft PKCS12 signing identity matches owner-established fingerprint."
          echo "No APK built, keystore artifact uploaded, or release published."
