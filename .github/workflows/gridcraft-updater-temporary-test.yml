name: GridCraft v0.16.1 Android.4 ARM64 UPDATER TEST ONLY

on:
  push:
    branches:
      - feature/gridcraft-inapp-updater-test-20261107
    paths:
      - '.github/workflows/gridcraft-updater-temporary-test.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gridcraft-inapp-updater-temporary-test
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/feature/gridcraft-inapp-updater-test-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      ARTCRAFT_UPDATER_TEST_ONLY: 'true'
      TAG: gridcraft-v0.16.1-android.4
      APK: GridCraft-v0.16.1-android.4-arm64-v8a.apk
      APP: gridcraft
      PACKAGE: com.artcraft.gridcraft.candidate
      VERSION: 0.16.1-android.4
      VERSION_CODE: '16781314'
    steps:
      - name: Checkout protected published baseline and isolated integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact known reference Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false
      - name: Checkout exact official GridCraft v0.16.1
        uses: actions/checkout@v4
        with:
          repository: storytold/gridcraft
          ref: e581bc95b2a17d2a744a115478a20a1c2ad1ef72
          path: builder/source/gridcraft
          persist-credentials: false
      - name: Strict pinned-source, isolated overlay and compatibility preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          test "$(git -C builder/source/gridcraft rev-parse HEAD)" = e581bc95b2a17d2a744a115478a20a1c2ad1ef72
          python3 - <<'PY'
          from pathlib import Path
          import tomllib, hashlib
          src = Path("builder/source/gridcraft/Cargo.toml")
          assert tomllib.loads(src.read_text())["workspace"]["package"]["version"] == "0.16.1"
          icon=Path("assets/gridcraft/launcher-user-20261103.png")
          assert hashlib.sha256(icon.read_bytes()).hexdigest()=="e35af23c45ee75e1e026374c7b2458ac9f616cc82ffe39465f9c0ad3f3aeb7b2"
          print("PASS: reviewed official v0.16.1 source, original Gc icon intact")
          PY
          python3 -m py_compile tools/gridcraft/install_overlay.py tools/gridcraft/port_v0150_ui.py tools/gridcraft/port_v0150_save_dcs.py tools/gridcraft/port_v0150_touch_selection.py tools/gridcraft/android_addons/overlay.py
          python3 tools/gridcraft/install_overlay.py builder
          bash -n builder/lib/build-common.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path("builder/source/gridcraft/crates/ui-egui/src")
          assert "GRIDCRAFT_ANDROID_USER_ICON_V2" in (p/"ribbon/title_bar.rs").read_text()
          assert "gridcraft_android_take_dcs" in (p/"dialogs/show.rs").read_text()
          assert "GRIDCRAFT_ANDROID_TOUCH_SELECT_V1" in (p/"grid/show.rs").read_text()
          show=(p/"grid/show.rs").read_text()
          assert "GC_TWO_FINGER_ONLY_PAN_V1" in show
          assert "app.grid.touch_pan = multi_touch;" in show
          assert "multi_touch().is_some()" in show
          native=Path("builder/tools/gridcraft_android/gridcraft_tools.rs").read_text()
          java=Path("builder/tools/gridcraft_android/GridCraftJavaMethods.java.inc").read_text()
          overlay=Path("builder/tools/gridcraft_android/overlay.py").read_text()
          assert "GC_ANDROID_CTRL_Q_V1" in native and "GC_ANDROID_CTRL_Q_V1" in java
          assert "inner.request_quit(ctx)" in native and "gcTakeQuitShortcut" in java
          assert "gcHandleQuitShortcut(event)" in overlay
          # Android Ctrl+Shift+S uses the already-integrated async SAF
          # file.saveBytes -> Services.download picker; Ctrl+Q and D/C/S stay.
          assert "GC_ANDROID_SAVE_AS_SHORTCUT_V1" in java
          assert "GC_ANDROID_SAVE_AS_SHORTCUT_V1" in native
          assert "gcTakeSaveAsShortcut" in java and "gcTakeSaveAsShortcut" in native
          assert "inner.open_dialog(\"saveAs\"" in native
          assert "inner.commit_edit(0, 0, false, false)" in native
          assert "gcHandleSaveAsShortcut(event)" in overlay
          assert "gcHandleSaveAsShortcut(event)" in java
          upstream_commands=(p/"app/commands.rs").read_text()
          assert '"saveAs" =>' in upstream_commands
          assert 'self.services.download.is_some()' in upstream_commands
          assert '"file.saveBytes"' in upstream_commands
          s=Path("builder/lib/build-common.sh").read_text()
          assert "GRIDCRAFT_V0150_KEEP_EGUI037_FORK" in s
          assert "GRIDCRAFT_V0150_ACK_SAF_V1" in s
          a=Path("builder/lib/android_project.py").read_text()
          # The pinned production overlay sets android.3; the updater stage below bumps it to android.4.
          assert "0.16.1-android.3" in a
          assert "com.artcraft.gridcraft" in a
          print("PASS: Android menu, modal, save acknowledgements, font loading, selection, candidate version")
          PY
      - name: Set up Java 21, Rust ARM64 and Android NDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK and icon dependency if needed
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -d "$NDK" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
            "$SDKMANAGER" --install 'ndk;27.2.12479018'
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Stage updater over approved GridCraft Android overlay without changing upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lib/inapp_updater.py
          cp templates/android/ArtCraftUpdater.java builder/templates/android/ArtCraftUpdater.java
          cp templates/android/updater.rs builder/templates/android/updater.rs
          cp lib/inapp_updater.py builder/lib/inapp_updater.py
          python3 - <<'PY'
          from pathlib import Path
          shell=Path("builder/lib/build-common.sh")
          s=shell.read_text()
          anchor='[[ -f "$ANDROID_DIR/Cargo.toml" && -f "$ANDROID_DIR/src/lib.rs" ]] || fail '
          assert s.count(anchor)==1, "Pinned launcher changed: manual review required"
          patch="""if [[ "$APP" == "gridcraft" ]]; then
              python3 "$ROOT/lib/inapp_updater.py" "$APP" "$ANDROID_DIR" "$ROOT" || fail "Updater integration failed"
          fi
          """
          shell.write_text(s.replace(anchor,patch+anchor,1))
          project=Path("builder/lib/android_project.py")
          p=project.read_text()
          assert p.count('"0.16.1-android.3"') >= 1
          p=p.replace('"0.16.1-android.3"', '"0.16.1-android.4"')
          anchor='code = version_code(version)'
          assert p.count(anchor)==1
          p=p.replace(anchor, 'code = 16781314 if app == "gridcraft" else version_code(version)',1)
          project.write_text(p)
          java=Path("builder/templates/android/ArtCraftUpdater.java").read_text()
          floating=Path("builder/templates/android/updater.rs").read_text()
          icon_menu=Path("tools/gridcraft/android_addons/GridCraftNativeMenu.rs.inc").read_text()
          assert "egui::Area::new" not in floating, "Floating update button must not ship"
          assert "egui::Window::new" not in floating, "Old update popup must not ship"
          assert "artcraft.updater.action" in floating, "Menu bridge absent"
          assert icon_menu.count('ui.menu_button("App Updates"') == 1, "App Updates must be unified"
          assert icon_menu.count('ui.button("Check for Updates")') == 1, "Duplicate Check for Updates"
          assert 'ui.menu_button("Verified APK updater"' not in icon_menu, "Legacy updater submenu remains"
          assert 'ui.button("Download & Install Update…")' in icon_menu
          assert 'ui.checkbox(&mut startup, "Check at Startup")' in icon_menu
          assert 'ui.button("View Release Notes…")' in icon_menu
          assert '"artcraft.updater.available"' in icon_menu
          assert '"artcraft.updater.diagnostics"' in icon_menu
          assert '"Check for GridCraft Updates"' not in icon_menu
          overlay = Path("tools/gridcraft/android_addons/overlay.py").read_text()
          assert 'gcStartIfEnabled();' not in overlay, "Legacy GridCraft startup check must not run"

          assert 'invoke(android, "download")' in floating
          assert 'invoke(android, "view")' in floating
          assert 'poll_menu_state(ctx, android)' in floating
          assert "downloadAvailable" in java and "menuState" in java and "viewAvailable" in java
          assert "egui::Window::new" not in floating

          for action in ('"check"', '"test"', '"toggle"'):
              assert action in icon_menu, f"Missing menu action {action}"
          assert icon_menu.count('ui.menu_button("GridCraft Tools"') == 1
          for submenu in ("Font Catalog & Diagnostics", "Appearance",
                          "Spreadsheet Shortcuts", "About GridCraft"):
              assert icon_menu.count('ui.menu_button("' + submenu + '"') == 1
          assert '("Import Fonts (TTF / OTF)…", "import")' in icon_menu
          assert '("Choose Shared Font Folder…", "folder")' in icon_menu
          assert '"diagnose_fonts"' in icon_menu and 'ScrollArea::vertical()' in icon_menu
          assert 'view.darkMode' in icon_menu and 'gridcraft.android.touch_select' in icon_menu
          assert 'edit.undo' in icon_menu and 'view.zoom' in icon_menu
          assert 'gridcraft.android.menu.action' in icon_menu
          assert "PackageInstaller" in java and "verifyPackageAndSigner" in java
          PY
          bash -n builder/lib/build-common.sh

      - name: Compile separately installable GridCraft updater candidate with disposable key
        shell: bash
        timeout-minutes: 75
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          ICON="$GITHUB_WORKSPACE/assets/gridcraft/launcher-user-20261103.png"
          bash builder/build-debug.sh -gridcraft -packagename=com.artcraft.gridcraft.candidate -appicon="$ICON"
      - name: Verify candidate package, temporary signature, ARM64 and artifact integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find builder/output -maxdepth 1 -type f -iname '*gridcraft*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-signing.txt
          "$TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "name='com.artcraft.gridcraft.candidate'" apk-badging.txt
          grep -F "versionName='0.16.1-android.4'" apk-badging.txt
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert 'classes.dex' in names
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('.so') for n in names)
              assert not any(n.startswith('lib/') and not n.startswith('lib/arm64-v8a/') for n in names)
              assert not any(n.endswith(('.jks','.keystore','.p12')) for n in names)
          print("PASS: separate package, native ARM64, disposable-signature APK")
          PY
          test -s builder/source/gridcraft/apps/gridcraft-android/java/com/artcraft/gridcraft/candidate/ArtCraftUpdater.java
          grep -F 'mod updater;' builder/source/gridcraft/apps/gridcraft-android/src/lib.rs
          mkdir -p candidate
          cp "$APK" candidate/GridCraft-v0.16.1-android.4-ARM64-COMPACT-MENU-TEMP-TEST.apk
          (cd candidate && sha256sum *.apk > SHA256SUMS.txt)
          cp apk-signing.txt apk-badging.txt candidate/



      - name: Upload GridCraft ARM64 disposable-signed updater test APK
        uses: actions/upload-artifact@v4
        with:
          name: GridCraft-CompactMenu-ARM64-TEMP-TEST
          path: |
            candidate/GridCraft-v0.16.1-android.4-ARM64-COMPACT-MENU-TEMP-TEST.apk
            candidate/SHA256SUMS.txt
            candidate/apk-signing.txt
            candidate/apk-badging.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable signing material
        if: always()
        run: rm -rf builder/keys
