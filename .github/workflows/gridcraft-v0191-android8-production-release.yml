name: GridCraft v0.19.1-android.8 OWNER APPROVED Original Key Stable Release

on:
  push:
    branches:
      - release/gridcraft-v0191-android8-size75-20261114
    paths:
      - '.github/workflows/gridcraft-v0191-android8-production-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gridcraft-v0191-android8-prod
  cancel-in-progress: false

jobs:
  preflight-and-build:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/gridcraft-v0191-android8-size75-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      GH_TOKEN: ${{ github.token }}
      TAG: gridcraft-v0.19.1-android.8
      APK: GridCraft-v0.19.1-android.8-arm64-v8a.apk
      PACKAGE: com.artcraft.gridcraft
      VERSION: 0.19.1-android.8
      VERSION_CODE: '16782081'
      EXPECTED_CERT: 09D292709D4DCCE84A65E828BDD8A2CE93DE62FA4DC6C584BD6269839DA8090D
    steps:
      - name: Checkout current protected-baseline-derived integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Android reference builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false
      - name: Checkout exact official Storytold GridCraft v0.19.1
        uses: actions/checkout@v4
        with:
          repository: storytold/gridcraft
          ref: 476448d7d9f3a5f8e93fcf7d98b47fd52293fe7f
          path: builder/source/gridcraft
          persist-credentials: false
      - name: Verify upstream source, Python syntax, and Android port contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          test "$(git -C builder/source/gridcraft rev-parse HEAD)" = 476448d7d9f3a5f8e93fcf7d98b47fd52293fe7f
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python3 tools/gridcraft/v0180_source_preflight.py builder/source/gridcraft
          python3 -m py_compile tools/gridcraft/install_overlay.py tools/gridcraft/port_v0150_ui.py tools/gridcraft/port_v0150_save_dcs.py tools/gridcraft/port_v0150_touch_selection.py tools/gridcraft/port_v0150_builder_saf.py tools/gridcraft/android_addons/overlay.py tools/gridcraft/android_addons/font_catalog_patch.py
          python3 tools/gridcraft/install_overlay.py builder
          bash -n builder/lib/build-common.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path("builder/source/gridcraft/crates/ui-egui/src")
          title=(source/"ribbon/title_bar.rs").read_text()
          show=(source/"grid/show.rs").read_text()
          dialog=(source/"dialogs/show.rs").read_text()
          fonts=(source/"fonts.rs").read_text()
          native=(Path("builder/tools/gridcraft_android/gridcraft_tools.rs")).read_text()
          assert "GRIDCRAFT_ANDROID_USER_ICON_V2" in title
          assert "GRIDCRAFT_ANDROID_NATIVE_MENU_V1" in title
          assert "GRIDCRAFT_ANDROID_TRACKPAD_DRAG_NO_SCROLL_V1" in show
          assert "GC_TWO_FINGER_ONLY_PAN_V1" in show
          assert "gridcraft_android_take_dcs" in dialog
          assert "pub fn reload_catalog()" in fonts
          assert "GC_ANDROID_CTRL_Q_V1" in native
          assert "GC_ANDROID_SAVE_AS_SHORTCUT_V1" in native
          assert "GRIDCRAFT_PHOTO_WHEEL_V1" in native
          assert "fonts::bind_faces(&mut definitions, family, &fonts::faces_of(family))" in native
          # Generated Android Activity/src files exist only AFTER build.sh runs.
          # Here verify copied/staged sources; compile is the next separate gate.
          staging = Path("builder/tools/gridcraft_android")
          wheel = staging / "gridcraft_stylus_wheel.rs"
          assert wheel.is_file() and "PhotoCraft Default radial layout" in wheel.read_text()
          overlay = (staging/"overlay.py").read_text()
          assert "mod gridcraft_stylus_wheel;" in overlay
          assert "self.tools.filter_raw_input(ctx, raw);" in overlay
          assert "gridcraft-wheel-gc.rgba" in overlay
          java = (staging/"GridCraftJavaMethods.java.inc").read_text()
          assert "gcStylusWheelIntercept" in java and "Magic-Pencil" in java
          assert "dispatchGenericMotionEvent" in java and "ACTION_HOVER_MOVE" in java
          assert "gcStylusWheelPollHover" in java
          assert "gc_poll_wheel_hover" in native
          wheel_source = wheel.read_text()
          assert "const SIZE: f32 = 312.0;" in wheel_source
          assert "const INNER: f32 = 46.0;" in wheel_source
          assert "WHEEL_ENLARGEMENT" not in wheel_source
          assert "size_percent: 75.0, opacity_percent: 85.0" in wheel_source
          assert "self.size_percent = 75.0;" in wheel_source
          assert "fn draw_icon(" in wheel_source and "fn stylus_hover(" in wheel_source
          assert "fn stylus_contact(" in wheel_source
          assert "icons::paint" not in wheel_source
          assert "GC_STYLUS_HOVER_V2" in java and "GC_STYLUS_HOVER_V3" in java
          assert "gcInstallPassiveHoverObservers" in java
          assert "SOURCE_STYLUS" in java
          assert "gcStylusWheelPollHover" in java
          assert "gc_poll_wheel_hover" in native
          assert "GC_STYLUS_CONTACT_CURSOR_V1" in java
          assert "gcStylusWheelPollContact" in java
          assert "gc_poll_wheel_contact" in native
          assert "self.stylus_wheel.stylus_contact(&sample, ctx);" in native
          assert "GC_ANDROID_CTRL_Z_V1" in java
          assert "gcHandleUndoShortcut(event)" in overlay
          assert 'inner.run("edit.undo"' in native
          assert "fn paint_stylus_pointer" in wheel_source
          assert "let hover_fresh" in wheel_source
          assert 'Id::new("gc-hover-round-cursor")' in wheel_source
          assert 'Id::new("gc-contact-only-round-cursor")' not in wheel_source
          assert "paint_notification" in wheel_source
          assert "FEEDBACK_HOLD: Duration = Duration::from_millis(1900)" in wheel_source
          assert "FEEDBACK_FADE: Duration = Duration::from_millis(500)" in wheel_source
          assert 'Id::new("gc-wheel-bottom-notification")' in wheel_source
          assert "screen.max.y-43.0" in wheel_source
          assert 'egui::Window::new("Stylus Wheel — Default")' in wheel_source
          assert "Style: Default  •  8 segments" in wheel_source
          assert "Actual-size preview appears beside this window." in wheel_source
          assert "Restore Default" in wheel_source
          assert "Self::green_slider" not in wheel_source
          assert "title_bar(false)" not in wheel_source
          assert "PhotoCraft reference: alternating graphite greys" in wheel_source
          assert "self.preview_center=Some(at)" in wheel_source
          assert "fn deck_style_curved_arrow" in wheel_source
          assert "7 => deck_style_curved_arrow(p, rect, true)" in wheel_source
          assert "Color32::from_rgb(62, 63, 65)" in wheel_source
          assert "Color32::from_rgb(46, 47, 49)" in wheel_source
          assert "Stroke::new(0.8*scale,LIME)" in wheel_source
          assert "gcHoverLastScan" in java
          assert "gcAttachPassiveHover(group.getChildAt(i))" in java
          assert "inner.commit_edit(0, 0, false, false)" in native
          assert "nothing to undo" in wheel_source
          code = Path("builder/lib/android_project.py").read_text()
          assert "0.19.1-android.8" in code
          assert "com.artcraft.gridcraft" in code
          print("PASS: GridCraft v0.19.1 Android.7 PhotoCraft Default wheel parity and pre-touch round hover cursor preflight")
          PY
      - name: Set up Java 21, Rust stable (upstream requires Rust >= 1.95)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK 27 and approved icon tooling
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          if [ ! -d "$NDK" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
            "$SDKMANAGER" --install 'ndk;27.2.12479018'
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Refuse existing tag and preserve production updater
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists"; exit 1
          fi
          echo "e35af23c45ee75e1e026374c7b2458ac9f616cc82ffe39465f9c0ad3f3aeb7b2  assets/gridcraft/launcher-user-20261103.png" | sha256sum -c -
          cp templates/android/ArtCraftUpdater.java builder/templates/android/ArtCraftUpdater.java
          cp templates/android/updater.rs builder/templates/android/updater.rs
          cp lib/inapp_updater.py builder/lib/inapp_updater.py
          python3 - <<'PY'
          from pathlib import Path
          updater=Path("builder/lib/inapp_updater.py").read_text()
          assert '"gridcraft": "gridcraft-v0.19.1-android.8"' in updater
          sh=Path("builder/lib/build-common.sh")
          s=sh.read_text()
          marker='[[ -f "$ANDROID_DIR/Cargo.toml" && -f "$ANDROID_DIR/src/lib.rs" ]] || fail '
          assert s.count(marker)==1
          patch='''if [[ "$APP" == "gridcraft" ]]; then
              python3 "$ROOT/lib/inapp_updater.py" "$APP" "$ANDROID_DIR" "$ROOT" || fail "Updater integration failed"
          fi
          '''
          sh.write_text(s.replace(marker,patch+marker,1))
          project=Path("builder/lib/android_project.py").read_text()
          assert '"0.19.1-android.8" if app == "gridcraft"' in project
          assert 'and android_meta["package"] == "com.artcraft.gridcraft"' in project
          assert 'code = version_code(version)' in project
          assert ((1<<24)|(19<<8)|1)==16782081
          assert "PackageInstaller" in Path("builder/templates/android/ArtCraftUpdater.java").read_text()
          assert 'invoke(android, "download")' in Path("builder/templates/android/updater.rs").read_text()
          PY
          bash -n builder/lib/build-common.sh
      - name: Build size-optimized original-package ARM64 APK using temporary builder key
        shell: bash
        timeout-minutes: 145
        run: |
          set -euo pipefail
          test ! -e builder/keys/artcraft-builder.jks
          ICON="$GITHUB_WORKSPACE/assets/gridcraft/launcher-user-20261103.png"
          echo "e35af23c45ee75e1e026374c7b2458ac9f616cc82ffe39465f9c0ad3f3aeb7b2  $ICON" | sha256sum -c -
          bash builder/build.sh -gridcraft -packagename=com.artcraft.gridcraft -appicon="$ICON"
      - name: Verify original-package build, in-app updater, version, ABI and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find builder/output -maxdepth 1 -type f -iname '*gridcraft*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-signing.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "name='$PACKAGE'" apk-badging.txt
          grep -F "versionCode='$VERSION_CODE'" apk-badging.txt
          grep -F "versionName='$VERSION'" apk-badging.txt
          test -s builder/source/gridcraft/apps/gridcraft-android/src/updater.rs
          test -s builder/source/gridcraft/apps/gridcraft-android/java/com/artcraft/gridcraft/ArtCraftUpdater.java
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              assert 'classes.dex' in names
              assert any(x.startswith('lib/arm64-v8a/') and x.endswith('.so') for x in names)
              assert all(not x.startswith('lib/') or x.startswith('lib/arm64-v8a/') for x in names)
              assert not any(x.endswith(('.jks', '.keystore', '.p12')) for x in names)
          print('PASS: original production package constructed with ARM64 native libraries and approved updater')
          PY
      - name: Sign with existing GridCraft production key only after certificate continuity check
        shell: bash
        env:
          KEY_B64: ${{ secrets.GRIDCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.GRIDCRAFT_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.GRIDCRAFT_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.GRIDCRAFT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" && test -n "$STOREPASS" && test -n "$KEYPASS" && test "$KEYALIAS" = "gridcraft" || {
            echo "::error::Original signing secrets missing or incorrect"; exit 1
          }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/gridcraft-production.jks"
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/gridcraft-production.jks" -storepass:env STOREPASS -alias "$KEYALIAS" > "$RUNNER_TEMP/gridcraft-production.pem"
          observed="$(openssl x509 -in "$RUNNER_TEMP/gridcraft-production.pem" -outform DER | sha256sum | awk '{print toupper($1)}')"
          test "$observed" = "$EXPECTED_CERT" || { echo "::error::Original certificate mismatch; NEVER publish"; exit 1; }
          APK_SOURCE="$(find builder/output -maxdepth 1 -type f -iname '*gridcraft*.apk' -print -quit)"
          test -s "$APK_SOURCE"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p publish
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_SOURCE" "$RUNNER_TEMP/gridcraft-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/gridcraft-production.jks" --ks-key-alias "$KEYALIAS" --ks-pass env:STOREPASS --key-pass env:KEYPASS --v4-signing-enabled false --out "publish/$APK" "$RUNNER_TEMP/gridcraft-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "publish/$APK" > publish/certificate.txt
          "$BUILD_TOOLS/aapt" dump badging "publish/$APK" > publish/badging.txt
          grep -F "name='$PACKAGE'" publish/badging.txt
          grep -F "versionName='$VERSION'" publish/badging.txt
          grep -F "versionCode='$VERSION_CODE'" publish/badging.txt
          python3 - <<'PY'
          import os,re,zipfile
          from pathlib import Path
          cert=Path("publish/certificate.txt").read_text()
          matches={re.sub("[^0-9A-F]","",x.upper()) for x in re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F:]{64,95})",cert,re.I)}
          assert matches=={os.environ["EXPECTED_CERT"]}, "Finished APK certificate mismatch"
          with zipfile.ZipFile(Path("publish")/os.environ["APK"]) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert "classes.dex" in names
              libs=[x for x in names if x.startswith("lib/") and x.endswith(".so")]
              assert libs and all(x.startswith("lib/arm64-v8a/") for x in libs)
              assert not any(x.endswith((".jks",".keystore",".p12")) for x in names)
          print("PASS: original signer / original package / versionCode / ARM64 verified")
          PY
          (cd publish && sha256sum "$APK" > SHA256SUMS.txt)

      - name: Publish NEW owner-approved GridCraft stable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          test -s "publish/$APK" && test -s publish/SHA256SUMS.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists"; exit 1
          fi
          cat > publish/NOTES.md <<'NOTES'
          GridCraft v0.19.1-android.8 — owner-approved ARM64 production release.

          Based on user-tested GridCraft Android.7. New wheel Default and Restore Default: 75% size, 85% opacity. Existing saved wheel settings are preserved.
          PhotoCraft-style two-tone grey wheel, green Gc branding, eight configurable segments, hover cursor and bottom-centre notifications.
          Preserves fonts, SAF document access, physical keyboard shortcuts, touch and trackpad gestures, and original-key-verified in-app updater.

          Original Android package: com.artcraft.gridcraft
          versionName: 0.19.1-android.8
          versionCode: 16782081
          Original signer SHA256: 09D292709D4DCCE84A65E828BDD8A2CE93DE62FA4DC6C584BD6269839DA8090D
          Previous published GridCraft releases are retained. Back up important spreadsheets before updating.
          NOTES
          gh release create "$TAG" "publish/$APK" publish/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "GridCraft v0.19.1-android.8 — Stable ARM64" \
            --notes-file publish/NOTES.md --latest
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,isPrerelease,assets
      - name: Always erase temporary production signing material
        if: always()
        run: |
          rm -rf builder/keys builder/output
          rm -f "$RUNNER_TEMP/gridcraft-production.jks" "$RUNNER_TEMP/gridcraft-production.pem" "$RUNNER_TEMP/gridcraft-aligned.apk"
