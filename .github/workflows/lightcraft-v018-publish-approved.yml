name: Publish verified LightCraft v0.18.0 Android.1 (ONE SHOT)

on:
  push:
    branches:
      - feature/lightcraft-v0180-android-test-20261104
    paths:
      - '.github/workflows/lightcraft-v018-publish-approved.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.repository == 'KosmosSG/artcraft-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject existing tag or release (never overwrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view lightcraft-v0.18.0-android.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "STOP: release already exists"; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/lightcraft-v0.18.0-android.1 >/dev/null; then
            echo "STOP: tag already exists"; exit 1
          fi
      - name: Download previously signed and certificate-verified APK
        uses: actions/download-artifact@v4
        with:
          run-id: '42565121583'
          github-token: ${{ github.token }}
          name: LightCraft-v0.18.0-android.1-PRODUCTION-SIGNED-VERIFIED
          path: signed
      - name: Independently validate artifact identity, certificate and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK='signed/LightCraft-v0.18.0-android.1-arm64-v8a.apk'
          test -s "$APK"
          cd signed
          sed 's#verified/##g' SHA256SUMS.txt | sha256sum -c -
          cd ..
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$SDK/build-tools/35.0.0/aapt"
          SIGNER="$SDK/build-tools/35.0.0/apksigner"
          test -x "$AAPT" && test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs "$APK" > verified-certificate.txt
          grep -Fqi 'certificate SHA-256 digest: b2c894be26afd541ed9915aa3861b82b040f938dfcd84d853feaed8ce29bf2f4' verified-certificate.txt
          "$AAPT" dump badging "$APK" > verified-badging.txt
          grep -Eq "^package: name='com.artcraft.lightcraft' versionCode='[0-9]+' versionName='0.18.0-android.1'" verified-badging.txt
          unzip -Z1 "$APK" | grep -Eq '^lib/arm64-v8a/[^/]+\.so$'
          echo "Verified same original LightCraft production certificate and ARM64 production package" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish official GitHub Release only once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create lightcraft-v0.18.0-android.1             signed/LightCraft-v0.18.0-android.1-arm64-v8a.apk             signed/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target '1cf18815195c640b28dfd50410ae112a8975c8b4'             --title 'LightCraft v0.18.0-android.1 — ARM64 Production Release'             --notes 'Official LightCraft v0.18.0-android.1 ARM64 production release. Original LightCraft signing certificate verified against v0.11.0-android.8 (SHA-256 B2:C8:94:BE:26:AF:D5:41:ED:99:15:AA:38:61:B8:2B:04:0F:93:8D:FC:D8:4D:85:3F:EA:ED:8C:E2:9B:F2:F4). Device-tested test-package features: trackpad hover, compact LC menu, update checker, Android keyboard/input. GPU backend diagnostics included; adaptive 165 FPS optimization is not claimed. Production package com.artcraft.lightcraft. Keep important photo libraries backed up when updating.'
