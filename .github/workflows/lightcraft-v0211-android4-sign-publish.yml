name: LightCraft v0.21.1 Android.4 OWNER APPROVED ORIGINAL-SIGNED RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - release/lightcraft-v0211-android4-owner-approved-20261114
    paths:
      - '.github/workflows/lightcraft-v0211-android4-sign-publish.yml'
      - 'tools/lightcraft/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: lightcraft-v0211-android4-approved-release
  cancel-in-progress: true

jobs:
  lightcraft-only:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref_name == 'release/lightcraft-v0211-android4-owner-approved-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      # Upstream's [profile.dist] uses thin LTO; keep opt-level 3
      # to preserve the raw photo development pipeline's performance.
      CARGO_PROFILE_RELEASE_LTO: 'thin'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      RUSTFLAGS: '-C strip=symbols'
    steps:
      - name: Checkout protected ArtCraft Android baseline-derived branch
        uses: actions/checkout@v4
        with:
          path: suite
          fetch-depth: 0  # Needed for the protected baseline ancestry check.
          persist-credentials: false
      - name: Checkout immutable official LightCraft v0.21.1
        uses: actions/checkout@v4
        with:
          repository: storytold/lightcraft
          ref: 361e3bc0c838ffe5e5cea515b1fe5b71951989c6
          path: source
          persist-credentials: false
      - name: Checkout reviewed Android reference builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: builder
          persist-credentials: false
      - name: Verify owner-tested LightCraft source and approved candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C suite merge-base --is-ancestor e594525e0edbd09d5dcbaaa8bf5d406ca2a0bfaa HEAD
          git -C suite diff --exit-code e594525e0edbd09d5dcbaaa8bf5d406ca2a0bfaa HEAD -- tools/lightcraft assets/lightcraft
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43554271232" > approved.json
          jq -e '.conclusion == "success" and
            .head_sha == "e594525e0edbd09d5dcbaaa8bf5d406ca2a0bfaa" and
            .head_branch == "fix/lightcraft-v0211-android4-lc-default-apk-optimized-20261114" and
            .path == ".github/workflows/lightcraft-v0211-android4-size-optimized-test.yml"' approved.json
          test "$(git -C source rev-parse HEAD)" = '361e3bc0c838ffe5e5cea515b1fe5b71951989c6'
          git -C suite merge-base --is-ancestor 1cf18815195c640b28dfd50410ae112a8975c8b4 HEAD
          python3 -m unittest discover -s suite/tools/lightcraft -p 'test_patch_v017_builder.py' -v
          # The pinned official source SHA and patch anchors are verified above and below.
          python3 suite/tools/lightcraft/patch_v0211_android.py --source source --builder builder --suite suite
          python3 suite/tools/lightcraft/patch_v0211_java_hooks.py --builder builder
          test -s suite/assets/lightcraft/lc-user-approved.png
          test -s suite/assets/lightcraft/lc-user-20261109.png
      - name: Preserve approved LightCraft source/UI, SAF and launcher icon in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 suite/tools/lightcraft/patch_v0211_android.py --source source --builder builder --suite suite --apply
          python3 suite/tools/lightcraft/patch_v0211_stylus.py --source source --suite suite --apply
          python3 suite/tools/lightcraft/patch_v0211_java_hooks.py --builder builder --apply
          grep -Fq 'lcRecordStylusMotion(event)' builder/templates/android/SafActivity.java
          grep -Fq 'lcResumeDownloadedUpdate()' builder/templates/android/SafActivity.java
          grep -Fq 'REQUEST_INSTALL_PACKAGES' builder/lib/build-common.sh
          grep -Fq 'Download & Install in App' source/crates/ui-egui/src/dialogs.rs
          grep -Fq 'android_stylus_wheel::capture' source/crates/ui-egui/src/app/input.rs
          grep -Fq 'lcBeginUpdateDownload' builder/templates/android/lightcraft_updates.java.inc
          test -s source/crates/ui-egui/src/android_stylus_wheel.rs
          # Version is changed only inside the disposable upstream checkout; no released source is edited.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/Cargo.toml")
          content = p.read_text()
          old = 'version = "0.21.1"'
          if content.count(old) != 1:
              raise SystemExit("STOP: expected one upstream workspace version anchor")
          p.write_text(content.replace(old, 'version = "0.21.1-android.4"', 1))
          PY
          grep -Fq 'version = "0.21.1-android.4"' source/Cargo.toml
          grep -Fq 'LIGHTCRAFT_V017_WRITE_NEW_PRIVATE_ONLY' builder/lib/build-common.sh
          grep -Fq 'artcraft.lightcraft.check_updates_requested' source/crates/ui-egui/src/menus/run.rs
          grep -Fq 'artcraft.lightcraft.include_preview' source/crates/ui-egui/src/dialogs.rs
          test -s source/crates/ui-egui/src/menus/lc-menu.png
          grep -Fq 'bytes://lightcraft/lc-menu.png' source/crates/ui-egui/src/menus/menubar.rs
          grep -Fq 'egui_extras::install_image_loaders' source/crates/ui-egui/src/menus/menubar.rs
          grep -Fq 'Android menu row hover highlight' suite/tools/lightcraft/patch_v0211_android.py
          grep -Fq 'egui_extras = { workspace = true, features = ["image"] }' source/crates/ui-egui/Cargo.toml
          grep -Fq 'Stylus Wheel Customization' source/crates/ui-egui/src/menus/menubar.rs
          grep -Fq 'ui.menu_button("Stylus Wheel"' source/crates/ui-egui/src/menus/menubar.rs
          grep -Fq 'Enable Stylus Wheel' source/crates/ui-egui/src/menus/menubar.rs
          grep -Fq 'set_enabled_feedback' source/crates/ui-egui/src/android_stylus_wheel.rs
          grep -Fq 'enabled: true, size_percent: 75.0, opacity_percent: 85.0' source/crates/ui-egui/src/android_stylus_wheel.rs
          grep -Fq '39.0 * k * 1.10 * 1.15' source/crates/ui-egui/src/android_stylus_wheel.rs
          grep -Fq 'c - vec2(0.0, 11.0) * k' source/crates/ui-egui/src/android_stylus_wheel.rs
          grep -Fq 'if ui.button("Restore Default").clicked() { prefs = WheelPrefs::default(); }' source/crates/ui-egui/src/android_stylus_wheel.rs
          test "${CARGO_PROFILE_RELEASE_LTO}" = 'thin'
          test "${CARGO_PROFILE_RELEASE_CODEGEN_UNITS}" = '1'
          grep -Fq 'lc_glyph(ui.ctx())' source/crates/ui-egui/src/android_stylus_wheel.rs
          grep -Fq 'crate::icons::paint' source/crates/ui-egui/src/android_stylus_wheel.rs
          if grep -Fq 'lightcraft.android.wheel.pad' source/crates/ui-egui/src/android_stylus_wheel.rs; then
            echo 'STOP: unwanted right-side floating shortcut pad remains'; exit 1
          fi
          grep -Fq 'crate::android_stylus_wheel::show(self, &ctx)' source/crates/ui-egui/src/app/frame.rs
          grep -Fq 'stylus_wheel: crate::android_stylus_wheel::WheelPrefs::default()' source/crates/ui-egui/src/state/settings.rs
          python3 -m py_compile suite/tools/lightcraft/patch_v0211_android.py suite/tools/lightcraft/patch_v0211_stylus.py suite/tools/lightcraft/patch_v0211_java_hooks.py
      - name: Android release-style build toolchain (no permanent keystores)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust 1.95 ARM64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: aarch64-linux-android
      - name: Install APK icon renderer
        run: python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Cache Rust crates and compiled build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            builder/build/lightcraft/target
          key: lightcraft-v0211-android4-rust195-lto-thin-codegen1-20261114
          restore-keys: |
            lightcraft-v0211-arm64-rust195-wheel-20261113
            lightcraft-v020-arm64-rust195-20261110
      - name: Android SDK ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$MANAGER"
          echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk if missing
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo-ndk || cargo install cargo-ndk --locked
      - name: Build optimized PRODUCTION package with temporary build key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builder/source
          mv source builder/source/lightcraft
          test "$(git -C builder/source/lightcraft rev-parse HEAD)" = '361e3bc0c838ffe5e5cea515b1fe5b71951989c6'
          # LightCraft 0.18 uses an inseparable reviewed egui 0.37 + custom winit fork.
          # The shared builder vendors egui-winit 0.36 and winit 0.30.13; replacing
          # the fork caused Rust E0599 for ImeResetCompleted/reset_ime_with_request.
          # Remove ONLY the two incompatible vendor blocks in this disposable builder,
          # leaving every other Android integration (SAF, launcher, updates) intact.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("builder/lib/build-common.sh")
          s = p.read_text()
          blocks = (
              ("echo \"Vendoring the Android-compatible egui-winit for $TITLE (system clipboard via JNI)...\"",
               "# Some apps call `rfd` directly"),
              ("echo \"Vendoring the mouse/scroll-aware winit for $TITLE...\"",
               "# egui-wgpu's lost-surface recovery"),
          )
          for start, end in blocks:
              if s.count(start) != 1 or s.count(end) != 1:
                  raise SystemExit(f"STOP: LightCraft builder vendor anchor drift: {start}")
              a = s.index(start)
              b = s.index(end, a)
              if b <= a:
                  raise SystemExit("STOP: unexpected Android builder ordering")
              block = s[a:b]
              if "python3 - \"$SRC/Cargo.toml\" <<'PY'" not in block:
                  raise SystemExit("STOP: missing expected vendor-patch block")
              s = s[:a] + 'echo "LightCraft v0.21.1: retaining pinned egui/winit IME-compatible forks"\n' + s[b:]
          # The reference builder's Android launcher hard-codes egui-winit 0.36,
          # introducing a second IME-incompatible copy even when the workspace
          # correctly keeps the pinned upstream egui-winit 0.37 fork.
          # Change ONLY the LightCraft disposable launcher's generated version.
          old_dependency = 'egui-winit = "0.36"'
          if s.count(old_dependency) != 1:
              raise SystemExit("STOP: LightCraft launcher egui-winit dependency anchor drift")
          s = s.replace(old_dependency, 'egui-winit = "0.37"', 1)
          p.write_text(s)
          PY
          # LightCraft v0.21.1's upstream UI requires Context in raw_input_hook.
          # The reference builder generates the legacy 1-argument call for
          # non-eframe App types and an egui-winit Android helper removed in 0.37.
          # Adapt only this disposable builder's LightCraft launcher template.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("builder/lib/build-common.sh")
          s = p.read_text()
          old = 'inner_hook = "let _ = ctx;\\n        self.inner.raw_input_hook(raw);"'
          new = 'inner_hook = ("self.inner.raw_input_hook(ctx, raw);" if app == "lightcraft" else "let _ = ctx;\\n        self.inner.raw_input_hook(raw);")'
          if s.count(old) != 1:
              raise SystemExit("STOP: raw_input_hook launcher template anchor drift")
          s = s.replace(old, new, 1)
          old_activity = '    egui_winit::android_activity::set_activity(android_app.activity_as_ptr());'
          # The reference builder has two launcher variants; both include
          # the removed API. This builder copy is LightCraft-only.
          if s.count(old_activity) != 2:
              raise SystemExit("STOP: expected two reference launcher activity hooks")
          s = s.replace(old_activity,
              '    // LightCraft 0.18: egui-winit 0.37 does not expose android_activity.',
              2)
          p.write_text(s)
          PY
          # LightCraft-only GPU baseline instrumentation: keep Vulkan-first
          # with GL fallback, and report the ACTUAL adapter and hardware limits.
          # This does not force FPS, increase memory use or affect other apps.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("builder/lib/build-common.sh")
          s = p.read_text()
          anchor = '            let supported = adapter.limits();'
          if s.count(anchor) != 2:
              raise SystemExit("STOP: expected two LightCraft Android GPU launcher templates")
          report = (
              '            let info = adapter.get_info();\n'
              '            log::info!("LIGHTCRAFT_GPU backend={{:?}} name={{}} device={{}} driver={{}} max_texture_2d={{}} max_buffer_size={{}}", '
              'info.backend, info.name, info.device, info.driver, '
              'adapter.limits().max_texture_dimension_2d, adapter.limits().max_buffer_size);\n'
              + anchor
          )
          s = s.replace(anchor, report, 2)
          p.write_text(s)
          PY
          # The removed vendor blocks also created this directory. Preserve it
          # for the builder's separate egui-wgpu surface and Android rfd adapters.
          mkdir -p builder/source/lightcraft/vendor
          bash -n builder/lib/build-common.sh
          # Preserve upstream's custom IME-enabled winit fork, adding only the
          # missing Android hover event dispatch (not the reference's full backend).
          git clone --filter=blob:none --no-checkout https://github.com/storytold/winit.git builder/source/lightcraft/vendor/winit
          git -C builder/source/lightcraft/vendor/winit checkout --detach a517b3846ee8457d84ee4975110bfda6797c44dc
          test "$(git -C builder/source/lightcraft/vendor/winit rev-parse HEAD)" = a517b3846ee8457d84ee4975110bfda6797c44dc
          python3 suite/tools/lightcraft/patch_android_pointer_hover.py builder/source/lightcraft/vendor/winit/src/platform_impl/android/mod.rs
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          p = Path("builder/source/lightcraft/Cargo.toml")
          s = p.read_text()
          old = 'winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }'
          if s.count(old) != 1:
              raise SystemExit("STOP: LightCraft pinned custom winit Cargo patch drift")
          s = s.replace(old, 'winit = { path = "vendor/winit" }', 1)
          tomllib.loads(s)
          p.write_text(s)
          PY
          # No permanent-signing secrets, no production certificate, no release publishing.
          bash builder/build.sh -lightcraft \
            -packagename=com.artcraft.lightcraft \
            -appname='LightCraft' \
            "-appicon=$GITHUB_WORKSPACE/suite/assets/lightcraft/lc-user-20261109.png"
      - name: Validate production package, ABI and temporary signature
        shell: bash
        run: |
          set -euo pipefail
          APK='builder/output/lightcraft-0.21.1-android.4.apk'
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > candidate-certificate.txt
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" > candidate-badging.txt
          grep -Eq "^package: name='com.artcraft.lightcraft' versionCode='[0-9]+' versionName='0.21.1-android.4'" candidate-badging.txt
          grep -Fq 'launchable-activity:' candidate-badging.txt
          unzip -Z1 "$APK" | grep -Eq '^lib/arm64-v8a/[^/]+\.so$'
          python3 - "$APK" candidate-certificate.txt <<'PY'
          import pathlib,re,sys,zipfile
          apk,certificate=sys.argv[1:]
          lines=pathlib.Path(certificate).read_text()
          previous="b2c894be26afd541ed9915aa3861b82b040f938dfcd84d853feaed8ce29bf2f4"
          cert=re.search(r"certificate SHA-256 digest:\s*([0-9a-fA-F:]+)", lines)
          if not cert:
              raise SystemExit("STOP: cannot independently verify temporary signer certificate")
          fingerprint=cert.group(1).replace(":","").lower()
          if fingerprint == previous:
              raise SystemExit("STOP: unexpected production certificate")
          with zipfile.ZipFile(apk) as z:
              n=z.namelist()
              if not any(x.startswith("lib/arm64-v8a/") and x.endswith(".so") for x in n):
                  raise SystemExit("STOP: native ARM64 library missing")
              if not any(x.endswith(".dex") for x in n):
                  raise SystemExit("STOP: Android Java Activity missing")
          PY
          mkdir -p verified
          cp "$APK" verified/LightCraft-v0.21.1-android.4-arm64-v8a-RESIGN-REQUIRED.apk
          sha256sum verified/*.apk > verified/SHA256SUMS.txt
          stat -c '%s' verified/*.apk > verified/APK_SIZE_BYTES.txt
          printf 'Optimized LightCraft Android.4 APK bytes: '
          cat verified/APK_SIZE_BYTES.txt
          echo 'Native ARM64 payload details:'
          unzip -l "$APK" | grep 'lib/arm64-v8a/.*[.]so' || true
          cp candidate-certificate.txt candidate-badging.txt verified/
          {
            echo '### LightCraft v0.21.1-android.4 — disposable-signing test candidate'
            echo 'Target: HONOR MagicPad 4, ARM64 only'
            echo 'Package: com.artcraft.lightcraft; temporary key, requires original signing'
            echo 'Published protected baseline: lightcraft-v0.20.0-android.1; working branch descends from approved LightCraft Android source'
            echo 'Source: storytold/lightcraft v0.21.1 SHA 361e3bc0c838ffe5e5cea515b1fe5b71951989c6'
            echo 'Permanent signing and release publication are gated in the next job.'
            echo 'Device functional validation: PENDING.'
            cat verified/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production-package candidate for original certificate signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LightCraft-v0.21.1-android.4-PRODUCTION-CANDIDATE-RESIGN-REQUIRED
          path: verified/
          retention-days: 14
          if-no-files-found: error
  sign-and-publish:
    needs: lightcraft-only
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref_name == 'release/lightcraft-v0211-android4-owner-approved-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      TAG: lightcraft-v0.21.1-android.4
      APK: LightCraft-v0.21.1-android.4-arm64-v8a.apk
      ORIGINAL_CERT: b2c894be26afd541ed9915aa3861b82b040f938dfcd84d853feaed8ce29bf2f4
    steps:
      - name: Check production secrets and refuse any existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.LIGHTCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.LIGHTCRAFT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STOREPASS"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::LightCraft release already exists; refusing overwrite"; exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi
      - name: Download exact same-run production package, verified by prior job
        uses: actions/download-artifact@v4
        with:
          name: LightCraft-v0.21.1-android.4-PRODUCTION-CANDIDATE-RESIGN-REQUIRED
          path: candidate
      - name: Check candidate and production in-place upgrade continuity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=candidate/LightCraft-v0.21.1-android.4-arm64-v8a-RESIGN-REQUIRED.apk
          test -s "$SOURCE"
          (cd candidate && sed 's#verified/##g' SHA256SUMS.txt | sha256sum -c -)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD="$SDK/build-tools/35.0.0"
          "$BUILD/apksigner" verify --verbose --print-certs "$SOURCE" > candidate-certificate.txt
          if grep -Fqi "certificate SHA-256 digest: $ORIGINAL_CERT" candidate-certificate.txt; then
            echo "::error::Input incorrectly bears original permanent signing certificate"; exit 1
          fi
          "$BUILD/aapt" dump badging "$SOURCE" > candidate-package.txt
          grep -Eq "^package: name='com.artcraft.lightcraft' versionCode='[0-9]+' versionName='0.21.1-android.4'" candidate-package.txt
          python3 - "$SOURCE" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=z.namelist()
              assert z.testzip() is None and len(names)==len(set(names))
              libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
              assert 'classes.dex' in names
              assert not any(n.lower().endswith(('.p12','.keystore','.jks')) for n in names)
          PY
          curl --proto '=https' --tlsv1.2 --location --fail --retry 3 --silent --show-error \
            'https://github.com/KosmosSG/artcraft-android/releases/download/lightcraft-v0.20.0-android.1/LightCraft-v0.20.0-android.1-arm64-v8a.apk' \
            -o "$RUNNER_TEMP/lightcraft-previous.apk"
          "$BUILD/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/lightcraft-previous.apk" > old-certificate.txt
          grep -Fqi "certificate SHA-256 digest: $ORIGINAL_CERT" old-certificate.txt
          "$BUILD/aapt" dump badging "$RUNNER_TEMP/lightcraft-previous.apk" > old-package.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          def code(path):
              txt=Path(path).read_text()
              m=re.search(r"(?m)^package: name='com\.artcraft\.lightcraft' versionCode='(\d+)'",txt)
              if not m: raise SystemExit('STOP: missing production package versionCode')
              return int(m.group(1))
          previous,candidate=code('old-package.txt'),code('candidate-package.txt')
          print(f'Production versionCode continuity: {previous} -> {candidate}')
          if candidate<=previous: raise SystemExit('STOP: downgrade or unchanged versionCode')
          PY
          rm -f "$RUNNER_TEMP/lightcraft-previous.apk"
      - name: Sign using original LightCraft key and verify payload/certificate
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.LIGHTCRAFT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD="$SDK/build-tools/35.0.0"
          KEY="$RUNNER_TEMP/lightcraft-original.p12"
          trap 'rm -f "$KEY" "$RUNNER_TEMP/lightcraft-cert.pem" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf %s "$KEYSTORE_B64" | base64 --decode > "$KEY"
          test -s "$KEY"
          keytool -exportcert -rfc -storetype PKCS12 -keystore "$KEY" \
            -alias artcraftbuilder -storepass:env STOREPASS > "$RUNNER_TEMP/lightcraft-cert.pem"
          actual="$(openssl x509 -in "$RUNNER_TEMP/lightcraft-cert.pem" -outform DER | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$ORIGINAL_CERT" ]; then
            echo "::error::Incorrect LightCraft signing identity"; exit 1
          fi
          SOURCE=candidate/LightCraft-v0.21.1-android.4-arm64-v8a-RESIGN-REQUIRED.apk
          mkdir -p published
          "$BUILD/zipalign" -P 16 -f 4 "$SOURCE" "$RUNNER_TEMP/aligned.apk"
          "$BUILD/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias artcraftbuilder \
            --ks-pass env:STOREPASS --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out "published/$APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD/apksigner" verify --verbose --print-certs "published/$APK" > published/SIGNATURE.txt
          grep -Fqi "certificate SHA-256 digest: $ORIGINAL_CERT" published/SIGNATURE.txt
          "$BUILD/zipalign" -c -P 16 4 "published/$APK"
          "$BUILD/aapt" dump badging "published/$APK" > published/PACKAGE.txt
          grep -Eq "^package: name='com.artcraft.lightcraft' versionCode='[0-9]+' versionName='0.21.1-android.4'" published/PACKAGE.txt
          python3 - "$SOURCE" "published/$APK" <<'PY'
          import hashlib,sys,zipfile
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {n:hashlib.sha256(z.read(n)).hexdigest()
                          for n in z.namelist() if not n.upper().startswith('META-INF/')}
          assert payload(sys.argv[1])==payload(sys.argv[2]), 'STOP: signing altered app payload'
          PY
          (cd published && sha256sum "$APK" > SHA256SUMS.txt)
          stat -c '%s' "published/$APK" > published/APK_SIZE_BYTES.txt
          printf '%s\n' "$ORIGINAL_CERT" > published/SIGNING-CERTIFICATE-SHA256.txt
      - name: Publish approved stable LightCraft release only once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing tag will not be overwritten"; exit 1
          fi
          cat > published/RELEASE-NOTES.md <<'NOTES'
          # LightCraft v0.21.1-android.4 — Stable ARM64

          Approved Android package based on official upstream LightCraft v0.21.1.
          - PhotoCraft-style eight-segment dual-tone stylus wheel, refined native LightCraft vector icons, blue/cyan hub and soft shadow.
          - Center Lc lettering enlarged another 15%, raised slightly; no square logo background.
          - Wheel size 75% and opacity 85% by default and on Restore Default; eight customizable actions.
          - Stylus hovering, pen button activation, wheel input isolation, bottom-center message bar.
          - Lc > Stylus Wheel submenu with Enable toggle and Customization; right shortcut pad removed.
          - In-app GitHub update checks/download and Android-confirmed installer; existing Android import, fonts and appearance features.
          - Optimized ARM64 build with thin LTO, one codegen unit and stripped symbols. No features removed.
          - Original production package com.artcraft.lightcraft, permanent signing identity verified against the previous release, and increased versionCode.
          - Owner tested the same-version Android.4 TEST APK: https://github.com/KosmosSG/artcraft-android/actions/runs/43554271232
          - Tested source commit e594525e0edbd09d5dcbaaa8bf5d406ca2a0bfaa; upstream 361e3bc0c838ffe5e5cea515b1fe5b71951989c6.
          - Production version rebuilt under the original app identity and independently verified; back up your photo library before upgrading.
          - Unofficial independently maintained Android port, not an official Storytold distribution.
          NOTES
          gh release create "$TAG" "published/$APK" published/SHA256SUMS.txt \
            published/RELEASE-NOTES.md published/APK_SIZE_BYTES.txt published/SIGNING-CERTIFICATE-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'LightCraft v0.21.1-android.4 — Stable ARM64' \
            --notes-file published/RELEASE-NOTES.md --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > released.json
          python3 - <<'PY'
          import json,os,hashlib
          r=json.load(open('released.json'))
          assets={x['name']:x for x in r['assets']}
          name=os.environ['APK']
          assert name in assets
          size=os.stat('published/'+name).st_size
          expected=hashlib.sha256(open('published/'+name,'rb').read()).hexdigest()
          assert assets[name]['size']==size
          digest=assets[name].get('digest')
          if digest: assert digest=='sha256:'+expected
          print('PASS: published signed LightCraft APK SHA256',expected)
          PY
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
