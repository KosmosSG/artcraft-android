name: PDFCraft v0.18 isolated ARM64 Test APK (NOT PUBLIC)

on:
  push:
    branches:
      - integration/pdfcraft-v018-arm64-candidate-20261104
    paths:
      - .github/workflows/pdfcraft-candidate.yml
      - lib/build-common.sh
      - assets/pdfcraft/**
      - templates/android/pdfcraft_modifiers.rs
      - templates/android/pdfcraft_mobile.rs
      - templates/android/pdfcraft_mobile_java.txt
      - tools/test_pdfcraft_adapter.py
      - tools/pdfcraft/**
      - templates/android/pdfcraft_mobile_java.txt
      - tools/font_scan_budget_regression.py
      - assets/pdfcraft/owner-PDFCraft.svg
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-ephemeral-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/integration/pdfcraft-v018-arm64-candidate-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PDFCRAFT_ANDROID_VERSION_NAME: 0.18.0-android.1
      PDFCRAFT_REF: v0.18.0
      PDFCRAFT_SHA: 3936f93a1479366a951206fc6d3094680fe2d3dc
      PDFCRAFT_ICON_SHA256: 4c0ec54b8d0b85eb05a42c8f1e092199063aa786b2e333d8b50b2a826c342bab
      # Expected cargo-apk2 code for pinned v0.18.0, NOT reserved for published updates.
      EXPECTED_EPHEMERAL_VERSION_CODE: '16781825'

    steps:
      - name: Checkout isolated candidate only
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the exact stable upstream release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="https://github.com/storytold/pdfcraft.git"
          ACTUAL="$(git ls-remote --tags "$REMOTE" "refs/tags/$PDFCRAFT_REF" | awk 'NR == 1 {print $1}')"
          test "$ACTUAL" = "$PDFCRAFT_SHA" || { echo "::error::Official PDFCraft tag changed, missing, or not verified"; exit 1; }
          git clone --depth 1 --branch "$PDFCRAFT_REF" "$REMOTE" source/pdfcraft
          test "$(git -C source/pdfcraft rev-parse HEAD)" = "$PDFCRAFT_SHA"
          test "$(git -C source/pdfcraft remote get-url origin)" = "$REMOTE"
          python3 - <<'PY'
          import pathlib, tomllib
          cargo = tomllib.loads(pathlib.Path("source/pdfcraft/Cargo.toml").read_text())
          assert cargo["workspace"]["package"]["version"] == "0.18.0", "Unexpected upstream workspace version"
          PY
          echo "Official PDFCraft $PDFCRAFT_REF resolves to $PDFCRAFT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Test guarded Android adapter and pinned winit compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_pdfcraft_adapter.py source/pdfcraft
          python3 -m unittest discover -s tools/pdfcraft -p 'test_*.py' -v
          python3 tools/font_scan_budget_regression.py

      - name: Prepare exact owner PDFc artwork as legacy and adaptive launcher
        shell: bash
        run: |
          set -euo pipefail
          echo "$PDFCRAFT_ICON_SHA256  assets/pdfcraft/owner-PDFCraft.svg" | sha256sum --check
          if ! command -v rsvg-convert >/dev/null 2>&1 || ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y librsvg2-bin imagemagick
          fi
          # Owner-supplied image traced to lossless geometric SVG (0.65 average 512px RGBA
          # channel difference). Keep its full red rounded-square silhouette for legacy icons.
          rsvg-convert -w 512 -h 512 assets/pdfcraft/owner-PDFCraft.svg > assets/pdfcraft/approved-icon.png
          # Adaptive icon background is solid matching red (#fb0e00) from build-common.sh;
          # foreground contains ONLY the white PDFc artwork, not a second red square.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          src=Path('assets/pdfcraft/owner-PDFCraft.svg')
          tree=ET.parse(src)
          root=tree.getroot()
          children=list(root)
          red=[x for x in children if x.attrib.get('fill') == '#fb0e00']
          white=[x for x in children if x.attrib.get('fill') == '#f7f7f7']
          assert len(red)==1 and len(white)==1 and len(children)==2, 'Owner icon SVG changed unexpectedly'
          root.remove(red[0])
          tree.write('assets/pdfcraft/approved-white-only.svg', encoding='unicode')
          PY
          rsvg-convert -w 278 -h 278 assets/pdfcraft/approved-white-only.svg > assets/pdfcraft/foreground-small.png
          convert assets/pdfcraft/foreground-small.png -background none -gravity center -extent 432x432 assets/pdfcraft/approved-foreground.png
          test "$(identify -format '%wx%h' assets/pdfcraft/approved-icon.png)" = '512x512'
          test "$(identify -format '%wx%h' assets/pdfcraft/approved-foreground.png)" = '432x432'
          identify assets/pdfcraft/approved-icon.png assets/pdfcraft/approved-foreground.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust (upstream requires 1.95 or newer)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test PhotoCraft-derived keyboard fix and PDF object read/write code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfcraft-input-tests/src"
          cp templates/android/pdfcraft_modifiers.rs "$RUNNER_TEMP/pdfcraft-input-tests/src/lib.rs"
          cat > "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml" <<'EOF'
          [package]
          name = "pdfcraft-input-tests"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          egui = "=0.37.0"
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml"
          cargo test --manifest-path source/pdfcraft/Cargo.toml -p pdfcraft-cos --lib -j 2

      - name: Configure Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compile PDFCraft candidate with disposable builder key
        shell: bash
        run: |
          set -euo pipefail
          # WARNING: build-common.sh generates a transient builder keystore on this runner.
          # This is never a PDFCraft permanent signing identity.
          test ! -f keys/artcraft-builder.jks
          bash build.sh -pdfcraft -appname=PdfCraft -appicon=assets/pdfcraft/approved-icon.png
          test -f output/pdfcraft-0.18.0.apk
          # cargo-apk2 uses the SemVer numeric triplet for versionCode; an
          # -android.9 suffix alone would reuse android.1's code. Patch only the checked binary manifest
          # integer and re-sign with a NEW disposable builder key from this CI runner.
          python3 tools/pdfcraft/bump_version_code.py \
            output/pdfcraft-0.18.0.apk output/pdfcraft-patched-unsigned.apk 16781824 16781825
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -P 16 -f 4 output/pdfcraft-patched-unsigned.apk output/pdfcraft-aligned.apk
          EPHEMERAL_PASS="$(cat keys/.keystore-password)"
          export EPHEMERAL_PASS
          "$build_tools/apksigner" sign --ks keys/artcraft-builder.jks --ks-type JKS \
            --ks-key-alias artcraftbuilder --ks-pass env:EPHEMERAL_PASS \
            --key-pass env:EPHEMERAL_PASS --v4-signing-enabled false \
            --out output/pdfcraft-0.18.0-android.1.apk output/pdfcraft-aligned.apk
          "$build_tools/apksigner" verify --verbose output/pdfcraft-0.18.0-android.1.apk
          "$build_tools/zipalign" -c -P 16 4 output/pdfcraft-0.18.0-android.1.apk
          rm -f output/pdfcraft-patched-unsigned.apk output/pdfcraft-aligned.apk

      - name: Verify packaged ABI, identity, version, icon and ephemeral signature
        shell: bash
        run: |
          set -euo pipefail
          APK="output/pdfcraft-0.18.0-android.1.apk"
          SDK_ROOT="${ANDROID_HOME}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT2="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
          "$AAPT2" dump badging "$APK" | tee output/pdfcraft-badging.txt
          grep -q "package: name='com.artcraft.pdfcraft'" output/pdfcraft-badging.txt
          grep -q "versionName='0.18.0-android.1'" output/pdfcraft-badging.txt
          grep -q "versionCode='$EXPECTED_EPHEMERAL_VERSION_CODE'" output/pdfcraft-badging.txt
          unzip -Z1 "$APK" | tee output/pdfcraft-archive.txt
          grep -q '^lib/arm64-v8a/.*\.so$' output/pdfcraft-archive.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' output/pdfcraft-archive.txt; then
            echo "::error::Unexpected non-ARM64 native library"; exit 1
          fi
          grep -q 'ic_launcher.png' output/pdfcraft-archive.txt
          grep -q 'pdfcraft_foreground.png' output/pdfcraft-archive.txt
          grep -q 'ic_launcher.xml' output/pdfcraft-archive.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/pdfcraft-ephemeral-certificate.txt
          sha256sum "$APK" | tee output/SHA256SUMS.txt
          echo "CAUTION: transient-key candidate only; not an update or a public release" >> "$GITHUB_STEP_SUMMARY"
          echo "Hardware / PDF fidelity / SAF round-trip remain untested." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ephemeral candidate for inspection (not public release)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: PDFCraft-0.18.0-android.1-EPHEMERAL-NOT-UPDATE
          path: |
            output/pdfcraft-0.18.0-android.1.apk
            output/pdfcraft-badging.txt
            output/pdfcraft-archive.txt
            output/pdfcraft-ephemeral-certificate.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
