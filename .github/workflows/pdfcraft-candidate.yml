name: PDFCraft ARM64 ephemeral candidate (not a release)

on:
  push:
    branches:
      - fix/pdfcraft-collapsible-panel
    paths:
      - .github/workflows/pdfcraft-candidate.yml
      - lib/build-common.sh
      - assets/pdfcraft/**
      - templates/android/pdfcraft_modifiers.rs
      - templates/android/pdfcraft_mobile.rs
      - templates/android/pdfcraft_mobile_java.txt
      - tools/test_pdfcraft_adapter.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-ephemeral-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/fix/pdfcraft-collapsible-panel'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PDFCRAFT_ANDROID_VERSION_NAME: 0.12.1-android.2
      PDFCRAFT_REF: v0.12.0
      PDFCRAFT_SHA: 39844f06b58bc96bae72d3fb56faaa3b6201c945
      PDFCRAFT_ICON_SHA256: acb206f5bb7759a38e604d0d1295753dd08a67fd9d38b19d27f86d8e737c2085
      # Transient first-candidate cargo-apk2 code, NOT reserved for published or future Android revisions.
      EXPECTED_EPHEMERAL_VERSION_CODE: '16780290'

    steps:
      - name: Checkout isolated candidate only
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify the exact stable upstream release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="https://github.com/storytold/pdfcraft.git"
          ACTUAL="$(git ls-remote --tags "$REMOTE" "refs/tags/$PDFCRAFT_REF" | awk 'NR == 1 {print $1}')"
          test "$ACTUAL" = "$PDFCRAFT_SHA" || { echo "::error::Official PDFCraft tag changed, missing, or not verified"; exit 1; }
          git clone --depth 1 --branch "$PDFCRAFT_REF" "$REMOTE" source/pdfcraft
          test "$(git -C source/pdfcraft rev-parse HEAD)" = "$PDFCRAFT_SHA"
          test "$(git -C source/pdfcraft remote get-url origin)" = "$REMOTE"
          echo "Official PDFCraft $PDFCRAFT_REF resolves to $PDFCRAFT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Test guarded Android adapter generation
        run: python3 tools/test_pdfcraft_adapter.py source/pdfcraft

      - name: Prepare owner-supplied red PdfC with clean launcher transparency
        shell: bash
        run: |
          set -euo pipefail
          echo "$PDFCRAFT_ICON_SHA256  assets/pdfcraft/approved-icon.webp" | sha256sum --check
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y imagemagick
          fi
          # Owner-supplied PdfC red glass artwork; external black matte was made transparent.
          # The original PdfC lettering is retained; solid red adaptive background replaces the dark halo.
          convert assets/pdfcraft/approved-icon.webp -resize 512x512 assets/pdfcraft/approved-icon.png
          convert assets/pdfcraft/approved-icon.webp -resize 278x278 \
            -background none -gravity center -extent 432x432 \
            assets/pdfcraft/approved-foreground.png
          identify assets/pdfcraft/approved-icon.png assets/pdfcraft/approved-foreground.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust (upstream requires 1.95 or newer)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Test PhotoCraft-derived keyboard fix and PDF object read/write code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfcraft-input-tests/src"
          cp templates/android/pdfcraft_modifiers.rs "$RUNNER_TEMP/pdfcraft-input-tests/src/lib.rs"
          cat > "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml" <<'EOF'
          [package]
          name = "pdfcraft-input-tests"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          egui = "=0.36.0"
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml"
          cargo test --manifest-path source/pdfcraft/Cargo.toml -p pdfcraft-cos --lib -j 2

      - name: Configure Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare packaging tool for monotonic Android revision codes
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-apk2 --version 1.5.0 --locked
          python3 - <<'PYCODE'
          import os, pathlib, shutil
          root = pathlib.Path.home() / '.cargo/registry/src'
          matches = list(root.glob('*/cargo-apk2-1.5.0/src/apk.rs'))
          assert len(matches) == 1, matches
          source = matches[0].parent.parent
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pdfcraft-apk-packager'
          shutil.copytree(source, dest)
          path = dest / 'src/apk.rs'
          text = path.read_text()
          old = 'let version_code = VersionCode::from_semver(&package_version)?.to_code(1);'
          assert text.count(old) == 1, 'Packager version-code API changed'
          text = text.replace(old, 'let version_code = 16780290;')
          path.write_text(text)
          PYCODE
          cargo install --path "$RUNNER_TEMP/pdfcraft-apk-packager" --locked --force

      - name: Compile PDFCraft candidate with disposable builder key
        shell: bash
        run: |
          set -euo pipefail
          # WARNING: build-common.sh generates a transient builder keystore on this runner.
          # This is never a PDFCraft permanent signing identity.
          test ! -f keys/artcraft-builder.jks
          bash build.sh -pdfcraft -appname=PdfCraft -appicon=assets/pdfcraft/approved-icon.png
          test -f output/pdfcraft-0.12.0.apk
          mv output/pdfcraft-0.12.0.apk output/pdfcraft-0.12.1-android.2.apk

      - name: Verify packaged ABI, identity, version, icon and ephemeral signature
        shell: bash
        run: |
          set -euo pipefail
          APK="output/pdfcraft-0.12.1-android.2.apk"
          SDK_ROOT="${ANDROID_HOME}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT2="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
          "$AAPT2" dump badging "$APK" | tee output/pdfcraft-badging.txt
          grep -q "package: name='com.artcraft.pdfcraft'" output/pdfcraft-badging.txt
          grep -q "versionName='0.12.1-android.2'" output/pdfcraft-badging.txt
          grep -q "versionCode='$EXPECTED_EPHEMERAL_VERSION_CODE'" output/pdfcraft-badging.txt
          unzip -Z1 "$APK" | tee output/pdfcraft-archive.txt
          grep -q '^lib/arm64-v8a/.*\.so$' output/pdfcraft-archive.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' output/pdfcraft-archive.txt; then
            echo "::error::Unexpected non-ARM64 native library"; exit 1
          fi
          grep -q 'ic_launcher.png' output/pdfcraft-archive.txt
          grep -q 'pdfcraft_foreground.png' output/pdfcraft-archive.txt
          grep -q 'ic_launcher.xml' output/pdfcraft-archive.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/pdfcraft-ephemeral-certificate.txt
          sha256sum "$APK" | tee output/SHA256SUMS.txt
          echo "CAUTION: transient-key candidate only; not an update or a public release" >> "$GITHUB_STEP_SUMMARY"
          echo "Hardware / PDF fidelity / SAF round-trip remain untested." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ephemeral candidate for inspection (not public release)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: PDFCraft-0.12.1-android.2-EPHEMERAL-NOT-UPDATE
          path: |
            output/pdfcraft-0.12.1-android.2.apk
            output/pdfcraft-badging.txt
            output/pdfcraft-archive.txt
            output/pdfcraft-ephemeral-certificate.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: build
    if: >-
      github.repository == 'KosmosSG/artcraft-android' && github.event.head_commit.message == 'release(pdfcraft): publish 0.12.1-android.2 Help menu update'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Identify this successful build
        id: source
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: PDFCraft-0.12.1-android.2-EPHEMERAL-NOT-UPDATE
          path: candidate
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign and verify with the permanent PDFCraft identity
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          CERT_SHA256: ${{ secrets.PDFCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          [[ "$CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pdfcraft.p12"
          trap 'rm -f "$RUNNER_TEMP/pdfcraft.p12"' EXIT
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir release
          echo 'CHECK: keystore decoded and signing tools found'
          APK=release/PDFCraft-v0.12.1-android.2-arm64-v8a.apk
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 candidate/pdfcraft-0.12.1-android.2.apk aligned.apk
          echo 'CHECK: zipalign completed'
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/pdfcraft.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" aligned.apk
          echo 'CHECK: apksigner signing completed'
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > release/signature.txt
          echo 'CHECK: apksigner verification completed'
          ACTUAL="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('release/signature.txt').read_text()
          for line in text.splitlines():
              if 'certificate sha-256 digest:' in line.lower():
                  digest = line.split('digest:', 1)[1].strip()
                  if re.fullmatch('[0-9a-fA-F]{64}', digest):
                      print(digest.lower())
                      break
          PY
          )"
          if [ -z "$ACTUAL" ]; then
            echo '::error::Could not locate certificate SHA-256 in apksigner report.'
            echo 'Diagnostic certificate report keys (fingerprints withheld):'
            grep -Ei 'cert|signer|SHA.?256' release/signature.txt | sed -E 's/[0-9a-fA-F]{64}/[digest withheld]/g' | head -25 || true
            exit 1
          fi
          if [ "${ACTUAL,,}" != "${CERT_SHA256,,}" ]; then echo '::error::Permanent certificate fingerprint does not match PDFCraft secret'; exit 1; fi
          echo 'CHECK: permanent certificate fingerprint matched'
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > release/package.txt
          echo 'CHECK: Android package metadata decoded'
          grep -q "package: name='com.artcraft.pdfcraft'" release/package.txt
          grep -q "versionName='0.12.1-android.2'" release/package.txt
          grep -q "versionCode='16780290'" release/package.txt
          echo 'CHECK: package name, version and build code matched'
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          echo 'CHECK: signed APK ZIP alignment verified'
          python3 - <<'PY'
          import zipfile
          before=zipfile.ZipFile('candidate/pdfcraft-0.12.1-android.2.apk')
          after=zipfile.ZipFile('release/PDFCraft-v0.12.1-android.2-arm64-v8a.apk')
          def payload(z):
              return {n:z.read(n) for n in z.namelist() if not n.startswith('META-INF/')}
          assert payload(before)==payload(after), 'Signing changed application payload'
          libs=[n for n in after.namelist() if n.startswith('lib/') and n.endswith('.so')]
          assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
          assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in after.namelist())
          PY

          # Prove that this package upgrades the signed v0.12.0-android.1 release in place.
          mkdir -p previous
          gh release download pdfcraft-v0.12.1-android.1 -R "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          OLD=previous/PDFCraft-v0.12.1-arm64-release.apk
          test -f "$OLD"
          "$BUILD_TOOLS/aapt2" dump badging "$OLD" > previous/package.txt
          grep -q "package: name='com.artcraft.pdfcraft'" previous/package.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OLD" > previous/signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          def code(p):
              m=re.search(r"versionCode='(\d+)'", Path(p).read_text())
              assert m, 'Missing Android versionCode'
              return int(m.group(1))
          def cert(p):
              m=re.search(r'certificate SHA-256 digest:\s*([0-9a-f]{64})', Path(p).read_text(), re.I)
              assert m, 'Missing Android certificate'
              return m.group(1).lower()
          old,new=code('previous/package.txt'),code('release/package.txt')
          assert new>old, f'Cannot update installed app: {old} -> {new}'
          assert cert('previous/signature.txt')==cert('release/signature.txt'), 'Production signer changed'
          print(f'PASS: in-place update {old} -> {new}, same permanent signing certificate')
          PY
          echo 'CHECK: application payload and ABI matched original candidate'
          # Keep the legacy asset name so installed PDFCraft updaters can discover this release.
          cp release/PDFCraft-v0.12.1-android.2-arm64-v8a.apk release/PDFCraft-v0.12.1-arm64-release.apk
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - name: Retain verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-v0.12.1-android.2-permanently-signed
          path: release/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: sign
    if: >-
      github.event.head_commit.message == 'release(pdfcraft): publish 0.12.1-android.2 Help menu update'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDFCraft-v0.12.1-android.2-permanently-signed
          path: release
      - name: Publish a new release without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.sign.outputs.sha }}
        run: |
          set -euo pipefail
          TAG=pdfcraft-v0.12.1-android.2
          # Listing must succeed; network/permission errors never mean a tag is absent.
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/refs/tags" > tags.json
          if jq -e --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref)' tags.json >/dev/null; then
            echo 'Release tag already exists; refusing overwrite'; exit 1
          fi
          cat > notes.md <<'EOF'
          PDFCraft Android 0.12.1-android.2 — Help menu update.

          Removes the bottom Android tools bar completely. Import Fonts, Shared fonts folder, Refresh shared fonts, and Android tools are now under Menu → Help. Settings and action feedback appear in a closable dialog.

          Keeps the approved red PdfC icon, font import, keyboard fixes, and update checker. The owner reports testing the updated layout successfully. Automated checks cover ARM64 build, package identity, signature, payload integrity, and upgrade compatibility. Full PDF editing/save fidelity has not been independently verified.

          Based on official PDFCraft upstream v0.12.0 (39844f06b58bc96bae72d3fb56faaa3b6201c945); retains the existing 0.12.1 Android version series for upgrade continuity. Unofficial Android port, signed with PDFCraft's permanent key. Install over the existing production APK; no uninstall required. The updater opens the GitHub release page for manual APK download and installation.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --title 'PDFCraft v0.12.1-android.2 — Help menu update' --notes-file notes.md --latest release/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets
