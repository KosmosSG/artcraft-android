name: PDFCraft v0.22.0 ARM64 candidate (ephemeral only)
# Keep the parent commit available for the protected-baseline ancestry check.

on:
  push:
    branches:
      - pdfcraft-v0.22.0-android-integration
    paths:
      - .github/workflows/pdfcraft-candidate.yml
      - docs/pdfcraft-v0.22.0-android-candidate.md
      - lib/build-common.sh
      - tools/pdfcraft_stable_audit.py
      - tools/test_pdfcraft_adapter.py
      - tools/pdfcraft/**
      - templates/android/pdfcraft_*
      - assets/pdfcraft/approved-icon.webp
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - pdfcraft-v0.21.1-android.10-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-v0220-ephemeral-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.repository == 'KosmosSG/artcraft-android' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/pdfcraft-v0.22.0-android-integration') ||
       (github.event_name == 'pull_request' && github.head_ref == 'pdfcraft-v0.22.0-android-integration') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pdfcraft-v0.22.0-android-integration'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PDFCRAFT_BASELINE_SHA: 6e58b1674633b4f5745c308b6c34c0f7ff42e02b
      PDFCRAFT_ANDROID_VERSION_NAME: 0.22.0-android.1
      PDFCRAFT_ANDROID_TEST_PACKAGE: com.artcraft.pdfcraft.v0220test1
      PDFCRAFT_REF: v0.22.0
      PDFCRAFT_SHA: ac140f809d554981a5276d748e6193fcf4d4bdfa
      EXPECTED_EPHEMERAL_VERSION_CODE: '16782848'

    steps:
      - name: Checkout the protected-baseline candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prove the candidate descends from the protected Android.10 baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PDFCRAFT_BASELINE_SHA" HEAD
          git diff --name-only "$PDFCRAFT_BASELINE_SHA" HEAD | sort > "$RUNNER_TEMP/changed-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          .github/workflows/pdfcraft-candidate.yml
          docs/pdfcraft-v0.22.0-android-candidate.md
          lib/build-common.sh
          tools/pdfcraft/android_on_exit_compat.py
          tools/pdfcraft/android_tools_menu_patch.py
          tools/pdfcraft/winit_v015_compat.py
          tools/pdfcraft_stable_audit.py
          tools/test_pdfcraft_adapter.py
          EOF
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/changed-files.txt"
          test -f assets/pdfcraft/approved-icon.webp
          test -f templates/android/pdfcraft_stylus_wheel.rs
          test -f templates/android/pdfcraft_mobile.rs
          test -f templates/android/pdfcraft_mobile_java.txt
          echo "Protected Android.10 source is unchanged outside the eight reviewed candidate files." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Pillow for Pc icon and stylus-wheel generation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pdfcraft-tools"
          "$RUNNER_TEMP/pdfcraft-tools/bin/python" -m pip install --disable-pip-version-check --no-input Pillow
          echo "$RUNNER_TEMP/pdfcraft-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pdfcraft-tools/bin/python" -c "from PIL import Image; im=Image.open('assets/pdfcraft/approved-icon.webp'); im.verify(); print('Approved Pc icon:', im.format, im.size)"

      - name: Verify the exact official upstream tag and source commit
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="https://github.com/storytold/pdfcraft.git"
          ACTUAL="$(git ls-remote --tags "$REMOTE" "refs/tags/$PDFCRAFT_REF" | awk 'NR == 1 {print $1}')"
          test "$ACTUAL" = "$PDFCRAFT_SHA" || { echo "::error::Official PDFCraft tag does not resolve to the pinned commit"; exit 1; }
          git clone --depth 1 --branch "$PDFCRAFT_REF" "$REMOTE" source/pdfcraft
          test "$(git -C source/pdfcraft rev-parse HEAD)" = "$PDFCRAFT_SHA"
          test "$(git -C source/pdfcraft remote get-url origin)" = "$REMOTE"
          echo "Official PDFCraft $PDFCRAFT_REF resolves to $PDFCRAFT_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust for ARM64 Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Run the protected Android adapter and feature-regression suite
        run: python3 tools/test_pdfcraft_adapter.py source/pdfcraft

      - name: Test keyboard modifiers against upstream egui 0.37
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pdfcraft-input-tests/src"
          cp templates/android/pdfcraft_modifiers.rs "$RUNNER_TEMP/pdfcraft-input-tests/src/lib.rs"
          cat > "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml" <<'EOF'
          [package]
          name = "pdfcraft-input-tests"
          version = "0.1.0"
          edition = "2024"
          [dependencies]
          egui = "0.37"
          EOF
          cargo test --manifest-path "$RUNNER_TEMP/pdfcraft-input-tests/Cargo.toml"

      - name: Test upstream PDF object and content primitives
        run: cargo test --manifest-path source/pdfcraft/Cargo.toml -p pdfcraft-cos --lib -j 2

      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "platforms;android-35"
          test -d "$SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build a side-by-side ARM64 APK with a fresh disposable key
        shell: bash
        run: |
          set -euo pipefail
          test ! -e keys/artcraft-builder.jks
          test ! -e keys/.keystore-password
          test "$PDFCRAFT_ANDROID_TEST_PACKAGE" != "com.artcraft.pdfcraft"
          bash build.sh -pdfcraft -appname=PDFCraft "-packagename=$PDFCRAFT_ANDROID_TEST_PACKAGE" -appicon=assets/pdfcraft/approved-icon.webp
          test -f output/pdfcraft-0.22.0.apk

      - name: Verify APK package, version, ABI, Pc icon and disposable signature
        shell: bash
        run: |
          set -euo pipefail
          APK="output/pdfcraft-0.22.0.apk"
          SDK_ROOT="$ANDROID_HOME"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          AAPT2="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner"
          "$AAPT2" dump badging "$APK" | tee output/pdfcraft-badging.txt
          grep -q "package: name='$PDFCRAFT_ANDROID_TEST_PACKAGE'" output/pdfcraft-badging.txt
          grep -q "versionName='$PDFCRAFT_ANDROID_VERSION_NAME'" output/pdfcraft-badging.txt
          grep -q "versionCode='$EXPECTED_EPHEMERAL_VERSION_CODE'" output/pdfcraft-badging.txt
          if grep -q "package: name='com.artcraft.pdfcraft'" output/pdfcraft-badging.txt; then
            echo "::error::Candidate unexpectedly uses the production package ID"; exit 1
          fi
          unzip -Z1 "$APK" | tee output/pdfcraft-archive.txt
          grep -q '^lib/arm64-v8a/.*\.so$' output/pdfcraft-archive.txt
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' output/pdfcraft-archive.txt; then
            echo "::error::Unexpected non-ARM64 native library"; exit 1
          fi
          grep -Eq '^res/mipmap-[^/]+/ic_launcher\.png$' output/pdfcraft-archive.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee output/pdfcraft-ephemeral-certificate.txt
          keytool -list -v -keystore keys/artcraft-builder.jks -storepass "$(cat keys/.keystore-password)" > output/pdfcraft-disposable-keystore.txt
          sha256sum "$APK" | tee output/SHA256SUMS.txt
          echo "Candidate package: $PDFCRAFT_ANDROID_TEST_PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Version name: $PDFCRAFT_ANDROID_VERSION_NAME; version code: $EXPECTED_EPHEMERAL_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK uses the approved Pc raster icon and a fresh runner-only signing key." >> "$GITHUB_STEP_SUMMARY"
          echo "Known upstream defect: layered-PDF Layers tab regression, issue #8126; this candidate does not claim to fix it." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not install over production PDFCraft or treat this artifact as an update." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ephemeral candidate for inspection (not a public release)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: PDFCraft-0.22.0-android.1-EPHEMERAL-NOT-UPDATE
          path: |
            output/pdfcraft-0.22.0.apk
            output/pdfcraft-badging.txt
            output/pdfcraft-archive.txt
            output/pdfcraft-ephemeral-certificate.txt
            output/pdfcraft-disposable-keystore.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
