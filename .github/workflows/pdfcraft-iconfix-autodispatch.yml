name: PDFCraft icon-fix release gate (one successful pinned candidate)
on:
  workflow_run:
    workflows:
      - PDFCraft ARM64 ephemeral candidate (not a release)
    types:
      - completed
    branches:
      - fix/pdfcraft-icon-android2
permissions:
  contents: read
  actions: write
jobs:
  dispatch-once:
    if: >-
      github.repository == 'KosmosSG/artcraft-android' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == '259814a755be91a225d80e37d823d6c70ed4f42b' &&
      github.event.workflow_run.head_branch == 'fix/pdfcraft-icon-android2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify expected release is absent and exact source is approved
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          EXPECTED_SHA=259814a755be91a225d80e37d823d6c70ed4f42b
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$EXPECTED_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "fix/pdfcraft-icon-android2" and .path == ".github/workflows/pdfcraft-candidate.yml"' run.json
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" > artifacts.json
          jq -e 'any(.artifacts[]; .name == "PDFCraft-0.12.1-android.1-EPHEMERAL-NOT-UPDATE" and .expired == false)' artifacts.json
          gh release view pdfcraft-v0.12.0-android.1 -R "$REPO" --json tagName > /dev/null
          gh api --paginate "repos/$REPO/git/refs/tags" > tags.json
          if jq -e '.[] | select(.ref == "refs/tags/pdfcraft-v0.12.1-android.1")' tags.json >/dev/null; then
            echo 'Already released; not dispatching a duplicate.'
            exit 0
          fi
          gh workflow run pdfcraft-iconfix-release.yml -R "$REPO" --ref main \
            --field candidate_run="$RUN_ID" \
            --field candidate_sha="$EXPECTED_SHA" \
            --field publish=true
          echo "Triggered verified permanent-signing and in-place-upgrade release gate."
