name: PDFCraft icon correction permanent signing and release (manual)
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful PDFCraft icon-fix candidate run ID
        required: true
      candidate_sha:
        description: Exact reviewed candidate commit SHA (40 hex characters)
        required: true
      publish:
        description: Publish the verified APK to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pdfcraft-production-release
  cancel-in-progress: false
jobs:
  sign:
    if: github.repository == 'KosmosSG/artcraft-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate successful candidate source and download APK
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg sha "$EXPECTED_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "fix/pdfcraft-icon-android2" and .path == ".github/workflows/pdfcraft-candidate.yml"' run.json
          test "$EXPECTED_SHA" = "259814a755be91a225d80e37d823d6c70ed4f42b" || { echo '::error::Source is not the audited icon-fix commit'; exit 1; }
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n PDFCraft-0.12.1-android.1-EPHEMERAL-NOT-UPDATE -D candidate
          test -f candidate/pdfcraft-0.12.1-android.1.apk
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign and verify with the permanent PDFCraft identity
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.PDFCRAFT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          CERT_SHA256: ${{ secrets.PDFCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          [[ "$CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pdfcraft.p12"
          trap 'rm -f "$RUNNER_TEMP/pdfcraft.p12"' EXIT
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner"
          mkdir release
          echo 'CHECK: keystore decoded and signing tools found'
          APK=release/PDFCraft-v0.12.1-arm64-release.apk
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 candidate/pdfcraft-0.12.1-android.1.apk aligned.apk
          echo 'CHECK: zipalign completed'
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/pdfcraft.p12" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" aligned.apk
          echo 'CHECK: apksigner signing completed'
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > release/signature.txt
          echo 'CHECK: apksigner verification completed'
          ACTUAL="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('release/signature.txt').read_text()
          for line in text.splitlines():
              if 'certificate sha-256 digest:' in line.lower():
                  digest = line.split('digest:', 1)[1].strip()
                  if re.fullmatch('[0-9a-fA-F]{64}', digest):
                      print(digest.lower())
                      break
          PY
          )"
          if [ -z "$ACTUAL" ]; then
            echo '::error::Could not locate certificate SHA-256 in apksigner report.'
            echo 'Diagnostic certificate report keys (fingerprints withheld):'
            grep -Ei 'cert|signer|SHA.?256' release/signature.txt | sed -E 's/[0-9a-fA-F]{64}/[digest withheld]/g' | head -25 || true
            exit 1
          fi
          if [ "${ACTUAL,,}" != "${CERT_SHA256,,}" ]; then echo '::error::Permanent certificate fingerprint does not match PDFCraft secret'; exit 1; fi
          echo 'CHECK: permanent certificate fingerprint matched'
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > release/package.txt
          echo 'CHECK: Android package metadata decoded'
          grep -q "package: name='com.artcraft.pdfcraft'" release/package.txt
          grep -q "versionName='0.12.1-android.1'" release/package.txt
          grep -q "versionCode='16780289'" release/package.txt
          echo 'CHECK: package name, version and build code matched'
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          echo 'CHECK: signed APK ZIP alignment verified'
          python3 - <<'PY'
          import zipfile
          before=zipfile.ZipFile('candidate/pdfcraft-0.12.1-android.1.apk')
          after=zipfile.ZipFile('release/PDFCraft-v0.12.1-arm64-release.apk')
          def payload(z):
              return {n:z.read(n) for n in z.namelist() if not n.startswith('META-INF/')}
          assert payload(before)==payload(after), 'Signing changed application payload'
          libs=[n for n in after.namelist() if n.startswith('lib/') and n.endswith('.so')]
          assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
          assert not any(n.lower().endswith(('.jks','.p12','.keystore')) for n in after.namelist())
          PY

          # Prove that this package upgrades the signed v0.12.0-android.1 release in place.
          mkdir -p previous
          gh release download pdfcraft-v0.12.0-android.1 -R "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous
          OLD=previous/PDFCraft-v0.12.0-arm64-release.apk
          test -f "$OLD"
          "$BUILD_TOOLS/aapt2" dump badging "$OLD" > previous/package.txt
          grep -q "package: name='com.artcraft.pdfcraft'" previous/package.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OLD" > previous/signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          def code(p):
              m=re.search(r"versionCode='(\\d+)'", Path(p).read_text())
              assert m, 'Missing Android versionCode'
              return int(m.group(1))
          def cert(p):
              m=re.search(r'certificate SHA-256 digest:\\s*([0-9a-f]{64})', Path(p).read_text(), re.I)
              assert m, 'Missing Android certificate'
              return m.group(1).lower()
          old,new=code('previous/package.txt'),code('release/package.txt')
          assert new>old, f'Cannot update installed app: {old} -> {new}'
          assert cert('previous/signature.txt')==cert('release/signature.txt'), 'Production signer changed'
          print(f'PASS: in-place update {old} -> {new}, same permanent signing certificate')
          PY
          echo 'CHECK: application payload and ABI matched original candidate'
          (cd release && sha256sum PDFCraft-v0.12.1-arm64-release.apk > SHA256SUMS.txt)
      - name: Retain verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraft-v0.12.1-iconfix-permanently-signed
          path: release/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: sign
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PDFCraft-v0.12.1-iconfix-permanently-signed
          path: release
      - name: Publish a new release without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.sign.outputs.sha }}
        run: |
          set -euo pipefail
          TAG=pdfcraft-v0.12.1-android.1
          # Listing must succeed; network/permission errors never mean a tag is absent.
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/refs/tags" > tags.json
          if jq -e --arg ref "refs/tags/$TAG" '.[] | select(.ref == $ref)' tags.json >/dev/null; then
            echo 'Release tag already exists; refusing overwrite'; exit 1
          fi
          cat > notes.md <<'EOF'
          PDFCraft Android 0.12.1-android.1, based on official PDFCraft upstream v0.12.0 (39844f06b58bc96bae72d3fb56faaa3b6201c945). The Android-only maintenance release retains the existing PDFCraft features.
          
          The owner-supplied glossy red PdfC launcher artwork replaces the black-matte icon. Its outer corners are transparent; the Android adaptive-icon background is matching solid red instead of almost black.

          Includes Android document-picker integration, font import/shared font folder, and GitHub release checking with an opt-in startup setting. The in-app checker opens the GitHub release page. Download the APK there and open it with Android's package installer; direct in-app downloading/installing is not implemented.

          Build checks verify package com.artcraft.pdfcraft, version 0.12.1-android.1 (16780289), ARM64 libraries, permanent PDFCraft certificate, and unchanged application payload after signing.

          The prior v0.12.0-android.1 build was installed and tested by the owner on HONOR MagicPad 4. This icon revision has not yet been tested on the device. Full PDF save fidelity remains unverified. Back up documents before testing. This is not an official storytold distribution.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --title 'PDFCraft Android 0.12.1-android.1 - Red launcher icon fix' --notes-file notes.md --latest release/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url,assets
