name: PDFCraft Android.10 publish EXACT original-signed tested artifact (approval gated)

on:
  push:
    branches:
      - release/pdfcraft-v0211-android10-exact-publish-20261114
    paths:
      - release-approvals/pdfcraft-v0211-android10.json

permissions:
  actions: read
  contents: write

concurrency:
  group: pdfcraft-v0211-android10-publish-exact-artifact
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/pdfcraft-v0211-android10-exact-publish-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout owner approval manifest
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate owner approval, exact source SHA and successful signed test run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,os
          from pathlib import Path
          file=Path('release-approvals/pdfcraft-v0211-android10.json')
          data=json.loads(file.read_text())
          assert data.get('approved_for_publication') is True, 'No owner approval; fail closed'
          assert data.get('version')=='0.21.1-android.10'
          assert data.get('package')=='com.artcraft.pdfcraft'
          assert data.get('signed_test_run_id')==43475526563, 'Wrong owner-tested run'
          assert data.get('source_commit')=='6e58b1674633b4f5745c308b6c34c0f7ff42e02b', 'Wrong tested source commit'
          assert data.get('signed_apk_sha256')=='CALCULATE_FROM_SIGNED_ARTIFACT'
          assert data.get('signed_artifact_name')=='PDFCraft-v0.21.1-android.10-BORDERED-SLOTS-75-85-UPDATER-SIGNED-TEST'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              print(f"TEST_RUN_ID={data['signed_test_run_id']}",file=out)
              print(f"SOURCE_SHA={data['source_commit']}",file=out)
          print('Owner authorized publication of exact signed artifact bytes')
          PY

      - name: Require completed original-certificate Android.10 workflow and fetch exact signed artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This owner-tested build is complete; do not wait or recompile.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID" > checked-run.json
          jq -e --arg sha "$SOURCE_SHA" '
            .conclusion == "success"
            and .head_sha == $sha
            and .head_branch == "fix/pdfcraft-v0211-android10-bordered-wheel-75-85-20261114"
            and .path == ".github/workflows/pdfcraft-v0211-android10-bordered-wheel-updater-test.yml"
          ' checked-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID/artifacts" > checked-artifacts.json
          jq -e '.artifacts | any(
            .name == "PDFCraft-v0.21.1-android.10-BORDERED-SLOTS-75-85-UPDATER-SIGNED-TEST" and .expired == false
          )' checked-artifacts.json
          mkdir -p signed
          gh run download "$TEST_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n PDFCraft-v0.21.1-android.10-BORDERED-SLOTS-75-85-UPDATER-SIGNED-TEST -D signed
          test -s signed/PDFCraft-v0.21.1-arm64-release.apk
          test -s signed/SOURCE-COMMIT.txt
          test -s signed/SHA256SUMS.txt
          test -s signed/signature.txt
          test -s signed/package.txt
          test "$(tr -d '\r\n' < signed/SOURCE-COMMIT.txt)" = "$SOURCE_SHA"
          EXPECTED_SHA256="$(awk '$2 == "PDFCraft-v0.21.1-arm64-release.apk" { print $1 }' signed/SHA256SUMS.txt)"
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Missing or malformed exact signed artifact SHA256SUMS"; exit 1; }
          echo "$EXPECTED_SHA256  signed/PDFCraft-v0.21.1-arm64-release.apk" | sha256sum -c -
          echo "EXPECTED_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"
          echo "PASS: identical signed APK bytes from verified successful run" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production package, original signer, Android API and ABI before publication
        shell: bash
        env:
          ORIGINAL_CERT_SHA256: ${{ secrets.PDFCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_CERT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Original signer fingerprint secret missing"; exit 1; }
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/apksigner" && test -x "$BUILD_TOOLS/aapt2" && test -x "$BUILD_TOOLS/zipalign"
          APK=signed/PDFCraft-v0.21.1-arm64-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > verified-signature.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > verified-package.txt
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          ORIGINAL_CERT_SHA256="$ORIGINAL_CERT_SHA256" python3 - <<'PY'
          import os,re,zipfile
          from pathlib import Path
          signature=Path("verified-signature.txt").read_text()
          data=Path("verified-package.txt").read_text()
          fingerprint=re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',signature,re.I)
          assert fingerprint and fingerprint[0].lower()==os.environ['ORIGINAL_CERT_SHA256'].lower(),'Original signing certificate mismatch'
          assert "package: name='com.artcraft.pdfcraft'" in data
          assert "versionName='0.21.1-android.10'" in data
          assert "versionCode='16782602'" in data
          assert "application-debuggable" not in data
          permissions=set(re.findall(r"uses-permission: name='([^']+)'",data))
          expected={
            'android.permission.READ_EXTERNAL_STORAGE',
            'android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.MANAGE_EXTERNAL_STORAGE',
            'android.permission.INTERNET',
          }
          assert permissions==expected, f'Unexpected permissions: {permissions ^ expected}'
          with zipfile.ZipFile('signed/PDFCraft-v0.21.1-arm64-release.apk') as zipf:
            names=zipf.namelist()
            assert zipf.testzip() is None
            assert len(names)==len(set(names))
            assert all(not n.startswith('/') and '..' not in n.split('/') for n in names)
            libs=[n for n in names if n.startswith('lib/') and n.endswith('.so')]
            assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs), 'ARM64-only required'
          print('PASS: package, version, permanent signer, permission inventory, ZIP and ABI')
          PY
          printf '%s  %s\n' "$EXPECTED_SHA256" "PDFCraft-v0.21.1-arm64-release.apk" > signed/SHA256SUMS.txt

      - name: Publish existing signed APK without rebuilding or re-signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=pdfcraft-v0.21.1-android.10
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists; no overwrite allowed"; exit 1
          fi
          cat > signed/RELEASE_NOTES.md <<EOF
          PDFCraft v0.21.1-android.10 — original permanently signed ARM64 Android release, approved after device testing.

          - Based on official Storytold PDFCraft v0.21.1, preserving existing Android features and approved PDFCraft Pc launcher artwork.
          - PhotoCraft-style stylus wheel with subtle grey outer border around the eight assignments and individually framed rounded slot rows.
          - First-use and Restore Default settings: **75% wheel size / 85% opacity**. Previously saved wheel layout and appearance choices are preserved.
          - Branded red wheel outline and hub, two-tone grey sectors, soft shadow, actual-size on-canvas preview, stylus hover and bottom-center feedback retained.
          - In-app updater: manual release checks, in-app verified APK download using GitHub SHA-256, and Android Save APK export. Installation remains a separate manual Android action; no automatic installer.
          - Preserves PDF tools, OCR, shared fonts, file picker and native touch/trackpad/keyboard/stylus input.
          - Package com.artcraft.pdfcraft; versionCode 16782602; ARM64 only; original PDFCraft signing certificate verified against prior published identity.
          - APK SHA-256: $EXPECTED_SHA256
          - Signed test source commit: $SOURCE_SHA. Exact signed APK from successful GitHub Actions run $TEST_RUN_ID; no rebuild or re-sign at publication.
          - Owner approved after device testing. CI and code signing do not establish Play Protect clearance; keep device protections enabled.
          - Independently maintained Android port; not an official Storytold distribution.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "PDFCraft v0.21.1-android.10 — ARM64" --notes-file signed/RELEASE_NOTES.md --latest \
            signed/PDFCraft-v0.21.1-arm64-release.apk signed/SHA256SUMS.txt \
            signed/signature.txt signed/package.txt signed/ocr-models.txt signed/SOURCE-COMMIT.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > checked-release.json
          EXPECTED_SHA256="$EXPECTED_SHA256" python3 - <<'PY'
          import json,os
          data=json.load(open('checked-release.json'))
          assert data['tag_name']=='pdfcraft-v0.21.1-android.10'
          names={a['name']:a for a in data['assets']}
          apk=names['PDFCraft-v0.21.1-arm64-release.apk']
          assert apk.get('digest')=='sha256:'+os.environ['EXPECTED_SHA256'], f"Release APK digest not verified: {apk.get('digest')}"
          print('PASS: published GitHub asset SHA-256 matches owner-approved permanently signed bytes')
          PY
          echo "Published stable $TAG; exact signed hash $EXPECTED_SHA256; no rebuild/re-sign" >> "$GITHUB_STEP_SUMMARY"
