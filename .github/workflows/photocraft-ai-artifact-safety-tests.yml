name: PhotoCraft AI PR93 public artifact leak regression (NO APK)
on:
  push:
    branches: [feature/photocraft-android-ai-tools-20261029]
    paths:
      - '.github/workflows/photocraft-ai-artifact-safety-tests.yml'
      - '.github/workflows/photocraft-ai-production-dryrun.yml'
      - '.github/workflows/photocraft-ai-unsigned-linux-lab.yml'
      - 'tools/photocraft_ai_cpu/test_public_artifact_safety.py'
      - 'tools/photocraft_ai_unsigned_artifact_verify.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/feature/photocraft-android-ai-tools-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static guard — never upload disposable APK in failure diagnostics
        run: |
          python3 tools/photocraft_ai_cpu/test_public_artifact_safety.py -v
          python3 tools/photocraft_ai_unsigned_artifact_verify.py --self-test
      - name: No model, no APK, no signing
        run: echo 'PASS - static CI artifact allowlist only'
