name: PhotoCraft AI decoded PNG tests (no APK)
on:
  push:
    branches: [feature/photocraft-android-ai-tools-20261029]
    paths:
      - 'tools/photocraft_ai_cpu/validate_output_png.py'
      - '.github/workflows/photocraft-ai-decoded-png-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode-validation:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/feature/photocraft-android-ai-tools-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for local synthetic PNG decoding only
        run: python -m pip install 'Pillow==11.3.0'
      - name: Validate complete PNG decode and rejection tests
        run: |
          python -m py_compile tools/photocraft_ai_cpu/validate_output_png.py
          python tools/photocraft_ai_cpu/validate_output_png.py --self-test
      - name: Ensure no AI processing enabled
        run: |
          grep -q 'ui.add_enabled(false, egui::Button::new(action.label()))' adapters/photocraft/src/ai_menu.rs
          echo 'No APK, model download, signing, or publishing in this workflow'
