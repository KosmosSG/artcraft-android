name: PhotoCraft AI loopback U2NetP transport tests
on:
  push:
    branches:
      - feature/photocraft-android-ai-tools-20261029
    paths:
      - 'tools/photocraft_ai_cpu/loopback_u2netp_server.py'
      - 'tools/photocraft_ai_cpu/test_loopback_u2netp_http.py'
      - 'tools/photocraft_ai_cpu/validate_output_png.py'
      - '.github/workflows/photocraft-ai-loopback-transport-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow only (no model, no rembg)
        run: python -m pip install 'Pillow==12.3.0'
      - name: Run offline PNG validation self-test
        run: python tools/photocraft_ai_cpu/loopback_u2netp_server.py --self-test
      - name: Syntax check
        run: python -m py_compile tools/photocraft_ai_cpu/loopback_u2netp_server.py tools/photocraft_ai_cpu/test_loopback_u2netp_http.py
      - name: Live localhost HTTP tests (synthetic images, fake inference)
        run: python tools/photocraft_ai_cpu/test_loopback_u2netp_http.py -v
