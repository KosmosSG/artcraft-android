name: PhotoCraft AI U2NetP sidecar integration guards
on:
  push:
    branches:
      - feature/photocraft-android-ai-tools-20261029
    paths:
      - 'tools/photocraft_ai_cpu/local_background_bridge.py'
      - 'tools/photocraft_ai_cpu/test_local_background_bridge.py'
      - '.github/workflows/photocraft-ai-sidecar-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidecar-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline image test dependency
        run: python -m pip install 'Pillow==12.3.0'
      - name: Compile bridge and tests
        run: python -m py_compile tools/photocraft_ai_cpu/local_background_bridge.py tools/photocraft_ai_cpu/test_local_background_bridge.py
      - name: Test real sidecar validation with mocked inference
        run: python tools/photocraft_ai_cpu/test_local_background_bridge.py -v
