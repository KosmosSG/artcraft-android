name: PhotoCraft AI PR93 unsigned APK ZIP/signability proof (NO RELEASE)
on:
  push:
    branches: [feature/photocraft-android-ai-tools-20261029]
    paths: ['.github/workflows/photocraft-ai-unsigned-signability-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: photocraft-ai-pr93-unsigned-signability
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/feature/photocraft-android-ai-tools-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact already-built unsigned input (NO ARM rebuild)
        uses: actions/download-artifact@v5
        with:
          name: PhotoCraft-AI-v0.14.0-android.2-ARM64-UNSIGNED-LINUX-LAB-PR93
          run-id: 41086392166
          github-token: ${{ github.token }}
          path: input
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android SDK build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" --install 'build-tools;35.0.0' 'platforms;android-35'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Verify input provenance, normalize ZIP headers and recheck contents
        shell: bash
        run: |
          set -euo pipefail
          (cd input && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,zipfile,shutil
          from pathlib import Path
          src=Path('input/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk')
          info=json.loads(Path('input/UNSIGNED-VERIFICATION.json').read_text())
          assert info['kind']=='UNSIGNED_SIGNING_INPUT_ONLY'
          assert info['pr93_ci_commit']=='2303e0722d799751c1fc08dc7a808c10f0cf9c2c'
          assert info['apk_sha256']==hashlib.sha256(src.read_bytes()).hexdigest()
          assert (info['package'],info['version_code'],info['version_name'])==('com.artcraft.photocraft',16790005,'0.14.0-android.2')
          assert info['original_signer_certificate_required']=='45933a886c258e5be9f98ba68dc37e5ee2dd543a6efde008e407879bc9dc59ef'
          with zipfile.ZipFile(src) as inp,zipfile.ZipFile('normalized.zip','w') as out:
              assert inp.testzip() is None
              names=inp.namelist()
              assert len(set(names))==len(names)
              for z in inp.infolist():
                  assert not z.flag_bits & 1 and z.file_size < (1<<31)
                  z.extra=b'';z.comment=b''
                  if z.is_dir():out.writestr(z,b'')
                  else:
                      with inp.open(z) as r,out.open(z,'w') as dest:
                          shutil.copyfileobj(r,dest,1024*1024)
          with zipfile.ZipFile(src) as a,zipfile.ZipFile('normalized.zip') as b:
              assert b.testzip() is None and a.namelist()==b.namelist()
              for n in a.namelist():
                  assert a.getinfo(n).CRC==b.getinfo(n).CRC
                  assert a.getinfo(n).file_size==b.getinfo(n).file_size
                  assert not n.lower().endswith(('.p12','.jks','.onnx','.pth','.safetensors'))
          print('PASS: exact input provenance and content-preserving ZIP normalization')
          PY
          mkdir -p verified
          zipalign -f -p 4 normalized.zip verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk
          zipalign -c -p 4 verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk
          if apksigner verify verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk >/dev/null 2>&1; then
            echo 'STOP: local-signing input unexpectedly signed' >&2; exit 1
          fi
          aapt dump badging verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk > verified/badging.txt 2> verified/warnings.txt
          if grep -qi 'header mismatch' verified/warnings.txt; then
            echo 'STOP: ZIP local/central header mismatch remains' >&2; exit 1
          fi
          grep -q "^package: name='com.artcraft.photocraft' versionCode='16790005' versionName='0.14.0-android.2'" verified/badging.txt
          grep -q "^application-label:'PhotoCraft'$" verified/badging.txt
          grep -q "launchable-activity: name='com.artcraft.photocraft.PhotoCraftActivity'" verified/badging.txt
          echo 'PASS: aligned unsigned ZIP has no header mismatch; identity preserved'
      - name: Test signing with NEW DISPOSABLE KEY, verify then delete (NO APK UPLOAD)
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/ci-proof.p12" "$RUNNER_TEMP/ci-proof-signed.apk"' EXIT
          export CI_PROOF_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -alias proof -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Disposable Local Signability Proof' -keystore "$RUNNER_TEMP/ci-proof.p12" \
            -storetype PKCS12 -storepass:env CI_PROOF_PASS -keypass:env CI_PROOF_PASS -noprompt
          apksigner sign --ks "$RUNNER_TEMP/ci-proof.p12" --ks-type PKCS12 --ks-key-alias proof \
            --ks-pass env:CI_PROOF_PASS --key-pass env:CI_PROOF_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$RUNNER_TEMP/ci-proof-signed.apk" verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk
          apksigner verify --verbose "$RUNNER_TEMP/ci-proof-signed.apk"
          apksigner verify --print-certs "$RUNNER_TEMP/ci-proof-signed.apk" > "$RUNNER_TEMP/proof-cert.txt"
          aapt dump badging "$RUNNER_TEMP/ci-proof-signed.apk" > "$RUNNER_TEMP/proof-badging.txt" 2> "$RUNNER_TEMP/proof-warnings.txt"
          ! grep -qi 'header mismatch' "$RUNNER_TEMP/proof-warnings.txt"
          python3 - "$RUNNER_TEMP/proof-cert.txt" "$RUNNER_TEMP/proof-badging.txt" <<'PY'
          import pathlib,re,sys
          cert,badge=[pathlib.Path(x).read_text() for x in sys.argv[1:]]
          sha=re.findall(r'certificate SHA-256 digest: ([a-fA-F0-9]{64})',cert)
          assert len(sha)==1 and sha[0].lower()!='45933a886c258e5be9f98ba68dc37e5ee2dd543a6efde008e407879bc9dc59ef'
          assert "package: name='com.artcraft.photocraft' versionCode='16790005' versionName='0.14.0-android.2'" in badge
          print('PASS: unsigned input can be signed and verified with a throwaway key; NOT an upgrade')
          PY
          rm -f "$RUNNER_TEMP/ci-proof.p12" "$RUNNER_TEMP/ci-proof-signed.apk"
          test ! -e "$RUNNER_TEMP/ci-proof-signed.apk"
      - name: Upload ONLY clean unsigned input and verification JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          apk=Path('verified/PhotoCraft-v0.14.0-android.2-arm64-v8a-UNSIGNED.apk')
          sha=hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent/'SHA256SUMS.txt').write_text(f'{sha}  {apk.name}\n')
          report=dict(kind='CLEAN_UNSIGNED_SIGNING_INPUT',apk_sha256=sha,source_run=41086392166,
            source_artifact_id=12992188787,source_pr93_sha='2303e0722d799751c1fc08dc7a808c10f0cf9c2c',
            package='com.artcraft.photocraft',version_name='0.14.0-android.2',version_code=16790005,
            aligned=True,header_mismatch_absent=True,unsigned=True,disposable_signability_test_passed=True,
            disposable_signed_apk_deleted=True,production_signed=False,device_tested=False,public_release=False,
            original_signer_required='45933a886c258e5be9f98ba68dc37e5ee2dd543a6efde008e407879bc9dc59ef')
          (apk.parent/'SIGNABILITY-REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          (apk.parent/'badging.txt').unlink()
          (apk.parent/'warnings.txt').unlink()
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoCraft-AI-v0.14.0-android.2-CLEAN-UNSIGNED-LINUX-LAB-PR93
          path: verified/
          if-no-files-found: error
          retention-days: 7
      - name: Always delete ephemeral test keys and signed proof
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ci-proof.p12" "$RUNNER_TEMP/ci-proof-signed.apk" normalized.zip
