name: PhotoCraft Companion Android package audit (NO APK)

on:
  push:
    branches:
      - feature/photocraft-companion-android-catalog-20261101
    paths:
      - tools/photocraft_companion_pcpl_audit.py
      - tools/test_photocraft_companion_pcpl_audit.py
      - .github/workflows/photocraft-companion-android-pcpl-audit.yml
  pull_request:
    paths:
      - tools/photocraft_companion_pcpl_audit.py
      - tools/test_photocraft_companion_pcpl_audit.py
      - .github/workflows/photocraft-companion-android-pcpl-audit.yml

permissions:
  contents: read

concurrency:
  group: photocraft-companion-android-package-audit
  cancel-in-progress: false

jobs:
  package-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source; never access signing keys
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python syntax validation (no dependencies or network)
        run: |
          python3 -m py_compile tools/photocraft_companion_pcpl_audit.py
          python3 -m py_compile tools/test_photocraft_companion_pcpl_audit.py

      - name: Offline read-only archive regression suite
        run: |
          python3 -m unittest discover -s tools \
            -p test_photocraft_companion_pcpl_audit.py -v

      - name: Confirm no Android build or production signing
        run: |
          test -f tools/photocraft_companion_pcpl_audit.py
          test ! -e output/photocraft-companion.apk
          echo 'PASS: read-only .pcpl package audit; no APK built, signed, uploaded or published'
