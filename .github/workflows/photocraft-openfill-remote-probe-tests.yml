name: PhotoCraft OpenFill Remote GPU Preview — offline parser/unit tests

# Lightweight source tests only. Never builds/signs/publishes an APK.
on:
  push:
    branches:
      - feature/photocraft-v0231-openfill-android-20261116
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photocraft-openfill-remote-probe
  cancel-in-progress: true

jobs:
  probe-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out only the test branch
        uses: actions/checkout@v4
      - name: Install Rust stable for isolated native test
        uses: dtolnay/rust-toolchain@stable
      - name: Compile and run isolated pairing/security tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test adapters/photocraft/src/openfill_remote.rs -o "$RUNNER_TEMP/openfill-probe-tests"
          "$RUNNER_TEMP/openfill-probe-tests" --nocapture
      - name: Run Linux Lab local ComfyUI synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/photocraft_ai_cpu -p 'test_linux_lab_comfy_probe.py' -v
      - name: Check Python source syntax without installing packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/photocraft_ai_cpu/linux_lab_comfy_probe.py tools/photocraft_ai_cpu/test_linux_lab_comfy_probe.py tools/photocraft_ai_cpu/openfill_local_server.py tools/photocraft_ai_cpu/test_openfill_local_server.py
      - name: Verify four Pc AI Tools commands and hidden Diagnostics (source only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          py_compile.compile("tools/photocraft_v022_vc_style_menu.py", doraise=True)
          p = Path("tools/photocraft_v022_vc_style_menu.py").read_text()
          for code, name in ((37, "Fill with Prompt"), (38, "Remove Object"),
                             (39, "Generative Expand"), (40, "Create · Text to Image")):
              assert f'openfill_action(ui, "{name}…", {code});' in p
          assert 'pc_openfill_direct_menu_action' in p
          assert 'ui.ctx().request_repaint();' in p
          assert '37..=40 => {' in p
          assert 'self.ai_menu.open_openfill_operation(pc_action);' in p
          assert """assert output.count('ui.menu_button("Diagnostics", |ui| {') == 0""" in p
          host = Path("adapters/photocraft/src/ai_menu.rs").read_text()
          assert 'fn start_fill_generation(' in host
          assert 'data.get_temp::<u8>(id).unwrap_or(0)' in host
          assert 'self.open_openfill_operation(direct_action);' in host
          assert 'fn poll_fill_generation(' in host
          assert 'fn cancel_fill_generation(' in host
          assert 'self.fill_token.clear();' in host
          print("PASS: all four Pc actions routed, Diagnostics hidden, generated results gated and cancellable")
          PY

      - name: Test full-resolution alpha and LaMa readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "Pillow==12.3.0"
          python3 -m unittest discover -s tools/photocraft_ai_cpu -p 'test_highres_u2netp.py' -v
          python3 -m unittest discover -s tools/photocraft_ai_cpu -p 'test_lama_readiness.py' -v
          python3 -m unittest discover -s tools/photocraft_ai_cpu -p 'test_openfill_local_server.py' -v
          rustc --edition=2021 --test adapters/photocraft/src/ai_openfill_operations.rs -o "$RUNNER_TEMP/openfill-operations-tests"
          "$RUNNER_TEMP/openfill-operations-tests"
          rustc --edition=2021 --test adapters/photocraft/src/ai_masked_fill_snapshot.rs -o "$RUNNER_TEMP/fill-mask-tests"
          "$RUNNER_TEMP/fill-mask-tests"
          rustc --edition=2021 --test adapters/photocraft/src/ai_output_validation.rs -o "$RUNNER_TEMP/alpha-tests"
          "$RUNNER_TEMP/alpha-tests"
          rustc --edition=2021 --test adapters/photocraft/src/ai_u2netp_transport.rs -o "$RUNNER_TEMP/transport-tests"
          "$RUNNER_TEMP/transport-tests"
      - name: Verify no production release or signer was touched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin photocraft-v0.23.1-android.5
          changed="$(git diff --name-only FETCH_HEAD HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | while IFS= read -r f; do
            case "$f" in
              adapters/photocraft/src/openfill_remote.rs|adapters/photocraft/src/lib.rs|adapters/photocraft/src/ai_menu.rs|docs/photocraft-openfill-android-integration-20261116.md|tools/photocraft_ai_cpu/linux_lab_comfy_probe.py|tools/photocraft_ai_cpu/test_linux_lab_comfy_probe.py|adapters/photocraft/src/ai_background_editor.rs|adapters/photocraft/src/ai_u2netp_transport.rs|adapters/photocraft/src/ai_output_validation.rs|adapters/photocraft/src/ai_masked_fill_snapshot.rs|adapters/photocraft/src/ai_openfill_operations.rs|adapters/photocraft/src/ai_openfill_editor.rs|adapters/photocraft/src/ai_openfill_local_transport.rs|tools/photocraft_ai_cpu/openfill_local_server.py|tools/photocraft_ai_cpu/test_openfill_local_server.py|tools/photocraft_v022_vc_style_menu.py|tools/photocraft_ai_cpu/local_background_bridge.py|tools/photocraft_ai_cpu/loopback_u2netp_server.py|tools/photocraft_ai_cpu/validate_output_png.py|tools/photocraft_ai_cpu/test_loopback_u2netp_http.py|tools/photocraft_ai_cpu/highres_u2netp.py|tools/photocraft_ai_cpu/test_highres_u2netp.py|tools/photocraft_ai_cpu/lama_readiness.py|tools/photocraft_ai_cpu/test_lama_readiness.py|.github/workflows/photocraft-openfill-remote-probe-tests.yml|.github/workflows/photocraft-openfill-linuxlab-arm64-test.yml) ;;
              *) echo "Unexpected change outside OpenFill preview: $f" >&2; exit 1 ;;
            esac
          done
