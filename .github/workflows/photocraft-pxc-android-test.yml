name: PhotoCraft PxC Android test

on:
  push:
    branches:
      - feature/photocraft-pxc-android-20261127
    paths:
      - 'adapters/photocraft/**'
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build-debug.sh'
      - 'lib/build-common.sh'
      - '.github/workflows/photocraft-pxc-android-test.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - feature/photocraft-v0231-companion-android-20261117

env:
  PHOTOCRAFT_UPSTREAM_REF: v0.23.1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit 2>/dev/null || true)
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build disposable ARM64 APK
        run: bash build-debug.sh -photocraft

      - name: Upload disposable test APK
        uses: actions/upload-artifact@v5
        with:
          name: PhotoCraft-PxC-Android-test-${{ github.sha }}
          path: output/*.apk
          if-no-files-found: error
