name: PhotoCraft upstream RC2 Android test

on:
  push:
    branches:
      - integration/photocraft-upstream-20261127
  pull_request:
    branches:
      - photocraft-upstream-base-20261127
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARTCRAFT_TARGET_SDK: "35"
      ARTCRAFT_BUILD_TOOLS_VERSION: "35.0.0"
      UPSTREAM_TAG: "v0.24.0-rc.2"
      UPSTREAM_SHA: "9e518a5c55e52028869cc6d91b0555d5e7ddafae"
      TEST_PACKAGE: "com.artcraft.photocraft.test"
    steps:
      - name: Checkout protected integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(git rev-list -n 1 photocraft-v0.23.1-android.5)"
          test "$BASELINE" = "36cace94c2fb589cae68a614eef6d8e98a4230c4"
          echo "Protected baseline: $BASELINE"

      - name: Check out exact Storytold upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source/photocraft
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/storytold/photocraft.git source/photocraft
          ACTUAL="$(git -C source/photocraft rev-parse HEAD)"
          echo "Upstream checkout: $ACTUAL"
          test "$ACTUAL" = "$UPSTREAM_SHA"
          echo "Upstream Cargo workspace version:"
          python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("source/photocraft/Cargo.toml").read_text())
          print(data["workspace"]["package"]["version"])
          PY

      - name: Install upstream-pinned Rust Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Build separate temporary-signed ARM64 test APK
        shell: bash
        run: |
          set -euo pipefail
          # The upstream RC tag is authoritative for the candidate APK version. Some upstream
          # release tags retain the previous workspace package version, so align the workspace
          # package metadata before invoking the builder (the protected baseline is never changed).
          APP_VERSION="${UPSTREAM_TAG#v}"
          python3 - "$APP_VERSION" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("source/photocraft/Cargo.toml")
          text = path.read_text()
          version = sys.argv[1]
          pattern = r'(?ms)(^\[workspace\.package\]\s*.*?^version\s*=\s*)["\'][^"\']+["\']'
          updated, count = re.subn(pattern, lambda m: m.group(1) + '"' + version + '"', text, count=1)
          if count != 1:
              raise SystemExit("Could not safely update [workspace.package].version")
          path.write_text(updated)
          print(f"Candidate workspace package version: {version}")
          PY
          # The custom adapter owns its Android manifest, so the generic builder's
          # -packagename option cannot override it. Change only this disposable CI checkout;
          # keep the Java Activity's original fully-qualified class name.
          python3 - "$TEST_PACKAGE" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("adapters/photocraft/Cargo.toml")
          text = path.read_text()
          package = sys.argv[1]
          text, count = re.subn(r'(?m)^package = "com\\.artcraft\\.photocraft"
          test -s "$APK"
          mkdir -p verified
          cp "$APK" "verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"

      - name: Verify test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"
          AAPT="$ANDROID_HOME/build-tools/$ARTCRAFT_BUILD_TOOLS_VERSION/aapt"
          "$AAPT" dump badging "$APK" | grep -Fq "name='$TEST_PACKAGE'"
          "$AAPT" dump badging "$APK" | grep -Fq "versionName='$APP_VERSION'"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/"
          if unzip -l "$APK" | grep -Eq "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "Unexpected non-ARM64 native library found in test APK." >&2
            exit 1
          fi
          # Prove the APK is signed by the disposable key generated in this job.
          EXPECTED_CERT="$(keytool -exportcert -keystore keys/artcraft-builder.jks -alias artcraftbuilder -storepass "$TEST_KEY_PASSWORD" | sha256sum | awk '{print tolower($1)}')"
          ACTUAL_CERT="$(apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}' | tr -d ':')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          echo "Verified disposable CI signing certificate: $ACTUAL_CERT"
          sha256sum "$APK" | tee verified/SHA256SUMS.txt

      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED
          path: verified/*
          if-no-files-found: error
, f'package = "{package}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not safely set the PhotoCraft test package")
          text, count = re.subn(r'(?m)^name = "\\.PhotoCraftActivity"
          test -s "$APK"
          mkdir -p verified
          cp "$APK" "verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"

      - name: Verify test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"
          AAPT="$ANDROID_HOME/build-tools/$ARTCRAFT_BUILD_TOOLS_VERSION/aapt"
          "$AAPT" dump badging "$APK" | grep -Fq "name='$TEST_PACKAGE'"
          "$AAPT" dump badging "$APK" | grep -Fq "versionName='$APP_VERSION'"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/"
          if unzip -l "$APK" | grep -Eq "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "Unexpected non-ARM64 native library found in test APK." >&2
            exit 1
          fi
          sha256sum "$APK" | tee verified/SHA256SUMS.txt

      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED
          path: verified/*
          if-no-files-found: error
, 'name = "com.artcraft.photocraft.PhotoCraftActivity"', text, count=1)
          if count != 1:
              raise SystemExit("Could not safely make the PhotoCraft Activity class fully qualified")
          path.write_text(text)
          print(f"Isolated test application ID: {package}")
          PY

          # The builder normally creates/uses keys/artcraft-builder.jks. Pre-create that
          # path with a fresh random CI-only key so no persistent or production signing key
          # is touched. The runner is ephemeral and the key is never uploaded.
          mkdir -p keys
          chmod 700 keys
          python3 - <<'PY' > keys/.keystore-password
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          chmod 600 keys/.keystore-password
          TEST_KEY_PASSWORD="$(<keys/.keystore-password)"
          keytool -genkeypair -noprompt -keystore keys/artcraft-builder.jks -storetype JKS \
            -storepass "$TEST_KEY_PASSWORD" -keypass "$TEST_KEY_PASSWORD" \
            -alias artcraftbuilder -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=PhotoCraft CI Disposable Test, OU=CI, O=ArtCraft, C=US"
          chmod 600 keys/artcraft-builder.jks

          echo "Upstream release tag: $UPSTREAM_TAG"
          echo "APK versionName from upstream release tag: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          bash build.sh -photocraft
          APK="output/photocraft-$APP_VERSION.apk"
          test -s "$APK"
          mkdir -p verified
          cp "$APK" "verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"

      - name: Verify test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="verified/PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED.apk"
          AAPT="$ANDROID_HOME/build-tools/$ARTCRAFT_BUILD_TOOLS_VERSION/aapt"
          "$AAPT" dump badging "$APK" | grep -Fq "name='$TEST_PACKAGE'"
          "$AAPT" dump badging "$APK" | grep -Fq "versionName='$APP_VERSION'"
          unzip -l "$APK" | grep -Fq "lib/arm64-v8a/"
          if unzip -l "$APK" | grep -Eq "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "Unexpected non-ARM64 native library found in test APK." >&2
            exit 1
          fi
          sha256sum "$APK" | tee verified/SHA256SUMS.txt

      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-v0.24.0-rc.2-android-test-ARM64-TEMP-SIGNED
          path: verified/*
          if-no-files-found: error
