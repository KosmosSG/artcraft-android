name: ArtCraft Suite release safety and naming audit (never publish)
on:
  push:
    branches: [main]
    paths:
      - 'configs/release-gates/**'
      - 'tools/release_gate_audit.py'
      - 'tools/artcraft_release_naming.py'
      - 'tools/test_artcraft_release_naming.py'
      - 'configs/feature-parity.json'
      - 'tools/suite_feature_parity.py'
      - 'tools/test_suite_feature_parity.py'
      - 'docs/ARTCRAFT_ANDROID_FONT_UPDATE_STANDARD.md'
      - 'AGENTS.md'
      - '.github/workflows/suite-release-gates.yml'
  pull_request:
    paths:
      - 'configs/release-gates/**'
      - 'tools/release_gate_audit.py'
      - 'tools/artcraft_release_naming.py'
      - 'tools/test_artcraft_release_naming.py'
      - 'configs/feature-parity.json'
      - 'tools/suite_feature_parity.py'
      - 'tools/test_suite_feature_parity.py'
      - 'docs/ARTCRAFT_ANDROID_FONT_UPDATE_STANDARD.md'
      - 'AGENTS.md'
      - '.github/workflows/suite-release-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'KosmosSG/artcraft-android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify independent fail-closed release settings for every app
        run: python3 tools/release_gate_audit.py
      - name: Test upstream-plus-Android-revision naming across the suite
        run: python3 tools/test_artcraft_release_naming.py -v
      - name: Test PhotoCraft custom fonts and updater requirements for every Craft app
        run: |
          python3 tools/suite_feature_parity.py
          python3 tools/test_suite_feature_parity.py -v
      - name: Verify the standard release metadata and artifact filename
        run: |
          python3 tools/artcraft_release_naming.py verify \
            --app vectorcraft --upstream v0.14.0 --revision 2 \
            --version-name 0.14.0-android.2 \
            --tag vectorcraft-v0.14.0-android.2 \
            --title 'VectorCraft v0.14.0-android.2' \
            --apk VectorCraft-v0.14.0-android.2-arm64-v8a.apk
