name: VectorCraft v0.21 Android.24 FIRST-BUFFER+TRACKPAD TEST ARM64 disposable-key APK (TEST ONLY)

# Protected stable Android baseline: v0.14.0-android.13; selectively port official v0.21.0.
# One-time trigger-file gated push only; normal changes do not rebuild.
# No production signing, release publication, or published APK replacement.
on:
  push:
    branches:
      - investigation/vectorcraft-android24-startup-input-20261109
    paths:
      - .github/vectorcraft-stability-test.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vectorcraft-stability-test-apk
  cancel-in-progress: false

jobs:
  disposable-test-apk:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/investigation/vectorcraft-android24-startup-input-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_SHA: 11862f61198c8f62c0b22b6c9a331cc5950ac98d
      BUILDER_SHA: 52308fbcb26d8d8625f35fc1f048813f8e1e12a8
      VERSION_NAME: 0.21.0-android.24
      VERSION_CODE: '16783384'
      LAST_PUBLISHED_CODE: '16780813'
      ORIGINAL_CERT: 7fc384231187a50f7ac3d6fe45e1f0c5b728e195ef24e783b087dce0d3af93f5
      ARTCRAFT_TARGET_SDK: '35'
      ARTCRAFT_BUILD_TOOLS_VERSION: 35.0.0
      ARTCRAFT_NDK_VERSION: 27.2.12479018
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      # Strip native symbol tables but retain Release opt-level 3 / thin-LTO
      # to avoid slowing startup, painting, font import or trackpad gestures.
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Check out owner Android changes (no write credentials)
        uses: actions/checkout@v5
        with:
          path: android-port
          persist-credentials: false
      - name: Check out immutable Android builder
        uses: actions/checkout@v5
        with:
          repository: MostafaXS1/artcraft-android
          ref: 52308fbcb26d8d8625f35fc1f048813f8e1e12a8
          path: builder
          persist-credentials: false
      - name: Check out official VectorCraft v0.21.0
        uses: actions/checkout@v5
        with:
          repository: storytold/vectorcraft
          ref: 11862f61198c8f62c0b22b6c9a331cc5950ac98d
          path: builder/source/vectorcraft
          persist-credentials: false
      - name: Enforce source, version, signing and test-only gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$BUILDER_SHA"
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$VERSION_CODE" -gt "$LAST_PUBLISHED_CODE"
          test ! -e builder/keys/artcraft-builder.jks
          test ! -e android-port/keys/artcraft-builder.jks
          grep -q '^version = "0.21.0"' builder/source/vectorcraft/Cargo.toml
          python3 -m py_compile android-port/tools/vectorcraft/patch_stability_v021.py android-port/tools/vectorcraft/patch_vc_icon_menu_v021.py android-port/tools/vectorcraft/patch_smooth_menu_scroll_v021.py android-port/tools/vectorcraft/patch_android12_keyboard.py android-port/tools/vectorcraft/patch_android12_startup.py android-port/tools/vectorcraft/patch_android12_menu_scroll.py android-port/tools/vectorcraft/patch_android13_recovery.py android-port/tools/vectorcraft/patch_android13_menu_scroll.py android-port/tools/vectorcraft/patch_android14_diagnostic_session.py android-port/tools/vectorcraft/patch_android15_modal_keys.py android-port/tools/vectorcraft/patch_android16_modal_frame.py android-port/tools/vectorcraft/patch_android17_reference_adoption.py android-port/tools/vectorcraft/patch_android18_modal_and_gestures.py android-port/tools/vectorcraft/patch_android19_reference_ime.py android-port/tools/vectorcraft/patch_android20_native_keyboard_splash.py android-port/tools/vectorcraft/patch_android21_photocraft_parity.py android-port/tools/vectorcraft/patch_android22_high_refresh.py android-port/tools/vectorcraft/patch_android23_input_boot.py android-port/tools/vectorcraft/patch_android23_font_fastpath.py android-port/tools/vectorcraft/patch_android24_startup_menu.py
          # Dry-run generated Android overlays on reviewed files BEFORE NDK install.
          # This keeps stale Java/Rust source anchors from burning build minutes.
          python3 - <<'PY'
          from pathlib import Path
          import shutil, tempfile, sys
          sys.path.insert(0, "android-port/tools/vectorcraft")
          from patch_stability_v021 import patch_adapter, patch_dialog, patch_startup
          from patch_android12_keyboard import patch as keyboard12
          from patch_android12_startup import patch as startup12
          from patch_android12_menu_scroll import patch as scroll12
          from patch_android13_recovery import patch as recovery13
          from patch_android13_menu_scroll import patch as scroll13
          from patch_keyboard_diagnostics_v021 import patch as keyboard_diag
          from patch_android14_diagnostic_session import patch as diagnostic14
          from patch_android15_modal_keys import patch as modal15
          from patch_android16_modal_frame import patch as modal16
          from patch_android17_reference_adoption import patch as reference17
          from patch_android18_modal_and_gestures import patch as android18
          from patch_android19_reference_ime import patch as android19
          from patch_android20_native_keyboard_splash import patch as android20
          from patch_android21_photocraft_parity import patch as photocraft21
          from patch_android22_high_refresh import patch as refresh22
          from patch_android23_input_boot import patch as input23
          from patch_android23_font_fastpath import patch as fonts23
          from patch_android24_startup_menu import patch as input24, patch_winit as backend24
          from patch_smooth_menu_scroll_v021 import patch as smooth_scroll
          owner=Path("android-port/adapters/vectorcraft")
          upstream=Path("builder/source/vectorcraft/crates/ui-egui/src")
          with tempfile.TemporaryDirectory(prefix="vc-android11-overlay-") as temp:
              root=Path(temp)
              dst=root/"adapters/vectorcraft"
              shutil.copytree(owner,dst)
              target=root/"source/vectorcraft/crates/ui-egui/src"
              target.mkdir(parents=True)
              for filename in ("shortcuts.rs","dialogs.rs","widgets/dropdowns.rs","menus/tree.rs","menus/run.rs","app/commands.rs","canvas/input.rs"):
                  (target/filename).parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(upstream/filename,target/filename)
              patch_adapter(root)
              patch_dialog(root)
              patch_startup(root)
              # The full builder runs patch_android_menus_v020.py before the
              # smooth-scroll overlay. Mirror its reviewed ScrollSource::ALL
              # insert here, without mutating the official pinned upstream.
              from patch_smooth_menu_scroll_v021 import ORIGINAL
              dropdowns=target/"widgets/dropdowns.rs"
              menu_source=dropdowns.read_text()
              original_line='        egui::ScrollArea::vertical().max_height(room).min_scrolled_height(room).show(ui, add_contents).inner'
              assert menu_source.count(original_line) == 1
              dropdowns.write_text(menu_source.replace(original_line, ORIGINAL, 1))
              smooth_scroll(root)
              # Earlier full-build Android menu integration supplies these
              # two anchors to the keyboard diagnostic overlay. Mirror that
              # exact source transformation in this cheap dry-run.
              from patch_android_menus_v020 import add_vc_menu, insert_once
              tree=target/"menus/tree.rs"
              tree_src=add_vc_menu(tree.read_text())
              tree_src=insert_once(tree_src,
                  '            "Help",\n            vec![\n                c("Join Our Discord", "help.discord"),',
                  '            "Help",\n            vec![\n                #[cfg(target_os = "android")]\n                c("Graphics Diagnostics…", "android.vectorcraft.diagnostics"),\n                #[cfg(target_os = "android")]\n                Sep,\n                c("Join Our Discord", "help.discord"),',
                  "Help diagnostics dry-run")
              tree.write_text(tree_src)
              run=target/"menus/run.rs"
              original='pub fn run_ui_command(app: &mut VectorcraftApp, id: &str, p: &Value) -> Option<Result<Value, String>> {\n'
              source=run.read_text()
              synthetic = '    #[cfg(target_os = "android")]\n    {\n        let bit = match id {\n            "android.vectorcraft.diagnostics" => 64,\n            _ => 0,\n        };\n        if bit != 0 { return Some(Ok(Value::Null)); }\n    }\n'
              source=insert_once(source, original, original+synthetic, "Android run command dry-run")
              run.write_text(source)
              keyboard_diag(root)
              keyboard12(root)
              startup12(root)
              scroll12(root)
              recovery13(root)
              scroll13(root)
              diagnostic14(root)
              modal15(root)
              modal16(root)
              reference17(root)
              android18(root)
              android19(root)
              android20(root)
              photocraft21(root)
              refresh22(root)
              input23(root)
              input24(root)
              rust=(dst/"src/lib.rs").read_text()
              java=(dst/"java/com/artcraft/vectorcraft/VectorCraftActivity.java").read_text()
              shortcuts=(target/"shortcuts.rs").read_text()
              assert "poll_hidden_ime_close" in rust
              assert "if self.last_type_editing && !editing_now" in rust
              assert "vcPollHiddenImeClose" in java
              assert "verifiedNativeFrames >= 3" in java
              assert "android_save_changes_key" in shortcuts
              assert "vcPollPhysicalShortcut" in java
              assert "verifiedNativeFrames >= 3" in java
              assert "self.menu_scroll.apply(ctx, raw);" not in rust
              assert "hardwareShortcutMode" in java
              assert "final boolean canvasKey = mode == 1" in java
              assert "finishAndRemoveTask();" not in java
              assert "firstFrameProbeStartMs = System.currentTimeMillis();" in java
              assert "android_owner_unsaved_key" in shortcuts and "android_owner_unsaved_key" in rust
              assert 'self.inner.select_tool(tool_id)' in rust
              assert '.wheel_scroll_multiplier(egui::vec2(1.0, 0.90))' in (target/"widgets/dropdowns.rs").read_text()
              assert 'let hovered_menu = egui::Popup::is_any_open(ctx);' in (dst/"src/android_modifiers.rs").read_text()
              assert "vcDiagnosticSnapshot" in java
              assert "vcCopyDiagnosticReport" in java
              assert "vc_diag_recording" in rust
              assert "Copy Report" in rust
              assert "No typed text, document content" in rust
              assert "vcDiagStartupStage" in java
              assert "vcDiagShortcutDowns" in java
              assert "vcOfferModalShortcut" in java
              assert "vcOfferModalCommit" in java
              assert "last_modal_action" in rust
              assert 'route={source}' in rust
              assert "vc_diag_last_modal_action" in rust
              assert "vc_modal_pending_action" in rust
              assert "self.vc_modal_pending_action.take()" in rust
              assert "self.vc_modal_followup_repaints = 8" in rust
              assert "phase=logic" in rust
              assert "vcDiagSavePickerStage" in java
              assert "vcDiagFrameProbeStage" in java
              assert "vcWakeNativeLoop" in java
              assert "wake_native_loop()" in rust
              assert "platform_splash_until_native_ui" not in java
              assert "native_ui_traversal_ready" in java
              assert "mode == 2 && previousMode != 2" in java
              assert "nativeSurface.requestFocus();" in java
              assert "app.session.prefs.touch_gestures = true;" in rust
              assert "touch_center.is_some()" in (target/"canvas/input.rs").read_text()
              assert '(31, 1) => Some(egui::Key::C)' in rust
              assert "KeyEvent.KEYCODE_A && key <= KeyEvent.KEYCODE_Z" in java
              assert 'splash.setKeepOnScreenCondition(() -> !nativeEditorReady' not in java
              assert '        showStartupCover();' not in java
              assert "incoming_nonempty = incoming.ctrl" in (dst/"src/android_modifiers.rs").read_text()
              assert "vcDiagNativeWakes" in java
              assert "imeView.setVisibility(View.GONE);" in java
              assert "view.setVisibility(View.VISIBLE);" in java
              assert "view.setVisibility(View.GONE);" in java
              assert "view.setFocusable(false);" in java
              assert "vcProbeWindowFrame" not in java
              assert "photocraft_direct_native_launch" in java
              assert "native_editor_ui_ready" in java
              assert "SplashScreen.installSplashScreen(this);" not in java
              assert "if (!nativeEditorReady) showStartupCover();" in java
              assert "vcAndroid24RevealNativeBuffer" in java
              assert "android24_first_buffer_visible" in java
              assert "splashHandler.postDelayed(this::dismissStartupCover, 120);" not in java
              assert "        self.inner.raw_input_hook(raw);" in rust
              assert "PhotoCraft parity: let egui" in rust
              assert "vcRefreshRateHint" in java
              assert "preferredRefreshRate=chosen;" in java
              assert "VC_PERF_UI_PROXY" in rust
              assert "VC_UI_STALL" in rust
              assert "vc_prune_last" in rust
              assert "vc_perf_active_until" in rust
              assert "from_micros(6060)" not in rust
              assert "PhotoCraft parity: do NOT rewrite Android native wheel sources" in rust
              assert "vc_font_fallback_last" in rust
              assert "from_micros(6060)" not in (target/"widgets/dropdowns.rs").read_text()
              backend=Path("android-port/tools/vectorcraft/backend_stability.py").read_text()
              assert "unclassified_pad" in backend
              assert "pad_fallback_gesture" in backend
              assert "clamp(-48.0, 48.0)" in backend
              assert "factor.clamp(0.94, 1.06)" in backend
              assert "reported_pad_gesture != PadGesture::None" in backend
              assert "return input_status;" in backend
              assert "PixelCopy.request(source, bitmap" not in java
              assert "native_editor_ui_ready" in java
              assert "progress.setIndeterminate(true);" in java
              assert "vcSplashDeadline = android.os.SystemClock.uptimeMillis() + 1200L;" not in java
              assert "decor.requestFocus();" in java
              assert "physical_key.unwrap_or(*native) != key" in rust
              assert "The real key is needed by NativeActivity to wake its looper." in java
              assert "com.artcraft.ime.ArtCraftIme.wake();" in java
              assert "vc_after_type_exit_frames" in rust
              assert "just_exited_type" in rust
              assert "vcWakeNativeLoop();" in java
          # Simulate the FINAL vendored winit patch on immutable builder files
          # before SDK/NDK setup, so a stale backend anchor cannot burn minutes.
          from backend_stability import patch as final_vendor_patch
          with tempfile.TemporaryDirectory(prefix="vc-winit-preflight-") as temp_dir:
              temporary=Path(temp_dir)
              shutil.copytree(Path("builder/vendor/winit/src"), temporary/"src")
              final_vendor_patch(temporary)
              backend_output=(temporary/"src/platform_impl/android/mod.rs").read_text()
              assert "unclassified_pad" in backend_output
              assert "pad_fallback_gesture: PadGesture" in backend_output
              assert "if unclassified_pad && pad_gesture==PadGesture::None" in backend_output
              assert "Classification::TwoFingerSwipe => PadGesture::Scroll" in backend_output
              assert "Classification::Pinch => PadGesture::Pinch" in backend_output
              backend24(temporary)
              backend_output=(temporary/"src/platform_impl/android/mod.rs").read_text()
              assert "clamp(-160.0, 160.0)" in backend_output
              assert "factor.clamp(0.75, 1.33)" in backend_output
              print("PASS: final Android.24 native trackpad packet patch applied to pinned builder before expensive ARM64")
          # Verify the cold-start font cache still resolves the full SAF
          # library, but never counts 5000 external files on the UI thread.
          template=root/"templates/android"
          template.mkdir(parents=True,exist_ok=True)
          from patch_cached_system_fonts_v020 import apply as apply_cached_fonts
          source=Path("builder/templates/android/system_fonts.rs").read_text()
          (template/"system_fonts.rs").write_text(apply_cached_fonts(source))
          fonts23(root)
          font_source=(template/"system_fonts.rs").read_text()
          assert "refresh_font_links_off_ui_thread();" in font_source
          assert "entries.flatten().count()" not in font_source
          assert "fn refresh_font_links_off_ui_thread()" in font_source
          assert "vectorcraft-font-links-cache-v1" in font_source
          print("PASS: Android.24 first-buffer probe, fast fonts, bounded pan/pinch, keyboard protected")
          PY
          python3 -m unittest discover -s android-port/tools/vectorcraft -p 'test_*.py' -v
          rustc --edition=2021 --test android-port/tools/vectorcraft/test_device_kind.rs -o "$RUNNER_TEMP/vc-pointer-tests"
          "$RUNNER_TEMP/vc-pointer-tests"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          meta=tomllib.loads(Path("android-port/adapters/vectorcraft/Cargo.toml").read_text())["package"]["metadata"]["android"]
          assert meta["package"]=="com.artcraft.vectorcraft"
          assert meta["build_targets"]==["aarch64-linux-android"]
          assert meta["application"]["activity"][0]["name"]==".VectorCraftActivity"
          assert Path("android-port/assets/branding/vectorcraft/vc-owner-20261103.svg").is_file()
          print("PASS: independent production package and original artwork retained; permanent key forbidden")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Reuse only an official, SHA-256 verified Gradle ZIP; avoid another
      # 20-minute Rust compile ending in a Gradle download HTTP 504.
      - name: Restore Gradle 8.11.1 distribution cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vectorcraft-gradle/gradle-8.11.1-bin.zip
          key: vectorcraft-gradle-8.11.1-bin-f397b287-v1
      - name: Prefetch and verify Gradle 8.11.1 before ARM64 compilation
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_SHA="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
          CACHE="$HOME/.cache/vectorcraft-gradle"
          ZIP="$CACHE/gradle-8.11.1-bin.zip"
          mkdir -p "$CACHE"
          if ! (test -s "$ZIP" && echo "$GRADLE_SHA  $ZIP" | sha256sum --check --status); then
            rm -f "$ZIP" "$ZIP.part"
            ok=0
            for source in \
              "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"; do
              for attempt in 1 2 3; do
                echo "Gradle 8.11.1 fetch attempt $attempt: $source"
                if curl --fail --location --silent --show-error \
                    --retry 2 --retry-all-errors --retry-delay 3 \
                    --connect-timeout 20 --max-time 300 \
                    --output "$ZIP.part" "$source" \
                    && echo "$GRADLE_SHA  $ZIP.part" | sha256sum --check --status; then
                  mv "$ZIP.part" "$ZIP"
                  ok=1
                  break 2
                fi
                rm -f "$ZIP.part"
              done
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "::error::Pinned Gradle ZIP unavailable/mismatched; aborting before expensive Rust compilation"
              exit 1
            fi
          fi
          echo "$GRADLE_SHA  $ZIP" | sha256sum --check
          # Pinned builder copies templates/gradle to the generated launcher.
          # Modify only this disposable checkout; no permanent release changes.
          python3 - "$ZIP" "$GRADLE_SHA" <<'PY'
          from pathlib import Path
          import sys
          zip_path=Path(sys.argv[1]).resolve()
          expected=sys.argv[2]
          props=Path("builder/templates/gradle/gradle/wrapper/gradle-wrapper.properties")
          original=props.read_text()
          remote=r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          assert original.count(remote)==1, "Unreviewed Gradle wrapper template; refuse modification"
          uri=zip_path.as_uri().replace(":",r"\:")
          updated=original.replace(remote,"distributionUrl="+uri)
          assert "distributionSha256Sum=" not in updated
          updated+="distributionSha256Sum="+expected+"\n"
          props.write_text(updated)
          assert "distributionUrl=file\:///" in updated
          print("PASS: official SHA-256 Gradle 8.11.1 ZIP; local wrapper URL; no late remote download")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android 35, tools and NDK 27.2 once
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Stage owner adapter and reviewed upstream v0.21 patches
        shell: bash
        run: |
          set -euo pipefail
          # Catch Java SDK mismatches before the expensive ARM64 Rust build.
          grep -Fq 'import android.view.PixelCopy;' android-port/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          ! grep -Fq 'import android.graphics.PixelCopy;' android-port/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          javap -classpath "$ANDROID_HOME/platforms/android-35/android.jar" android.view.PixelCopy >/dev/null
          echo "PASS: SDK 35 PixelCopy import and class verified"
          rm -rf builder/adapters/vectorcraft
          cp -a android-port/adapters/vectorcraft builder/adapters/vectorcraft
          python3 android-port/tools/vectorcraft/patch_android_menus_v020.py builder
          python3 android-port/tools/vectorcraft/patch_vc_icon_menu_v021.py builder
          python3 android-port/tools/vectorcraft/patch_android_about_updates.py builder
          # The builder replaces upstream android-activity and winit during the full APK build.
          # Its native-activity 0.6.1 lacked classification() despite winit calling it.
          # Safely resolve the Android API-29+ symbol at runtime; on API 28 return None.
          python3 android-port/tools/vectorcraft/patch_android_native_classification.py builder
          # VectorCraft v0.21's official egui-winit expects Storytold winit's
          # ImeResetCompleted and reset_ime_with_request APIs; this builder's
          # older vendored winit has neither. Preserve all custom touch/mouse
          # code while adding exactly the upstream public IME interface.
          python3 android-port/tools/vectorcraft/patch_android_winit_ime_v020.py builder
          # The reference builder copies adapters/vectorcraft again during packaging.
          # Patch THAT source, not only the compatibility check's temporary apps crate.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"android-port/tools/vectorcraft")
          from patch_android_adapter_v020 import patch_staged_source
          manifest=Path("builder/source/vectorcraft/Cargo.toml").read_text()
          path=Path("builder/adapters/vectorcraft/src/lib.rs")
          path.write_text(patch_staged_source(manifest,path.read_text()))
          print("PASS: v0.21 MIME filters and input hook fixed in builder-owned Android adapter")
          PY
          python3 android-port/tools/vectorcraft/patch_stability_v021.py builder
          python3 android-port/tools/vectorcraft/patch_android24_startup_menu.py builder
          python3 android-port/tools/vectorcraft/patch_android24_startup_menu.py builder --install-backend-hook
          python3 android-port/tools/vectorcraft/prepare_builder.py builder "$VERSION_NAME" "$VERSION_CODE"
          # Android.3: the real Vc mark is the clickable top-left menu,
          # native launch window is brand maroon, and icon safe-zone padding
          # applies to both Android adaptive and legacy mipmaps.
          # VectorCraft NativeActivity needs no AppCompat, Kotlin or
          # GameActivity. Do not pull them into the final DEX/resources.
          python3 android-port/tools/vectorcraft/patch_compact_apk_v020.py builder android-port
          # Fail *before* expensive ARM64 Rust compilation if the generated
          # Gradle theme still points to AppCompat after its dependency removal.
          python3 - <<'PY'
          from pathlib import Path
          source=Path("builder/lib/android_project.py").read_text()
          assert 'parent="android:style/Theme.Material.NoActionBar"' in source
          assert 'parent="Theme.SplashScreen"' in source
          assert "implementation 'androidx.core:core-splashscreen:1.0.1'" in source
          assert 'postSplashScreenTheme' in source
          assert 'parent="Theme.AppCompat.NoActionBar"' not in source
          assert "implementation 'androidx.appcompat:" not in source
          assert "implementation 'androidx.games:" not in source
          assert 'android:windowFullscreen' in source
          print("PASS: no native launcher AppCompat theme mismatch before compile")
          PY
          # Reuse unchanged system-font symlink layout across cold launches
          # without affecting native font fallbacks or SAF imported fonts.
          python3 android-port/tools/vectorcraft/patch_cached_system_fonts_v020.py builder
          python3 android-port/tools/vectorcraft/patch_android23_font_fastpath.py builder
          grep -Fq 'vectorcraft_android24.py' builder/lib/build-common.sh
          grep -Fq 'vcAndroid24RevealNativeBuffer' builder/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          # Only this disposable candidate gets a separate application ID.
          # Keep stable Java/JNI namespace, original Android source and signing key unchanged.
          python3 android-port/tools/vectorcraft/patch_test_package_v021.py builder
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          # Owner supplied a NEW flat Vc artwork; the previous glossy approved
          # icon is preserved for older releases but must not enter this candidate.
          python3 android-port/tools/vectorcraft/render_owner_icon.py \
            android-port/assets/branding/vectorcraft/vc-owner-20261103.svg \
            "$RUNNER_TEMP/vectorcraft-test-icon.png"
          python3 - "$RUNNER_TEMP/vectorcraft-test-icon.png" <<'PY'
          from PIL import Image
          import sys
          icon=Image.open(sys.argv[1]).convert("RGBA")
          assert icon.size==(1024,1024) and icon.getpixel((0,0))[3]==0
          assert icon.getpixel((512,80))[:3]==(45,0,0)
          orange=icon.getpixel((420,450))
          assert orange[0]>180 and orange[1]>70 and orange[2]<80
          print("PASS: owner dark-maroon/orange Vc artwork and transparent corners")
          PY
          python3 android-port/tools/vectorcraft/adaptive_safe.py builder vectorcraft
          python3 android-port/tools/vectorcraft/install_android_brand.py builder "$RUNNER_TEMP/vectorcraft-test-icon.png"
          grep -Fq 'self.inner.raw_input_hook(ctx, raw);' builder/adapters/vectorcraft/src/lib.rs
      - name: Behavioral gates on generated code before ARM64 compilation
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo test --manifest-path builder/source/vectorcraft/Cargo.toml -p vectorcraft-ui-egui --lib android_stability --no-default-features
          python3 android-port/tools/vectorcraft/run_staged_input_tests.py builder
      - name: Compile optimized ARM64 VectorCraft Android test APK (disposable builder key)
        shell: bash
        timeout-minutes: 125
        run: |
          set -euo pipefail
          # The latest Mostafa builder auto-updates to upstream v0.22.0 by default,
          # which discards our reviewed v0.21.0 owner UI/keyboard overlays.
          # --noupdate is a supported builder flag: pin the tested upstream commit.
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -f builder/adapters/vectorcraft/src/ime_bridge.rs
          test -f builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'pub fn set_android_preferences(' builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'pub fn take_android_menu_bits()' builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'fn android_owner_unsaved_key(' builder/source/vectorcraft/crates/ui-egui/src/shortcuts.rs
          bash builder/build.sh -vectorcraft --noupdate "-appicon=$RUNNER_TEMP/vectorcraft-test-icon.png"
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(find builder/output -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
      - name: Verify installable test APK package, ARM64, signature and version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-test
          APK="$(find builder/output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > private-test/badging.txt
          "$AAPT" dump resources "$APK" > private-test/resources.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > private-test/signature.txt
          python3 - "$APK" <<'PY'
          import json,os,re,sys,zipfile,hashlib
          from pathlib import Path
          apk=Path(sys.argv[1])
          badging=Path("private-test/badging.txt").read_text()
          resources=Path("private-test/resources.txt").read_text()
          match=re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging,re.M)
          assert match and match.groups()==("com.artcraft.vectorcraft.test",os.environ["VERSION_CODE"],os.environ["VERSION_NAME"]),match
          assert re.search(r"^launchable-activity: name='com\.artcraft\.vectorcraft\.VectorCraftActivity'",badging,re.M)
          sig=Path("private-test/signature.txt").read_text()
          fingerprints=re.findall(r"Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]{64})",sig)
          assert len(fingerprints)==1 and fingerprints[0].lower()!=os.environ["ORIGINAL_CERT"], "Test must NOT use permanent key"
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              files=z.namelist()
              libs=[x for x in files if x.startswith("lib/") and x.endswith(".so")]
              assert libs and all(x.startswith("lib/arm64-v8a/") for x in libs),libs
              assert "lib/arm64-v8a/libvectorcraft_android.so" in files
              dex=[z.read(x) for x in files if x.endswith(".dex")]
              assert dex and any(b"VectorCraftActivity" in x for x in dex)
              # aapt2/Gradle compiles launcher mipmap entries into resources.arsc;
              # individual ic_launcher files do NOT necessarily appear as ZIP names.
              assert "resources.arsc" in files, "Android compiled resources missing"
          assert "mipmap/ic_launcher" in resources or "drawable/ic_launcher" in resources, "Android launcher icon resource missing"
          report={"source_commit":os.environ["GITHUB_SHA"],"build_number":os.environ["GITHUB_RUN_NUMBER"],"run_id":os.environ["GITHUB_RUN_ID"],"upstream_sha":os.environ["UPSTREAM_SHA"],"builder_sha":os.environ["BUILDER_SHA"],"package":match.group(1),"version_code":int(match.group(2)),"version_name":match.group(3),"test_certificate_sha256":fingerprints[0].lower(),"original_certificate_used":False,"apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),"install_mode":"separate test application ID; stable installation and its data stay untouched","device_checks":"pending"}
          Path("private-test/verification.json").write_text(json.dumps(report,indent=2)+"\n")
          print("PASS: separate-install temporary-signature TEST APK, correct ARM64, launcher, app identity, icon and version")
          PY
          cp "$APK" "private-test/VectorCraft-v$VERSION_NAME-ARM64-DISPOSABLE-TEST-SIGNED.apk"
          (cd private-test && sha256sum *.apk > SHA256SUMS.txt)
          # Record sizes inside the APK for subsequent APK.3 vs APK.2
          # comparisons; JNI libraries must remain uncompressed for
          # Android's direct page-aligned loading and faster startup.
          python3 - "$APK" <<'PY'
          import json,sys,zipfile
          from pathlib import Path
          path=Path(sys.argv[1])
          with zipfile.ZipFile(path) as z:
              entries=sorted(z.infolist(),key=lambda e:e.file_size,reverse=True)
              total_lib=sum(e.file_size for e in entries if e.filename.startswith("lib/") and e.filename.endswith(".so"))
              details=[{"path":e.filename,"raw_bytes":e.file_size,"compressed_bytes":e.compress_size}
                       for e in entries[:12]]
              report={"apk_bytes":path.stat().st_size,"native_library_raw_bytes":total_lib,
                      "largest_entries":details,"release_symbols_stripped":True,
                      "unused_androidx_gameactivity_removed":True,
                      "native_library_direct_loading_retained":True}
          Path("private-test/size-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("PASS: APK size report recorded",report["apk_bytes"],"bytes")
          PY
          rm -f private-test/badging.txt private-test/resources.txt private-test/signature.txt
      - name: Upload PRIVATE test artifact only — never publish a GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: VectorCraft-v0.21.0-android.24-ARM64-DISPOSABLE-SIGNATURE-TEST-ONLY
          path: private-test/
          if-no-files-found: error
          retention-days: 7
      - name: Delete disposable builder signing materials
        if: always()
        shell: bash
        run: |
          rm -rf builder/keys
