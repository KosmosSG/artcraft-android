name: VectorCraft Android baseline
on:
  push:
    branches: [vectorcraft-android-baseline, vectorcraft-photocraft-parity-20261021, development/vectorcraft-v014-20261023, development/vectorcraft-v014-android4-ui-20261023, development/vectorcraft-v014-android5-menu-20261023, development/vectorcraft-v014-android6-gpu-panel-20261023, development/vectorcraft-v014-font-status-update-20261024]
    paths: ['tools/vectorcraft/**', 'adapters/vectorcraft/**', 'assets/branding/vectorcraft/**', '.github/workflows/vectorcraft-baseline.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Reserved Android versionCode (must exceed every prior installed/signed version)'
        required: true
        type: string
      previous_version_code:
        description: 'Verified highest previous code; 0 only for a confirmed first installation'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vectorcraft-baseline
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/vectorcraft -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile VectorCraft Android Java bridge
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]]; then
            "$SDKMANAGER" --install 'platforms;android-35'
          fi
          mkdir -p "$RUNNER_TEMP/vectorcraft-java-check"
          javac -source 17 -target 17 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/vectorcraft-java-check" \
            adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java \
            adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftExtras.java \
            tools/vectorcraft/FontContentTest.java
          java -cp "$ANDROID_HOME/platforms/android-35/android.jar:$RUNNER_TEMP/vectorcraft-java-check" FontContentTest
  compile:
    # Automatic, unsigned native compile check; cannot use signing secrets or publish releases.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/vectorcraft-photocraft-parity-20261021' || github.ref == 'refs/heads/development/vectorcraft-v014-20261023' || github.ref == 'refs/heads/development/vectorcraft-v014-android4-ui-20261023' || github.ref == 'refs/heads/development/vectorcraft-v014-android5-menu-20261023' || github.ref == 'refs/heads/development/vectorcraft-v014-android6-gpu-panel-20261023' || github.ref == 'refs/heads/development/vectorcraft-v014-font-status-update-20261024')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: storytold/vectorcraft
          ref: ad0566943ab9741e6356bbc9b53c3cc09895068d
          path: builder/source/vectorcraft
          persist-credentials: false
      - name: Install reviewed VectorCraft Android adapter for compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = ad0566943ab9741e6356bbc9b53c3cc09895068d
          mkdir -p builder/source/vectorcraft/apps/vectorcraft-android/src
          cp -a adapters/vectorcraft/. builder/source/vectorcraft/apps/vectorcraft-android/
          cp builder/templates/android/system_fonts.rs builder/source/vectorcraft/apps/vectorcraft-android/src/system_fonts.rs
          cp builder/templates/android/ime_bridge.rs builder/source/vectorcraft/apps/vectorcraft-android/src/ime_bridge.rs
          python3 tools/vectorcraft/patch_android_menus.py builder
          python3 -m pip install --disable-pip-version-check Pillow
          python3 tools/vectorcraft/verify_approved_icon.py assets/branding/vectorcraft/vc-glass-approved.png
          python3 tools/vectorcraft/clean_launcher_icon.py assets/branding/vectorcraft/vc-glass-approved.png "$RUNNER_TEMP/vectorcraft-inapp-vc.png"
          python3 tools/vectorcraft/install_android_brand.py builder "$RUNNER_TEMP/vectorcraft-inapp-vc.png"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK for ARM64 native checks
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check VectorCraft ARM64 Rust shell without signing
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android28-clang"
          cargo check --manifest-path builder/source/vectorcraft/apps/vectorcraft-android/Cargo.toml --target aarch64-linux-android

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vectorcraft-photocraft-parity-20261021'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILDER_SHA: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
      SOURCE_SHA: ad0566943ab9741e6356bbc9b53c3cc09895068d
      SOURCE_TAG: v0.14.0
      VERSION_NAME: 0.14.0-android.2
      VERSION_CODE: ${{ inputs.version_code }}
      PREVIOUS_CODE: ${{ inputs.previous_version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify exact approved launcher icon before expensive builds
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vectorcraft/verify_approved_icon.py assets/branding/vectorcraft/vc-glass-approved.png
      - name: Validate reserved version code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          new, old = os.environ['VERSION_CODE'], os.environ['PREVIOUS_CODE']
          if not re.fullmatch(r'[1-9][0-9]*', new) or not re.fullmatch(r'0|[1-9][0-9]*', old):
              raise SystemExit('Version codes must be decimal integers')
          if not 0 <= int(old) < int(new) <= 2100000000:
              raise SystemExit('Reserved versionCode must exceed the previous verified code')
          PY
      - uses: actions/checkout@v5
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: storytold/vectorcraft
          ref: ad0566943ab9741e6356bbc9b53c3cc09895068d
          fetch-depth: 1
          path: builder/source/vectorcraft
          persist-credentials: false
      - name: Verify official release provenance and apply Android version metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$BUILDER_SHA"
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$SOURCE_SHA"
          git -C builder/source/vectorcraft fetch --depth=1 origin "refs/tags/$SOURCE_TAG:refs/tags/$SOURCE_TAG"
          test "$(git -C builder/source/vectorcraft rev-parse "$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
          # The pinned reference is a reviewed toolchain only. Ship this branch's
          # independently reviewed VectorCraft adapter, never the reference's older shell.
          test -s adapters/vectorcraft/src/lib.rs
          test -s adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftExtras.java
          rm -rf builder/adapters/vectorcraft
          cp -a adapters/vectorcraft builder/adapters/vectorcraft
          cmp adapters/vectorcraft/src/lib.rs builder/adapters/vectorcraft/src/lib.rs
          cmp adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftExtras.java \
              builder/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftExtras.java
          python3 tools/vectorcraft/adaptive_safe.py builder vectorcraft
          python3 tools/vectorcraft/patch_android_menus.py builder
          python3 tools/vectorcraft/prepare_builder.py builder "$VERSION_NAME" "$VERSION_CODE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build VectorCraft candidate with approved Vc icon and disposable local key
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL="$GITHUB_WORKSPACE/assets/branding/vectorcraft/vc-glass-approved.png"
          test -s "$ORIGINAL"
          python3 tools/vectorcraft/verify_approved_icon.py "$ORIGINAL"
          # Do not change the approved source: only use a border-free derivative
          # for Android's adaptive launcher, like the released PhotoCraft icon.
          ICON="$GITHUB_WORKSPACE/vectorcraft-vc-no-border.png"
          python3 tools/vectorcraft/clean_launcher_icon.py "$ORIGINAL" "$ICON"
          bash builder/build.sh -vectorcraft "-appicon=$ICON"
      - name: Export unsigned payload only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          apks = list(Path('builder/output').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one candidate')
          # Rewriting the ZIP removes APK v2/v3 signing blocks; remove v1 signature entries too.
          with zipfile.ZipFile(apks[0]) as src, zipfile.ZipFile('unsigned/vectorcraft-unsigned.apk', 'w') as dst:
              for entry in src.infolist():
                  if re.fullmatch(r'META-INF/(MANIFEST\.MF|[^/]+\.(SF|RSA|DSA|EC))', entry.filename, re.I):
                      continue
                  dst.writestr(entry, src.read(entry.filename))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: vectorcraft-unsigned-payload
          path: unsigned/
          retention-days: 1
      - name: Remove disposable key and candidate
        if: always()
        run: rm -rf builder/keys builder/output
  sign:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: 0.14.0-android.2
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: tools/vectorcraft
      - uses: actions/download-artifact@v5
        with:
          name: vectorcraft-unsigned-payload
          path: unsigned
      - name: Sign isolated payload with established VectorCraft identity
        env:
          KEY_DATA: ${{ secrets.VECTORCRAFT_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VECTORCRAFT_KEYSTORE_PASSWORD }}
          EXPECTED_CERT: ${{ vars.VECTORCRAFT_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_DATA" && test -n "$KEY_PASSWORD" && test -n "$EXPECTED_CERT" || {
            echo 'Signing blocked: resolve VectorCraft installed APK/key provenance; no replacement production key will be generated.' >&2
            exit 1
          }
          umask 077
          printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/vectorcraft.jks"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)
          mkdir -p verified
          "$ZIPALIGN" -P 16 -f 4 unsigned/vectorcraft-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/vectorcraft.jks" --ks-key-alias artcraftbuilder --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --out "verified/vectorcraft-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
      - name: Verify signed APK before distribution
        env:
          EXPECTED_CERT: ${{ vars.VECTORCRAFT_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK="verified/vectorcraft-$VERSION_NAME.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          python3 tools/vectorcraft/verify_apk.py "$APK" "$AAPT" "$APKSIGNER" "$VERSION_NAME" "$VERSION_CODE" "$EXPECTED_CERT" > verified/verification.json
          cat verified/verification.json >> "$GITHUB_STEP_SUMMARY"
          printf '\nDevice testing remains pending: install, font import, files, keyboard and lifecycle.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: vectorcraft-0.14.0-android.2-verified
          path: verified/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vectorcraft.jks" "$RUNNER_TEMP/aligned.apk"
