              ref25(root)
              own_pad(root)
              quit2(root)
              quit_trace4(root)
              patch5(root)
              patch6(root)
              patch7(root)
              assert 'delta.x *= -1.15;' in (dst/'src/lib.rs').read_text()
              assert 'delta.y *= -1.15;' in (dst/'src/lib.rs').read_text()
              assert 'main_looper_max_delay_ms' in (dst/'java/com/artcraft/vectorcraft/VectorCraftActivity.java').read_text()
              assert 'splashHandler.post(this::vcAndroid24RevealNativeBuffer);' not in (dst/'java/com/artcraft/vectorcraft/VectorCraftActivity.java').read_text()
              assert 'android6_early_touch_pan' in (target/'canvas/input.rs').read_text()
              assert 'scroll.y -= 2.0 * native_pan.y;' in (target/'canvas/input.rs').read_text()
              assert 'scroll.y -= early_pan.y;' in (target/'canvas/input.rs').read_text()
              assert 'trackpad_pinch_needs_anchor' in (target/'canvas/input.rs').read_text()
              assert 'delta.y = -delta.y;' in (dst/'src/lib.rs').read_text()
              rust=(dst/"src/lib.rs").read_text()
              java=(dst/"java/com/artcraft/vectorcraft/VectorCraftActivity.java").read_text()
              shortcuts=(target/"shortcuts.rs").read_text()
              assert "poll_hidden_ime_close" in rust
