          PY
          python3 -m unittest discover -s android-port/tools/vectorcraft -p 'test_*.py' -v
          rustc --edition=2021 --test android-port/tools/vectorcraft/native_pad_math.rs -o "$RUNNER_TEMP/vc-native-pad-tests"
