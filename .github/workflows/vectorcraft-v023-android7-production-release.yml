name: VectorCraft Android.7 guarded production signing and publication
# One-shot, source-locked release from owner-approved Android.7; no overwrite.
on:
  push:
    branches:
      - release-prep/vectorcraft-v023-android7-permanent-20261110
    paths:
      - .github/workflows/vectorcraft-v023-android7-production-release.yml

permissions:
  contents: write

concurrency:
  group: vectorcraft-android7-release-original-sign
  cancel-in-progress: false

jobs:
  verified-production-release:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release-prep/vectorcraft-v023-android7-permanent-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      UPSTREAM_SHA: 5d0e892e2419f63bc0ea3c743ddff2e81e15fd3a
      BUILDER_SHA: 52308fbcb26d8d8625f35fc1f048813f8e1e12a8
      VERSION_NAME: 0.23.0-android.7
      VERSION_CODE: '16783907'
      LAST_PUBLISHED_CODE: '16780813'
      APPROVED_SHA: '65056bbe58acc8ab60a83b5d3ccbdda5e5745491'
      ORIGINAL_CERT: 7fc384231187a50f7ac3d6fe45e1f0c5b728e195ef24e783b087dce0d3af93f5
      ARTCRAFT_TARGET_SDK: '35'
      ARTCRAFT_BUILD_TOOLS_VERSION: 35.0.0
      ARTCRAFT_NDK_VERSION: 27.2.12479018
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      # Strip native symbol tables but retain Release opt-level 3 / thin-LTO
      # to avoid slowing startup, painting, font import or trackpad gestures.
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - name: Check out owner Android changes (no write credentials)
        uses: actions/checkout@v5
        with:
          path: android-port
          persist-credentials: false
          fetch-depth: 2
      - name: Verify reviewed code, original signing key and release vacancy before compilation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_DATA: ${{ secrets.VECTORCRAFT_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VECTORCRAFT_KEYSTORE_PASSWORD }}
          CONFIGURED_CERT: ${{ vars.VECTORCRAFT_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test "$(git -C android-port rev-parse "$APPROVED_SHA")" = "$APPROVED_SHA"
          test "$(git -C android-port diff --name-only "$APPROVED_SHA" HEAD | wc -l)" -eq 1
          git -C android-port diff --name-only "$APPROVED_SHA" HEAD | grep -Fx '.github/workflows/vectorcraft-v023-android7-production-release.yml'
          TAG="vectorcraft-v$VERSION_NAME"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then echo "::error::Release exists"; exit 1; fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then echo "::error::Tag exists"; exit 1; fi
          test -n "$KEY_DATA" && test -n "$KEY_PASSWORD" || { echo "::error::Original VectorCraft signing secrets unavailable. STOP."; exit 1; }
          test -z "$CONFIGURED_CERT" || test "$(printf %s "$CONFIGURED_CERT" | tr '[:upper:]' '[:lower:]' | tr -d ':')" = "$ORIGINAL_CERT"
          umask 077
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          printf '%s' "$KEY_DATA" | base64 --decode > "$temp/old.jks"
          keytool -list -v -keystore "$temp/old.jks" -alias artcraftbuilder -storepass:env KEY_PASSWORD > "$temp/keyinfo.txt"
          grep -Fq PrivateKeyEntry "$temp/keyinfo.txt"
          keytool -exportcert -keystore "$temp/old.jks" -alias artcraftbuilder -storepass:env KEY_PASSWORD > "$temp/cert.der"
          test "$(sha256sum "$temp/cert.der" | cut -d' ' -f1)" = "$ORIGINAL_CERT" || { echo "::error::Original signing certificate mismatch"; exit 1; }
          echo 'PASS: Approved source unchanged; genuine original VectorCraft production private key verified'
      - name: Check out immutable Android builder
        uses: actions/checkout@v5
        with:
          repository: MostafaXS1/artcraft-android
          ref: 52308fbcb26d8d8625f35fc1f048813f8e1e12a8
          path: builder
          persist-credentials: false
      - name: Check out official VectorCraft v0.23.0
        uses: actions/checkout@v5
        with:
          repository: storytold/vectorcraft
          ref: 5d0e892e2419f63bc0ea3c743ddff2e81e15fd3a
          path: builder/source/vectorcraft
          persist-credentials: false
      - name: Enforce source, version, signing and test-only gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$BUILDER_SHA"
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$VERSION_CODE" -gt "$LAST_PUBLISHED_CODE"
          test ! -e builder/keys/artcraft-builder.jks
          test ! -e android-port/keys/artcraft-builder.jks
          grep -q '^version = "0.23.0"' builder/source/vectorcraft/Cargo.toml
          python3 -m py_compile android-port/tools/vectorcraft/patch_android7_trackpad_relaunch.py android-port/tools/vectorcraft/patch_android6_touch_canvas.py android-port/tools/vectorcraft/patch_android5_first_pinch_menu.py android-port/tools/vectorcraft/patch_android4_quit_trace.py android-port/tools/vectorcraft/patch_android2_native_quit.py android-port/tools/vectorcraft/patch_android1_native_trackpad.py android-port/tools/vectorcraft/patch_stability_v021.py android-port/tools/vectorcraft/patch_vc_icon_menu_v021.py android-port/tools/vectorcraft/patch_smooth_menu_scroll_v021.py android-port/tools/vectorcraft/patch_android12_keyboard.py android-port/tools/vectorcraft/patch_android12_startup.py android-port/tools/vectorcraft/patch_android12_menu_scroll.py android-port/tools/vectorcraft/patch_android13_recovery.py android-port/tools/vectorcraft/patch_android13_menu_scroll.py android-port/tools/vectorcraft/patch_android14_diagnostic_session.py android-port/tools/vectorcraft/patch_android15_modal_keys.py android-port/tools/vectorcraft/patch_android16_modal_frame.py android-port/tools/vectorcraft/patch_android17_reference_adoption.py android-port/tools/vectorcraft/patch_android18_modal_and_gestures.py android-port/tools/vectorcraft/patch_android19_reference_ime.py android-port/tools/vectorcraft/patch_android20_native_keyboard_splash.py android-port/tools/vectorcraft/patch_android21_photocraft_parity.py android-port/tools/vectorcraft/patch_android22_high_refresh.py android-port/tools/vectorcraft/patch_android23_input_boot.py android-port/tools/vectorcraft/patch_android23_font_fastpath.py android-port/tools/vectorcraft/patch_android24_startup_menu.py android-port/tools/vectorcraft/patch_android25_reference_gestures.py
          # Dry-run generated Android overlays on reviewed files BEFORE NDK install.
          # This keeps stale Java/Rust source anchors from burning build minutes.
          python3 - <<'PY'
          from pathlib import Path
          import shutil, tempfile, sys
          sys.path.insert(0, "android-port/tools/vectorcraft")
          from patch_stability_v021 import patch_adapter, patch_dialog, patch_startup
          from patch_android12_keyboard import patch as keyboard12
