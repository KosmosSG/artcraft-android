      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Reuse only an official, SHA-256 verified Gradle ZIP; avoid another
      # 20-minute Rust compile ending in a Gradle download HTTP 504.
      - name: Restore Gradle 8.11.1 distribution cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vectorcraft-gradle/gradle-8.11.1-bin.zip
          key: vectorcraft-gradle-8.11.1-bin-f397b287-v1
      - name: Prefetch and verify Gradle 8.11.1 before ARM64 compilation
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_SHA="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
          CACHE="$HOME/.cache/vectorcraft-gradle"
          ZIP="$CACHE/gradle-8.11.1-bin.zip"
          mkdir -p "$CACHE"
          if ! (test -s "$ZIP" && echo "$GRADLE_SHA  $ZIP" | sha256sum --check --status); then
            rm -f "$ZIP" "$ZIP.part"
            ok=0
            for source in \
              "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip" \
              "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"; do
              for attempt in 1 2 3; do
                echo "Gradle 8.11.1 fetch attempt $attempt: $source"
                if curl --fail --location --silent --show-error \
                    --retry 2 --retry-all-errors --retry-delay 3 \
                    --connect-timeout 20 --max-time 300 \
                    --output "$ZIP.part" "$source" \
                    && echo "$GRADLE_SHA  $ZIP.part" | sha256sum --check --status; then
                  mv "$ZIP.part" "$ZIP"
                  ok=1
                  break 2
                fi
                rm -f "$ZIP.part"
              done
            done
            if [[ "$ok" -ne 1 ]]; then
              echo "::error::Pinned Gradle ZIP unavailable/mismatched; aborting before expensive Rust compilation"
              exit 1
            fi
          fi
          echo "$GRADLE_SHA  $ZIP" | sha256sum --check
          # Pinned builder copies templates/gradle to the generated launcher.
          # Modify only this disposable checkout; no permanent release changes.
          python3 - "$ZIP" "$GRADLE_SHA" <<'PY'
          from pathlib import Path
          import sys
          zip_path=Path(sys.argv[1]).resolve()
          expected=sys.argv[2]
          props=Path("builder/templates/gradle/gradle/wrapper/gradle-wrapper.properties")
          original=props.read_text()
          remote=r"distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
          assert original.count(remote)==1, "Unreviewed Gradle wrapper template; refuse modification"
          uri=zip_path.as_uri().replace(":",r"\:")
          updated=original.replace(remote,"distributionUrl="+uri)
          assert "distributionSha256Sum=" not in updated
          updated+="distributionSha256Sum="+expected+"\n"
          props.write_text(updated)
          assert "distributionUrl=file\:///" in updated
          print("PASS: official SHA-256 Gradle 8.11.1 ZIP; local wrapper URL; no late remote download")
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android 35, tools and NDK 27.2 once
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Stage owner adapter and reviewed upstream v0.21 patches
        shell: bash
        run: |
          set -euo pipefail
          # Catch Java SDK mismatches before the expensive ARM64 Rust build.
          grep -Fq 'import android.view.PixelCopy;' android-port/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          ! grep -Fq 'import android.graphics.PixelCopy;' android-port/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          javap -classpath "$ANDROID_HOME/platforms/android-35/android.jar" android.view.PixelCopy >/dev/null
          echo "PASS: SDK 35 PixelCopy import and class verified"
          rm -rf builder/adapters/vectorcraft
          cp -a android-port/adapters/vectorcraft builder/adapters/vectorcraft
          python3 android-port/tools/vectorcraft/patch_android_menus_v020.py builder
          python3 android-port/tools/vectorcraft/patch_vc_icon_menu_v021.py builder
          python3 android-port/tools/vectorcraft/patch_android_about_updates.py builder
          # The builder replaces upstream android-activity and winit during the full APK build.
          # Its native-activity 0.6.1 lacked classification() despite winit calling it.
          # Safely resolve the Android API-29+ symbol at runtime; on API 28 return None.
          python3 android-port/tools/vectorcraft/patch_android_native_classification.py builder
          # VectorCraft v0.21's official egui-winit expects Storytold winit's
          # ImeResetCompleted and reset_ime_with_request APIs; this builder's
          # older vendored winit has neither. Preserve all custom touch/mouse
          # code while adding exactly the upstream public IME interface.
          python3 android-port/tools/vectorcraft/patch_android_winit_ime_v020.py builder
          # The reference builder copies adapters/vectorcraft again during packaging.
          # Patch THAT source, not only the compatibility check's temporary apps crate.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"android-port/tools/vectorcraft")
          from patch_android_adapter_v020 import patch_staged_source
          manifest=Path("builder/source/vectorcraft/Cargo.toml").read_text()
          path=Path("builder/adapters/vectorcraft/src/lib.rs")
          path.write_text(patch_staged_source(manifest,path.read_text()))
          print("PASS: v0.21 MIME filters and input hook fixed in builder-owned Android adapter")
          PY
          python3 android-port/tools/vectorcraft/patch_stability_v021.py builder
          python3 android-port/tools/vectorcraft/patch_android24_startup_menu.py builder
          python3 android-port/tools/vectorcraft/patch_android24_startup_menu.py builder --install-backend-hook
          python3 android-port/tools/vectorcraft/patch_android25_reference_gestures.py builder
          python3 android-port/tools/vectorcraft/patch_android25_reference_gestures.py builder --install-hook
          python3 android-port/tools/vectorcraft/patch_android1_native_trackpad.py builder
          python3 android-port/tools/vectorcraft/patch_android2_native_quit.py builder
          python3 android-port/tools/vectorcraft/patch_android4_quit_trace.py builder
          python3 android-port/tools/vectorcraft/patch_android5_first_pinch_menu.py builder
          python3 android-port/tools/vectorcraft/patch_android6_touch_canvas.py builder
          python3 android-port/tools/vectorcraft/patch_android7_trackpad_relaunch.py builder
          python3 android-port/tools/vectorcraft/patch_android1_native_trackpad.py builder --install-hook
          python3 android-port/tools/vectorcraft/prepare_builder.py builder "$VERSION_NAME" "$VERSION_CODE"
          # Android.3: the real Vc mark is the clickable top-left menu,
          # native launch window is brand maroon, and icon safe-zone padding
          # applies to both Android adaptive and legacy mipmaps.
          # VectorCraft NativeActivity needs no AppCompat, Kotlin or
          # GameActivity. Do not pull them into the final DEX/resources.
          python3 android-port/tools/vectorcraft/patch_compact_apk_v020.py builder android-port
          # Fail *before* expensive ARM64 Rust compilation if the generated
          # Gradle theme still points to AppCompat after its dependency removal.
          python3 - <<'PY'
          from pathlib import Path
          source=Path("builder/lib/android_project.py").read_text()
          assert 'parent="android:style/Theme.Material.NoActionBar"' in source
          assert 'parent="Theme.SplashScreen"' in source
          assert "implementation 'androidx.core:core-splashscreen:1.0.1'" in source
          assert 'postSplashScreenTheme' in source
          assert 'parent="Theme.AppCompat.NoActionBar"' not in source
          assert "implementation 'androidx.appcompat:" not in source
          assert "implementation 'androidx.games:" not in source
          assert 'android:windowFullscreen' in source
          print("PASS: no native launcher AppCompat theme mismatch before compile")
          PY
          # Reuse unchanged system-font symlink layout across cold launches
          # without affecting native font fallbacks or SAF imported fonts.
          python3 android-port/tools/vectorcraft/patch_cached_system_fonts_v020.py builder
          python3 android-port/tools/vectorcraft/patch_android23_font_fastpath.py builder
          grep -Fq 'vectorcraft_android24.py' builder/lib/build-common.sh
          grep -Fq 'vectorcraft_android25.py' builder/lib/build-common.sh
          grep -Fq 'vectorcraft_android1_trackpad.py' builder/lib/build-common.sh
          grep -Fq 'vc_pad_diagnostics()' builder/adapters/vectorcraft/src/lib.rs
          grep -Fq 'VC_QUIT_ANDROID2 stage=native_loop_returned' builder/adapters/vectorcraft/src/lib.rs
          grep -Fq 'android25_after_native_onCreate' builder/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          grep -Fq 'vcAndroid24RevealNativeBuffer' builder/adapters/vectorcraft/java/com/artcraft/vectorcraft/VectorCraftActivity.java
          # Only this disposable candidate gets a separate application ID.
          # Keep stable Java/JNI namespace, original Android source and signing key unchanged.
          # Preserve original production application ID; only the test variant changes it.
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          d=tomllib.loads(Path("builder/adapters/vectorcraft/Cargo.toml").read_text())["package"]["metadata"]["android"]
          assert d["package"] == "com.artcraft.vectorcraft"
          assert d["application"]["label"] == "VectorCraft"
          assert d["build_targets"] == ["aarch64-linux-android"]
          print("PASS: Original production application ID, launcher and ARM64 only")
          PY
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          # Owner supplied a NEW flat Vc artwork; the previous glossy approved
          # icon is preserved for older releases but must not enter this candidate.
          python3 android-port/tools/vectorcraft/render_owner_icon.py \
            android-port/assets/branding/vectorcraft/vc-owner-20261103.svg \
            "$RUNNER_TEMP/vectorcraft-test-icon.png"
          python3 - "$RUNNER_TEMP/vectorcraft-test-icon.png" <<'PY'
          from PIL import Image
          import sys
          icon=Image.open(sys.argv[1]).convert("RGBA")
          assert icon.size==(1024,1024) and icon.getpixel((0,0))[3]==0
          assert icon.getpixel((512,80))[:3]==(45,0,0)
          orange=icon.getpixel((420,450))
          assert orange[0]>180 and orange[1]>70 and orange[2]<80
          print("PASS: owner dark-maroon/orange Vc artwork and transparent corners")
          PY
          python3 android-port/tools/vectorcraft/adaptive_safe.py builder vectorcraft
          python3 android-port/tools/vectorcraft/install_android_brand.py builder "$RUNNER_TEMP/vectorcraft-test-icon.png"
          grep -Fq 'self.inner.raw_input_hook(ctx, raw);' builder/adapters/vectorcraft/src/lib.rs
      - name: Behavioral gates on generated code before ARM64 compilation
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo test --manifest-path builder/source/vectorcraft/Cargo.toml -p vectorcraft-ui-egui --lib android_stability --no-default-features
          python3 android-port/tools/vectorcraft/run_staged_input_tests.py builder
      - name: Recompile approved Android.7 source for original production package
        shell: bash
        timeout-minutes: 125
        run: |
          set -euo pipefail
          # The latest Mostafa builder auto-updates to upstream v0.22.0 by default,
          # which discards our reviewed v0.23.0 owner UI/keyboard overlays.
          # --noupdate is a supported builder flag: pin the tested upstream commit.
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -f builder/adapters/vectorcraft/src/ime_bridge.rs
          test -f builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'pub fn set_android_preferences(' builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'pub fn take_android_menu_bits()' builder/source/vectorcraft/crates/ui-egui/src/menus.rs
          grep -Fq 'fn android_owner_unsaved_key(' builder/source/vectorcraft/crates/ui-egui/src/shortcuts.rs
          grep -Fq 'vectorcraft_android1_trackpad.py' builder/lib/build-common.sh
          bash builder/build.sh -vectorcraft --noupdate "-appicon=$RUNNER_TEMP/vectorcraft-test-icon.png"
          test "$(git -C builder/source/vectorcraft rev-parse HEAD)" = "$UPSTREAM_SHA"
          test "$(find builder/output -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
      - name: Check ARM64 production payload, sign with ORIGINAL key and verify
        shell: bash
        env:
          KEY_DATA: ${{ secrets.VECTORCRAFT_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VECTORCRAFT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          SRC="$(find builder/output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$SRC"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" verify --verbose "$SRC" >/dev/null
          "$AAPT" dump badging "$SRC" > "$RUNNER_TEMP/vc-badging.txt"
          python3 - "$SRC" "$RUNNER_TEMP/vc-badging.txt" <<'PY'
          import os,re,sys,zipfile
          from pathlib import Path
          b=Path(sys.argv[2]).read_text()
          m=re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",b,re.M)
          assert m and m.groups()==("com.artcraft.vectorcraft",os.environ["VERSION_CODE"],os.environ["VERSION_NAME"]),m
          assert re.search(r"^launchable-activity: name='com\.artcraft\.vectorcraft\.VectorCraftActivity'",b,re.M)
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              libs=[x for x in z.namelist() if x.startswith("lib/") and x.endswith(".so")]
              assert "lib/arm64-v8a/libvectorcraft_android.so" in libs
              assert all(x.startswith("lib/arm64-v8a/") for x in libs)
          print("PASS: Production package/version, ARM64 native payload, Java launcher")
          PY
          printf '%s' "$KEY_DATA" | base64 --decode > "$RUNNER_TEMP/vc-prod.jks"
          trap 'rm -f "$RUNNER_TEMP/vc-prod.jks" "$RUNNER_TEMP/vc-unsigned.apk" "$RUNNER_TEMP/vc-aligned.apk" "$RUNNER_TEMP/vc-badging.txt"' EXIT
          python3 - "$SRC" "$RUNNER_TEMP/vc-unsigned.apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a,zipfile.ZipFile(sys.argv[2],"w") as b:
              for x in a.infolist():
                  if not x.filename.upper().startswith("META-INF/"): b.writestr(x,a.read(x.filename))
          PY
          "$ZIPALIGN" -P 16 -f 4 "$RUNNER_TEMP/vc-unsigned.apk" "$RUNNER_TEMP/vc-aligned.apk"
          mkdir -p signed
          APK="signed/VectorCraft-v$VERSION_NAME-arm64-v8a.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/vc-prod.jks" --ks-key-alias artcraftbuilder \
            --ks-pass env:KEY_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false \
            --out "$APK" "$RUNNER_TEMP/vc-aligned.apk"
          python3 android-port/tools/vectorcraft/verify_apk.py "$APK" "$AAPT" "$APKSIGNER" "$VERSION_NAME" "$VERSION_CODE" "$ORIGINAL_CERT" > signed/verification.json
          (cd signed && sha256sum "VectorCraft-v$VERSION_NAME-arm64-v8a.apk" > SHA256SUMS.txt)
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("signed/verification.json"); d=json.loads(p.read_text())
          assert d["package"]=="com.artcraft.vectorcraft" and d["version_code"]==int(os.environ["VERSION_CODE"])
          assert d["certificate_sha256"]==os.environ["ORIGINAL_CERT"]
          assert d["apk_sha256"] in Path("signed/SHA256SUMS.txt").read_text()
          d["approved_test_source_sha"]=os.environ["APPROVED_SHA"]
          d["approved_test_run"]=42774514941
          d["owner_device_attestation"]="Test Android.7 variant approved on HONOR MagicPad 4; production-package install not independently tested."
          p.write_text(json.dumps(d,indent=2)+"\n")
          print("PASS: Original production certificate continuity and cryptographic APK integrity")
          PY
      - name: Upload verified permanently signed build without overwriting older releases
        uses: actions/upload-artifact@v4
        with:
          name: VectorCraft-v0.23.0-android.7-ORIGINAL-KEY-SIGNED
          path: signed/
          if-no-files-found: error
          retention-days: 30
      - name: Upload draft, verify asset checksum, THEN publish NEW VectorCraft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="vectorcraft-v$VERSION_NAME"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then echo "::error::Release exists, refusing overwrite"; exit 1; fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then echo "::error::Tag exists, refusing overwrite"; exit 1; fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          # VectorCraft v0.23.0-android.7 (ARM64)

          Unofficial Android port integrating Storytold VectorCraft v0.23.0.

          Improvements include two-finger trackpad canvas panning, pinch zoom, touchscreen scrolling, relaunch responsiveness, and preserved fonts, compact menu, updater, shortcuts, ESC, Ctrl+W D/S/C and approved icon.
          
          Device approved: HONOR MagicPad 4, temporary-key Android.7 test APK.
          Production build: package com.artcraft.vectorcraft, ARM64, original release certificate SHA-256 7fc384231187a50f7ac3d6fe45e1f0c5b728e195ef24e783b087dce0d3af93f5; original signing and APK integrity independently verified in GitHub Actions. The production-package APK has not been installed on-device before publication.
          Back up documents before upgrading. All previous published releases remain available.
          NOTES
          gh release create "$TAG" signed/*.apk signed/SHA256SUMS.txt signed/verification.json \
            --repo "$GITHUB_REPOSITORY" --target "$APPROVED_SHA" --draft \
            --title "VectorCraft v$VERSION_NAME — Android ARM64" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            | jq -e '.isDraft == true and (.assets | length) == 3' >/dev/null
          mkdir -p "$RUNNER_TEMP/verify-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "VectorCraft-v$VERSION_NAME-arm64-v8a.apk" --dir "$RUNNER_TEMP/verify-release"
          expected="$(cut -d' ' -f1 signed/SHA256SUMS.txt)"
          actual="$(sha256sum "$RUNNER_TEMP/verify-release/VectorCraft-v$VERSION_NAME-arm64-v8a.apk" | cut -d' ' -f1)"
          test "$actual" = "$expected" || { echo "::error::Published asset hash mismatch; DRAFT remains"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName \
            | jq -e --arg tag "$TAG" '.isDraft == false and .tagName == $tag' >/dev/null
          echo "PASS: Brand-new VectorCraft production release published; previous versions preserved"
      - name: Destroy transient builder and production signing materials
        if: always()
        shell: bash
        run: |
          rm -rf builder/keys
          rm -f "$RUNNER_TEMP/vc-prod.jks" "$RUNNER_TEMP/vc-unsigned.apk" "$RUNNER_TEMP/vc-aligned.apk"
