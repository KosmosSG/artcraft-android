              from patch_android_menus_v020 import add_vc_menu, insert_once
              tree=target/"menus/tree.rs"
              tree_src=add_vc_menu(tree.read_text())
              tree_src=insert_once(tree_src,
                  '            "Help",\n            vec![\n                c("Join Our Discord", "help.discord"),',
                  '            "Help",\n            vec![\n                #[cfg(target_os = "android")]\n                c("Graphics Diagnostics…", "android.vectorcraft.diagnostics"),\n                #[cfg(target_os = "android")]\n                Sep,\n                c("Join Our Discord", "help.discord"),',
                  "Help diagnostics dry-run")
              tree.write_text(tree_src)
              run=target/"menus/run.rs"
              original='pub fn run_ui_command(app: &mut VectorcraftApp, id: &str, p: &Value) -> Option<Result<Value, String>> {\n'
              source=run.read_text()
              synthetic = '    #[cfg(target_os = "android")]\n    {\n        let bit = match id {\n            "android.vectorcraft.diagnostics" => 64,\n            _ => 0,\n        };\n        if bit != 0 { return Some(Ok(Value::Null)); }\n    }\n'
              source=insert_once(source, original, original+synthetic, "Android run command dry-run")
              run.write_text(source)
              keyboard_diag(root)
              keyboard12(root)
              startup12(root)
              scroll12(root)
              recovery13(root)
              scroll13(root)
              diagnostic14(root)
              modal15(root)
              modal16(root)
              reference17(root)
              android18(root)
              android19(root)
              android20(root)
              photocraft21(root)
