          from patch_android12_menu_scroll import patch as scroll12
          from patch_android13_recovery import patch as recovery13
          from patch_android13_menu_scroll import patch as scroll13
          from patch_keyboard_diagnostics_v021 import patch as keyboard_diag
          from patch_android14_diagnostic_session import patch as diagnostic14
          from patch_android15_modal_keys import patch as modal15
          from patch_android16_modal_frame import patch as modal16
          from patch_android17_reference_adoption import patch as reference17
          from patch_android18_modal_and_gestures import patch as android18
          from patch_android19_reference_ime import patch as android19
          from patch_android20_native_keyboard_splash import patch as android20
          from patch_android21_photocraft_parity import patch as photocraft21
          from patch_android22_high_refresh import patch as refresh22
          from patch_android23_input_boot import patch as input23
          from patch_android23_font_fastpath import patch as fonts23
          from patch_android24_startup_menu import patch as input24, patch_winit as backend24
          from patch_android25_reference_gestures import patch_staged as ref25, restore_winit as restore25
          from patch_android1_native_trackpad import patch_staged as own_pad, patch_winit as own_pad_winit
          from patch_android2_native_quit import patch as quit2
          from patch_android4_quit_trace import patch as quit_trace4
