name: WordCraft android.6 permanent signing (manual; NO publication)

on:
  workflow_dispatch:
    inputs:
      expected_certificate_sha256:
        description: "Original WordCraft signing certificate SHA-256 (64 hex characters, no colons)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordcraft-production-sign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-candidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      WORDCRAFT_UPSTREAM_COMMIT: 2e6db0bd88795e80375176c01665cff7dbe2b057
      WORDCRAFT_BUILDER_COMMIT: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
      WORDCRAFT_VERSION_NAME: 0.9.0-android.6
      WORDCRAFT_CANDIDATE_VERSION_CODE: "100000006"
      WORDCRAFT_PACKAGE: com.artcraft.wordcraft

    steps:
      - name: Checkout exact device-tested WordCraft candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 061837c6923d161bffd1709072bbce4a37aa3e0c
          persist-credentials: false

      - name: Checkout pinned reference builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false

      - name: Checkout pinned stable WordCraft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: storytold/wordcraft
          ref: 2e6db0bd88795e80375176c01665cff7dbe2b057
          path: builder/source/wordcraft
          persist-credentials: false

      - name: Confirm stable tag, exact commits, isolated input and icon digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$WORDCRAFT_BUILDER_COMMIT"
          test "$(git -C builder/source/wordcraft rev-parse HEAD)" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -z "$(git -C builder/source/wordcraft status --porcelain)"
          tag_commit="$(git ls-remote https://github.com/storytold/wordcraft.git refs/tags/v0.9.0 | awk '{print $1}')"
          test "$tag_commit" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -s tools/approved-branding/assets/WordCraft.png

      - name: Set up Java, Rust and Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          java -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          # GitHub's Ubuntu image may have SDK command-line tools installed but not on PATH.
          # Look only under the runner's Android SDK; do not download unverified installers.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "::error::Android SDK root not found"; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ ! -x "$sdkmanager_bin" && -x "$sdk_root/tools/bin/sdkmanager" ]]; then
            sdkmanager_bin="$sdk_root/tools/bin/sdkmanager"
          fi
          test -x "$sdkmanager_bin" || { echo "::error::Android SDK command-line tools missing: install them in a reviewed follow-up"; exit 1; }
          "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 -m venv /tmp/wordcraft-icon-env
          /tmp/wordcraft-icon-env/bin/pip install "Pillow==11.3.0"
          echo "/tmp/wordcraft-icon-env/bin" >> "$GITHUB_PATH"

      - name: Generate candidate launcher icon from approved WordCraft PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("tools/approved-branding/assets/WordCraft.png")
          target = Path("wordcraft/android/icon/wordcraft-approved-192.png")
          with Image.open(source) as image:
              assert image.width >= 192 and image.height >= 192, "Approved artwork too small"
              image.convert("RGBA").resize((192, 192), Image.Resampling.LANCZOS).save(target)
          print("Candidate icon generated from tools/approved-branding/assets/WordCraft.png")
          PY

      - name: Test native menu patch and launcher mask borders against pinned sources
        run: |
          mkdir -p wordcraft/android/reference
          cp builder/lib/build-common.sh wordcraft/android/reference/build-common.sh
          cp builder/lib/app_icons.py wordcraft/android/reference/app_icons.py
          cp builder/templates/android/SafActivity.java wordcraft/android/reference/SafActivity.java
          cp builder/templates/android/system_fonts.rs wordcraft/android/reference/system_fonts.rs
          cp builder/source/wordcraft/crates/ui-egui/src/dialogs.rs wordcraft/android/reference/dialogs.rs
          cp builder/source/wordcraft/crates/ui-egui/src/ribbon.rs wordcraft/android/reference/ribbon.rs
          python3 -m unittest discover -s wordcraft/android -p 'test_revision.py' -v

      - name: Apply isolated Android-only candidate version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # These changes are confined to ephemeral checkouts, never upstream or suite main.
          source = Path('builder/source/wordcraft/Cargo.toml')
          s = source.read_text()
          old = 'version = "0.9.0"'
          assert s.count(old) == 1, 'Review new upstream manifest before changing version'
          source.write_text(s.replace(old, 'version = "0.9.0-android.6"', 1))
          project = Path('builder/lib/android_project.py')
          p = project.read_text()
          formula = 'return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert p.count(formula) == 1, 'Version-code override location changed: stop'
          project.write_text(p.replace(formula, 'return 100000006', 1))
          print('Candidate metadata set: 0.9.0-android.6 / 100000006')
          PY
          git -C builder/source/wordcraft diff -- Cargo.toml
          git -C builder diff -- lib/android_project.py

      - name: Test asynchronous font refresh feedback
        run: |
          rustc --edition=2024 --test wordcraft/android/refresh_feedback.rs -o /tmp/wordcraft-refresh-tests
          /tmp/wordcraft-refresh-tests

      - name: Integrate WordCraft persistent font import (isolated builder only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_builder.py
          python3 wordcraft/android/patch_builder.py builder

      - name: Compile candidate with per-run temporary builder key
        shell: bash
        timeout-minutes: 60
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          python3 wordcraft/android/adaptive_safe.py builder wordcraft
          cd builder
          bash build.sh -wordcraft -appicon="$GITHUB_WORKSPACE/wordcraft/android/icon/wordcraft-approved-192.png"
          test -s output/wordcraft-0.9.0-android.6.apk

      - name: Check compiled APK package, ARM64, version, icon, signature and hash
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/builder/output/wordcraft-0.9.0-android.6.apk"
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              libs = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs), libs
              assert any(n.startswith('res/') and n.lower().endswith(('.png', '.webp')) for n in names), 'Packaged raster resources missing'
              # AAPT2 compiles adaptive-icon XML to a binary resource entry with
              # an optimized filename; verify the resource table below instead.
              assert 'classes.dex' in names, 'Android Java bridge missing'
          print('Archive checks: ARM64 libraries, icon resources, Java DEX found')
          PY
          # AAPT2 may rename/optimize packaged PNG paths; assert the generated
          # source artwork AND compiled resource-table identifiers instead.
          icon_res="builder/source/wordcraft/apps/wordcraft-android/res"
          test -s "$icon_res/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$icon_res/drawable-xxxhdpi/ic_launcher_foreground.png"
          test -s "$icon_res/mipmap-anydpi-v26/ic_launcher.xml"
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$aapt2" dump resources "$apk" > /tmp/wordcraft-packed-resources.txt
          grep -F "mipmap/ic_launcher" /tmp/wordcraft-packed-resources.txt
          grep -F "drawable/ic_launcher_foreground" /tmp/wordcraft-packed-resources.txt
          badging="$("$aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "name='com.artcraft.wordcraft'"
          printf '%s\n' "$badging" | grep -F "versionCode='100000006'"
          printf '%s\n' "$badging" | grep -F "versionName='0.9.0-android.6'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk"
          echo "Ephemeral candidate verified, NOT a permanent signing, device test, or public release."

      - name: Verify existing WordCraft signing secrets and certificate
        shell: bash
        env:
          WORDCRAFT_KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_KEYSTORE_BASE64 }}
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          WORDCRAFT_KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          WORDCRAFT_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ inputs.expected_certificate_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$WORDCRAFT_KEYSTORE_BASE64" || { echo "::error::Missing WORDCRAFT_KEYSTORE_BASE64"; exit 1; }
          test -n "$WORDCRAFT_KEYSTORE_PASSWORD" || { echo "::error::Missing WORDCRAFT_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$WORDCRAFT_KEY_ALIAS" || { echo "::error::Missing WORDCRAFT_KEY_ALIAS"; exit 1; }
          test -n "$WORDCRAFT_KEY_PASSWORD" || { echo "::error::Missing WORDCRAFT_KEY_PASSWORD"; exit 1; }
          [[ "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Expected original signing certificate SHA-256 required"; exit 1; }
          printf '%s' "$WORDCRAFT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wordcraft-release.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/wordcraft-release.jks" -alias "$WORDCRAFT_KEY_ALIAS" -storepass "$WORDCRAFT_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/wordcraft-cert-info.txt"
          actual="$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/wordcraft-cert-info.txt" | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected" || { echo "::error::WordCraft certificate mismatch. Refusing to sign."; exit 1; }
          echo "WordCraft original certificate fingerprint matches approved input."

      - name: Permanently sign and verify WordCraft APK (no publish)
        shell: bash
        env:
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          WORDCRAFT_KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          WORDCRAFT_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ inputs.expected_certificate_sha256 }}
        run: |
          set -euo pipefail
          apk="builder/output/wordcraft-0.9.0-android.6.apk"
          test -s "$apk"
          signed="WordCraft-v0.9.0-android.6-arm64-v8a.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/wordcraft-release.jks" \
            --ks-key-alias "$WORDCRAFT_KEY_ALIAS" \
            --ks-pass env:WORDCRAFT_KEYSTORE_PASSWORD \
            --key-pass env:WORDCRAFT_KEY_PASSWORD \
            --out "$signed" "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/wordcraft-signed-verify.txt"
          actual="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/wordcraft-signed-verify.txt" | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected" || { echo "::error::Final APK certificate mismatch"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$signed" | grep -F "name='com.artcraft.wordcraft'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$signed" | grep -F "versionCode='100000006'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$signed" | grep -F "versionName='0.9.0-android.6'"
          sha256sum "$signed"

      - name: Upload permanently signed APK for owner testing (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wordcraft-android6-PERMANENT-SIGNED-owner-test
          path: WordCraft-v0.9.0-android.6-arm64-v8a.apk
          retention-days: 7
          if-no-files-found: error

      - name: Erase temporary key and local APK after artifact staging
        if: always()
        shell: bash
        run: |
          rm -rf builder/keys
          rm -rf builder/output
          rm -f "$RUNNER_TEMP/wordcraft-release.jks" "$RUNNER_TEMP/wordcraft-cert-info.txt" "$RUNNER_TEMP/wordcraft-signed-verify.txt"
          echo 'Signing key material erased; no release published.'
