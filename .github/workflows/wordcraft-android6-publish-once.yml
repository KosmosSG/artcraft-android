name: Publish verified WordCraft v0.9.0-android.6 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wordcraft-android6-publish-once.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: wordcraft-android6-publish-once
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'KosmosSG/artcraft-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: wordcraft-v0.9.0-android.6
      RUN_ID: '41331380906'
      EXPECTED_SOURCE_COMMIT: 061837c6923d161bffd1709072bbce4a37aa3e0c
      EXPECTED_SIGNING_CERT: C05372EA57ECF5571A7AC27716179606A2A1A8E57F213D1E3E8BEB41F4360B65
      APK: WordCraft-v0.9.0-android.6-arm64-v8a.apk
    steps:
      - name: Check published-release idempotency and pin signed build run
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to alter it."
            exit 1
          fi
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          test "$(jq -r '.status' <<<"$json")" = completed
          test "$(jq -r '.conclusion' <<<"$json")" = success
          test "$(jq -r '.head_sha' <<<"$json")" = 7455cd8d061c99560a219697332a297123a9ee27
          test "$(jq -r '.path' <<<"$json" | sed 's#^.*\.github/#.github/#')" = '.github/workflows/wordcraft-android6-permanent-sign.yml'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SOURCE_COMMIT" --jq '.sha')" = "$EXPECTED_SOURCE_COMMIT"
      - name: Download the exact permanently signed owner-test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n wordcraft-android6-PERMANENT-SIGNED-owner-test -D publish
          test -s "publish/$APK"
          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Verify original signing certificate, package, version and ARM64 before publication
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$aapt"
          "$apksigner" verify --verbose --print-certs "publish/$APK" > publish/signature-check.txt
          actual="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' publish/signature-check.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Observed public APK signing certificate SHA-256: $actual"
          echo "Expected recovered-key certificate SHA-256: $EXPECTED_SIGNING_CERT"
          test "$actual" = "$EXPECTED_SIGNING_CERT" || { echo "::error::Signing certificate mismatch; publication blocked"; exit 1; }
          "$aapt" dump badging "publish/$APK" > publish/badging.txt
          grep -F "name='com.artcraft.wordcraft'" publish/badging.txt
          grep -F "versionCode='100000006'" publish/badging.txt
          grep -F "versionName='0.9.0-android.6'" publish/badging.txt
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          apk=Path("publish")/os.environ["APK"]
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              libs=[n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs and all(n.startswith("lib/arm64-v8a/") for n in libs), libs
              assert "classes.dex" in z.namelist()
          print("PASS: ARM64 library/DEX integrity")
          PY
          (cd publish && sha256sum "$APK" > SHA256SUMS.txt)
          cat > publish/RELEASE_NOTES.md <<'NOTES'
          WordCraft v0.9.0-android.6 — permanently signed ARM64 Android release.

          - Fix D / C / S shortcuts in the unsaved-changes confirmation (Don't Save / Cancel / Save).
          - Restore hardware-keyboard focus when the modal opens; no manual tap on its title bar required.
          - Keep the dialog's touch actions and Ctrl+N new-document shortcut.
          - Include the reviewed WordCraft Android font-import and launcher-icon updates.
          - Signed with the previously used WordCraft release certificate for in-place upgrades.

          Device: ARM64 Android (including HONOR MagicPad 4).
          Package: com.artcraft.wordcraft.
          Version code: 100000006.
          Build: GitHub Actions run 41331380906, using reviewed source 061837c6923d161bffd1709072bbce4a37aa3e0c.
          NOTES
      - name: Publish public stable WordCraft release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "publish/$APK" \
            publish/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_SOURCE_COMMIT" \
            --title "WordCraft v0.9.0-android.6" \
            --notes-file publish/RELEASE_NOTES.md \
            --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
