name: WordCraft v0.15.2-android.3 ORIGINAL KEY SIGN AND PUBLISH

on:
  push:
    branches:
      - feature/wordcraft-inapp-updater-test-20261107
    paths:
      - '.github/workflows/wordcraft-v0152-android3-permanent-publish-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: wordcraft-v0152-android3-permanent-publish
  cancel-in-progress: false

jobs:
  isolated-candidate:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/feature/wordcraft-inapp-updater-test-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT: C05372EA57ECF5571A7AC27716179606A2A1A8E57F213D1E3E8BEB41F4360B65
      TAG: wordcraft-v0.15.2-android.3
      APK: WordCraft-v0.15.2-android.3-arm64-v8a.apk
      APP: wordcraft
      PACKAGE: com.artcraft.wordcraft
      VERSION: 0.15.2-android.3
      VERSION_CODE: '100015203'
      WORDCRAFT_UPSTREAM_COMMIT: edfea68101220c9bdc4b2b0ccf4acd9612bedb6e
      WORDCRAFT_BUILDER_COMMIT: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
      WORDCRAFT_VERSION_NAME: 0.15.2-android.3
      WORDCRAFT_CANDIDATE_VERSION_CODE: "100015203"
      WORDCRAFT_PACKAGE: com.artcraft.wordcraft

    steps:
      - name: Checkout WordCraft-only candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout pinned reference builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false

      - name: Checkout pinned stable WordCraft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: storytold/wordcraft
          ref: edfea68101220c9bdc4b2b0ccf4acd9612bedb6e
          path: builder/source/wordcraft
          persist-credentials: false

      - name: Refuse existing release or tag before consuming build minutes
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already published; refusing to overwrite"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi

      - name: Confirm stable tag, exact commits, isolated input and icon digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$WORDCRAFT_BUILDER_COMMIT"
          test "$(git -C builder/source/wordcraft rev-parse HEAD)" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -z "$(git -C builder/source/wordcraft status --porcelain)"
          tag_commit="$(git ls-remote https://github.com/storytold/wordcraft.git refs/tags/v0.15.2 | awk '{print $1}')"
          test "$tag_commit" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -s tools/approved-branding/assets/WordCraft.png

      - name: Set up Java, Rust and Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          java -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          # GitHub's Ubuntu image may have SDK command-line tools installed but not on PATH.
          # Look only under the runner's Android SDK; do not download unverified installers.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "::error::Android SDK root not found"; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ ! -x "$sdkmanager_bin" && -x "$sdk_root/tools/bin/sdkmanager" ]]; then
            sdkmanager_bin="$sdk_root/tools/bin/sdkmanager"
          fi
          test -x "$sdkmanager_bin" || { echo "::error::Android SDK command-line tools missing: install them in a reviewed follow-up"; exit 1; }
          "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 -m venv /tmp/wordcraft-icon-env
          /tmp/wordcraft-icon-env/bin/pip install "Pillow==11.3.0"
          echo "/tmp/wordcraft-icon-env/bin" >> "$GITHUB_PATH"

      - name: Generate candidate launcher icon from approved WordCraft PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("tools/approved-branding/assets/WordCraft.png")
          target = Path("wordcraft/android/icon/wordcraft-approved-192.png")
          with Image.open(source) as image:
              assert image.width >= 192 and image.height >= 192, "Approved artwork too small"
              image.convert("RGBA").resize((192, 192), Image.Resampling.LANCZOS).save(target)
          print("Candidate icon generated from tools/approved-branding/assets/WordCraft.png")
          PY

      - name: Regression-test upstream v0.15.2 D/C/S migration without touching source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_unsaved_dcs.py wordcraft/android/patch_unsaved_dcs_v014.py wordcraft/android/patch_builder.py
          python3 -m unittest discover -s wordcraft/android -p 'test_v014_overlay.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          git -C builder/source/wordcraft diff --exit-code

      - name: Apply isolated Android-only candidate version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # These changes are confined to ephemeral checkouts, never upstream or suite main.
          source = Path('builder/source/wordcraft/Cargo.toml')
          s = source.read_text()
          old = 'version = "0.15.2"'
          assert s.count(old) == 1, 'Review new upstream manifest before changing version'
          source.write_text(s.replace(old, 'version = "0.15.2-android.3"', 1))
          project = Path('builder/lib/android_project.py')
          p = project.read_text()
          formula = 'return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert p.count(formula) == 1, 'Version-code override location changed: stop'
          project.write_text(p.replace(formula, 'return 100015203', 1))
          print('Candidate metadata set: 0.15.2-android.3 / 100015203')
          PY
          git -C builder/source/wordcraft diff -- Cargo.toml
          git -C builder diff -- lib/android_project.py

      - name: Test asynchronous font refresh feedback
        run: |
          rustc --edition=2024 --test wordcraft/android/refresh_feedback.rs -o /tmp/wordcraft-refresh-tests
          /tmp/wordcraft-refresh-tests

      - name: Integrate WordCraft persistent font import (isolated builder only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          native=Path("wordcraft/android/wordcraft_android.rs").read_text()
          activity=Path("wordcraft/android/WordCraftExtension.java.inc").read_text()
          assert "WC_ANDROID_FAST_INPUT_V1" in native and "WC_ANDROID_FAST_INPUT_V1" in activity
          assert 'self.call_bool("wcFastInputActive")' in native
          assert "return imeWanted;" in activity
          assert "Duration::from_millis(16)" in native
          print("PASS: WordCraft conditional 16ms IME frame delivery, normal typing and clipboard untouched")
          PY
          python3 -m py_compile wordcraft/android/patch_builder.py
          python3 wordcraft/android/patch_builder.py builder
          python3 -m unittest discover -s wordcraft/android -p 'test_workspace_v014.py' -v
          python3 wordcraft/android/workspace_v014.py builder
          bash -n builder/lib/build-common.sh

      - name: Increase pinned Gradle download timeout and retry packaging only
        shell: bash
        run: |
          set -euo pipefail
          # All changes below are isolated to the disposable reference-builder
          # checkout; never alter the upstream repo or production keys.
          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path("builder/templates/gradle/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text(encoding="utf-8")
          old_timeout = "networkTimeout=10000\n"
          assert w.count(old_timeout) == 1, "Pinned Gradle wrapper timeout changed: review before editing"
          wrapper.write_text(w.replace(old_timeout, "networkTimeout=120000\n", 1), encoding="utf-8")
          shell = Path("builder/lib/build-common.sh")
          s = shell.read_text(encoding="utf-8")
          old_gradle = '    ./gradlew --console=plain "$GRADLE_TASK"\n'
          assert s.count(old_gradle) == 1, "Pinned builder Gradle invocation changed: review first"
          retry_gradle = """    bash -c 'for attempt in 1 2; do
              if ./gradlew --console=plain "$1"; then exit 0; fi
              if [[ "$attempt" == 2 ]]; then exit 1; fi
              echo "Transient Gradle download or packaging failure; retrying only Gradle in 8 seconds"
              sleep 8
          done' -- "$GRADLE_TASK"
          """
          shell.write_text(s.replace(old_gradle, retry_gradle, 1), encoding="utf-8")
          print("Ephemeral Gradle wrapper: timeout 120000ms; one packaging-only retry")
          PY
          bash -n builder/lib/build-common.sh

      - name: Apply updater source to pinned, already patched builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lib/inapp_updater.py
          cp templates/android/ArtCraftUpdater.java builder/templates/android/ArtCraftUpdater.java
          cp templates/android/updater.rs builder/templates/android/updater.rs
          cp lib/inapp_updater.py builder/lib/inapp_updater.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("builder/lib/build-common.sh")
          s=p.read_text()
          anchor='[[ -f "$ANDROID_DIR/Cargo.toml" && -f "$ANDROID_DIR/src/lib.rs" ]] || fail '
          assert s.count(anchor)==1
          hook="""if [[ "$APP" == "wordcraft" ]]; then
              python3 "$ROOT/lib/inapp_updater.py" "$APP" "$ANDROID_DIR" "$ROOT" || fail "Updater integration failed"
          fi
          """
          p.write_text(s.replace(anchor,hook+anchor,1))
          java=Path("builder/templates/android/ArtCraftUpdater.java").read_text()
          floating=Path("builder/templates/android/updater.rs").read_text()
          icon_menu=Path("wordcraft/android/ribbon_android.rs.inc").read_text()
          assert "egui::Area::new" not in floating, "Floating update button must not ship"
          assert "egui::Window::new" not in floating, "Old update popup must not ship"
          assert "artcraft.updater.action" in floating, "Menu bridge absent"
          assert icon_menu.count('ui.menu_button("App Updates"') == 1, "App Updates must be unified"
          assert icon_menu.count('ui.button("Check for Updates")') == 1, "Duplicate Check for Updates"
          assert 'ui.menu_button("Verified APK updater"' not in icon_menu, "Legacy updater submenu remains"
          assert 'ui.button("Download & Install Update…")' in icon_menu
          assert 'ui.checkbox(&mut startup, "Check at Startup")' in icon_menu
          assert 'ui.button("View Release Notes…")' in icon_menu
          assert '"artcraft.updater.available"' in icon_menu
          assert '"artcraft.updater.diagnostics"' in icon_menu
          legacy = Path("wordcraft/android/wordcraft_android.rs").read_text()
          assert 'if tools.startup_updates && tools.call_void("wcCheckForUpdates")' not in legacy
          assert '"check_updates"' not in icon_menu, "Duplicate legacy WordCraft update option"

          assert 'invoke(android, "download")' in floating
          assert 'invoke(android, "view")' in floating
          assert 'poll_menu_state(ctx, android)' in floating
          assert "downloadAvailable" in java and "menuState" in java and "viewAvailable" in java
          assert "egui::Window::new" not in floating

          for action in ('"check"', '"test"', '"toggle"'):
              assert action in icon_menu, f"Missing menu action {action}"
          extension = Path("wordcraft/android/WordCraftExtension.java.inc").read_text()
          patch_builder = Path("wordcraft/android/patch_builder.py").read_text()
          wc_native = Path("wordcraft/android/wordcraft_android.rs").read_text()
          assert "WC_INDIVIDUAL_FONT_IMPORT_V1" in extension
          assert "Intent.ACTION_OPEN_DOCUMENT" in extension
          assert "Intent.EXTRA_ALLOW_MULTIPLE" in extension
          assert "wcHandleImportedFonts(resultCode, data)" in patch_builder
          assert '"font_import"' in icon_menu and "wcImportFonts" in wc_native
          assert '("Import Fonts (TTF / OTF)…", "font_import")' in icon_menu
          assert "wcRefreshFontFolder" in extension and "WC_MAX_FONTS = 5_000" in extension
          assert 'app.run("font.add"' in wc_native
          assert "PackageInstaller" in java and "verifyPackageAndSigner" in java
          assert "progress.isCanceled()" not in java
          PY
          bash -n builder/lib/build-common.sh

      - name: Build original WordCraft package with temporary key before verified production signing
        shell: bash
        timeout-minutes: 60
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          python3 wordcraft/android/adaptive_safe.py builder wordcraft
          cd builder
          bash build.sh -wordcraft -packagename=com.artcraft.wordcraft -appicon="$GITHUB_WORKSPACE/wordcraft/android/icon/wordcraft-approved-192.png"
          test -s output/wordcraft-0.15.2-android.3.apk

      - name: Check compiled APK package, ARM64, version, icon, signature and hash
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/builder/output/wordcraft-0.15.2-android.3.apk"
          test -s "$apk"
          python3 - "$apk" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              libs = [n for n in names if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs), libs
              assert any(n.startswith('res/') and n.lower().endswith(('.png', '.webp')) for n in names), 'Packaged raster resources missing'
              # AAPT2 compiles adaptive-icon XML to a binary resource entry with
              # an optimized filename; verify the resource table below instead.
              assert 'classes.dex' in names, 'Android Java bridge missing'
          print('Archive checks: ARM64 libraries, icon resources, Java DEX found')
          PY
          # AAPT2 may rename/optimize packaged PNG paths; assert the generated
          # source artwork AND compiled resource-table identifiers instead.
          icon_res="builder/source/wordcraft/apps/wordcraft-android/res"
          test -s "$icon_res/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$icon_res/drawable-xxxhdpi/ic_launcher_foreground.png"
          test -s "$icon_res/mipmap-anydpi-v26/ic_launcher.xml"
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$aapt2" dump resources "$apk" > /tmp/wordcraft-packed-resources.txt
          grep -F "mipmap/ic_launcher" /tmp/wordcraft-packed-resources.txt
          grep -F "drawable/ic_launcher_foreground" /tmp/wordcraft-packed-resources.txt
          badging="$("$aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "name='com.artcraft.wordcraft'"
          printf '%s\n' "$badging" | grep -F "versionCode='100015203'"
          printf '%s\n' "$badging" | grep -F "versionName='0.15.2-android.3'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk"
          echo "Ephemeral candidate verified, NOT a permanent signing, device test, or public release."



      - name: Verify all approved WordCraft enhancements in original-package build
        shell: bash
        run: |
          set -euo pipefail
          test -s builder/output/wordcraft-0.15.2-android.3.apk
          test -s builder/source/wordcraft/apps/wordcraft-android/java/com/artcraft/wordcraft/ArtCraftUpdater.java
          test -f builder/source/wordcraft/apps/wordcraft-android/src/updater.rs
          grep -F 'WC_INDIVIDUAL_FONT_IMPORT_V1' wordcraft/android/WordCraftExtension.java.inc
          grep -F 'ui.menu_button("App Updates"' wordcraft/android/ribbon_android.rs.inc
          test "$(grep -Fc 'ui.button("Check for Updates")' wordcraft/android/ribbon_android.rs.inc)" -eq 1
          echo "PASS: approved WordCraft source preserved for permanent signing"

      - name: Confirm production package, version, unsigned release status
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists. Never replace published releases"; exit 1
          fi
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BUILD_TOOLS=$TOOLS" >> "$GITHUB_ENV"
          if [ "$APP" = "wordcraft" ]; then
            SOURCE="builder/output/wordcraft-0.15.2-android.3.apk"
          else
            SOURCE="$(find builder/output -maxdepth 1 -type f -iname '*gridcraft*.apk' -print -quit)"
          fi
          test -n "$SOURCE" && test -s "$SOURCE"
          "$TOOLS/aapt" dump badging "$SOURCE" > /tmp/prod-before-signing.txt
          grep -F "name='$PACKAGE'" /tmp/prod-before-signing.txt
          grep -F "versionName='$VERSION'" /tmp/prod-before-signing.txt
          grep -F "versionCode='$VERSION_CODE'" /tmp/prod-before-signing.txt
          echo "SOURCE_APK=$SOURCE" >> "$GITHUB_ENV"

      - name: Sign with ORIGINAL production keystore (abort on certificate mismatch)
        shell: bash
        env:
          KEY_B64: ${{ secrets.WORDCRAFT_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_B64" && test -n "$STOREPASS" && test -n "$KEYPASS" && test -n "$KEYALIAS" || {
            echo "::error::Existing signing secrets missing; release blocked"; exit 1
          }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/production-keystore"
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/production-keystore" \
            -storepass:env STOREPASS -alias "$KEYALIAS" > "$RUNNER_TEMP/production-cert.pem"
          observed="$(openssl x509 -in "$RUNNER_TEMP/production-cert.pem" -outform DER | sha256sum | awk '{print toupper($1)}')"
          test "$observed" = "$EXPECTED_CERT" || {
            echo "::error::Signing identity is NOT the existing original certificate"; exit 1
          }
          mkdir -p publish
          "$BUILD_TOOLS/zipalign" -f -p 4 "$SOURCE_APK" "$RUNNER_TEMP/release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/production-keystore" \
            --ks-key-alias "$KEYALIAS" --ks-pass env:STOREPASS --key-pass env:KEYPASS \
            --v4-signing-enabled false --out "publish/$APK" "$RUNNER_TEMP/release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "publish/$APK" > publish/certificate.txt
          "$BUILD_TOOLS/aapt" dump badging "publish/$APK" > publish/badging.txt
          grep -F "name='$PACKAGE'" publish/badging.txt
          grep -F "versionName='$VERSION'" publish/badging.txt
          grep -F "versionCode='$VERSION_CODE'" publish/badging.txt
          python3 - <<'PY'
          import os,re,zipfile
          from pathlib import Path
          report=Path("publish/certificate.txt").read_text()
          actual={re.sub("[^0-9A-F]","",part.upper()) for part in re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F:]{64,95})",report,re.I)}
          assert actual=={os.environ["EXPECTED_CERT"]}, "Wrong signer in finished APK"
          with zipfile.ZipFile(Path("publish")/os.environ["APK"]) as z:
              assert z.testzip() is None
              libs=[n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
              assert libs and all(n.startswith("lib/arm64-v8a/") for n in libs)
              assert "classes.dex" in z.namelist()
          print("PASS: ARM64 and existing production signing certificate; original package")
          PY
          (cd publish && sha256sum "$APK" > SHA256SUMS.txt)

      - name: Publish NEW approved WordCraft v0.15.2-android.3 stable release
        shell: bash
        run: |
          set -euo pipefail
          test -s "publish/$APK" && test -s publish/SHA256SUMS.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release tag already exists"; exit 1
          fi
          cat > publish/NOTES.md <<'NOTES'
          WordCraft v0.15.2-android.3 — Original-key-signed ARM64 Android release.

          - Official upstream integration and preserved ArtCraft Android improvements.
          - Import Fonts TTF/OTF single and multi-file, shared font folder refresh, single unified verified App Updates submenu, keyboard/SAF/trackpad improvements, and approved icon.
          - Package: com.artcraft.wordcraft; versionCode 100015203; original existing certificate SHA-256 C05372EA57ECF5571A7AC27716179606A2A1A8E57F213D1E3E8BEB41F4360B65.
          - Earlier published releases and APKs are preserved.
          - Original signing certificate and package retained for in-place Android updates; separately installed test candidates are unaffected. Back up documents before updating.
          NOTES
          gh release create "$TAG" "publish/$APK" publish/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "WordCraft v0.15.2-android.3 — Stable ARM64" --notes-file publish/NOTES.md --latest=false

      - name: Always erase temporary signing key and build files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/production-keystore" "$RUNNER_TEMP/production-cert.pem" "$RUNNER_TEMP/release-aligned.apk"
          rm -rf builder/keys builder/output
