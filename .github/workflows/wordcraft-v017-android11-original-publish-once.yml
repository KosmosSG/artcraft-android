          assert script.count(old_tag) == 1, "Old installed-tag anchor changed"
          assert script.count(old_package) == 1, "Old production-package anchor changed"
          script = script.replace(old_tag, '"wordcraft": "wordcraft-v0.17.0-android.11",')
          script = script.replace(old_package, '.replace("__TARGET_PACKAGE__", java_package)')
          assert '"wordcraft": "wordcraft-v0.17.0-android.11",' in script
          assert '.replace("__TARGET_PACKAGE__", java_package)' in script
          p.write_text(script)
          print("Updater target: production WordCraft package, installed tag v0.17.0 Android.11")
          PY
          python3 -m py_compile builder/lib/inapp_updater.py
          python3 - <<'PY'
