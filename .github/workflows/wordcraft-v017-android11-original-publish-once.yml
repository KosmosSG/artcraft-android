name: WordCraft v0.17.0 Android.11 ORIGINAL-KEY SIGN AND PUBLISH

on:
  push:
    branches:
      - release/wordcraft-v017-android11-original-sign-20261114
    paths:
      - '.github/workflows/wordcraft-v017-android11-original-publish-once.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: wordcraft-v017-android11-original-publish
  cancel-in-progress: false

jobs:
  isolated-candidate:
    if: github.repository == 'KosmosSG/artcraft-android' && github.ref == 'refs/heads/release/wordcraft-v017-android11-original-sign-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT: C05372EA57ECF5571A7AC27716179606A2A1A8E57F213D1E3E8BEB41F4360B65
      ARTCRAFT_UPDATER_TEST_ONLY: 'true'
      TAG: wordcraft-v0.17.0-android.11
      APK: WordCraft-v0.17.0-android.11-arm64-v8a.apk
      APP: wordcraft
      PACKAGE: com.artcraft.wordcraft
      VERSION: 0.17.0-android.11
      VERSION_CODE: '100017011'
      WORDCRAFT_UPSTREAM_COMMIT: 5574b32600aa7d782c64f5a6c6bb24696152220d
      WORDCRAFT_BUILDER_COMMIT: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
      WORDCRAFT_VERSION_NAME: 0.17.0-android.11
      WORDCRAFT_CANDIDATE_VERSION_CODE: "100017011"
      WORDCRAFT_PACKAGE: com.artcraft.wordcraft

    steps:
      - name: Checkout WordCraft-only candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gate user-tested Android.11 source, production identity and unused release tag
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "2ba6471420b6eead46dd75415a077d149c288827" HEAD || { echo "::error::Tested Android.11 source is not an ancestor"; exit 1; }
          test "$(git diff --name-only 2ba6471420b6eead46dd75415a077d149c288827 HEAD)" = ".github/workflows/wordcraft-v017-android11-original-publish-once.yml" || { echo "::error::Unexpected source modifications after user testing"; exit 1; }
          test "$TAG" = "wordcraft-v0.17.0-android.11"
          test "$PACKAGE" = "com.artcraft.wordcraft"
          test "$WORDCRAFT_PACKAGE" = "$PACKAGE"
          test "$VERSION_CODE" = "100017011"
          test "$EXPECTED_CERT" = "C05372EA57ECF5571A7AC27716179606A2A1A8E57F213D1E3E8BEB41F4360B65"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing overwrite"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists; refusing overwrite"; exit 1
          fi
          gh release view wordcraft-v0.17.0-android.1 -R "$GITHUB_REPOSITORY" --json isDraft,assets > /tmp/wc-protected-release.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/wc-protected-release.json"))
          assert not r["isDraft"]
          names={a["name"] for a in r["assets"]}
          assert {"WordCraft-v0.17.0-android.1-arm64-v8a.apk","SHA256SUMS.txt"}.issubset(names)
          assert 100017011 > 100017001
          print("PASS: tested Android.11 source, protected Android.1 release, original package and increasing version code")
          PY

      - name: Cheap blue wheel preflight before downloading Android tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_builder.py wordcraft/android/test_wordcraft_blue_wheel.py
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_blue_wheel.py' -v
          echo "PASS: Physical stylus button, PhotoCraft round hub, real Wc logo, EffectCraft menu and live preview"

      - name: Checkout pinned reference builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: MostafaXS1/artcraft-android
          ref: ac54d62d9d2d6f663295a4afd8972a7a3e79f9af
          path: builder
          persist-credentials: false

      - name: Checkout pinned stable WordCraft
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: storytold/wordcraft
          ref: 5574b32600aa7d782c64f5a6c6bb24696152220d
          path: builder/source/wordcraft
          persist-credentials: false

      - name: Confirm stable tag, exact commits, isolated input and icon digest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C builder rev-parse HEAD)" = "$WORDCRAFT_BUILDER_COMMIT"
          test "$(git -C builder/source/wordcraft rev-parse HEAD)" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -z "$(git -C builder/source/wordcraft status --porcelain)"
          tag_commit="$(git ls-remote https://github.com/storytold/wordcraft.git refs/tags/v0.17.0 | awk '{print $1}')"
          test "$tag_commit" = "$WORDCRAFT_UPSTREAM_COMMIT"
          test -s tools/approved-branding/assets/WordCraft.png

      - name: Verify stylus pressure hover and curve integration before spending build minutes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_builder.py wordcraft/android/patch_stylus_ink.py
          python3 - <<'PY'
          from pathlib import Path
          j = Path("wordcraft/android/WordCraftExtension.java.inc").read_text()
          n = Path("wordcraft/android/wordcraft_android.rs").read_text()
          p = Path("wordcraft/android/patch_builder.py").read_text()
          overlay = Path("wordcraft/android/patch_stylus_ink.py").read_text()
          smoothing = Path("wordcraft/android/stylus_curve.rs.inc").read_text()
          for marker in ("wcTakeStylusTrail", "getHistoricalX", "getHistoricalPressure",
                         "wcStylusHoverPosition", "wcPenPeakPressure", "wcPenLastContactPressure"):
              assert marker in j, marker
          for marker in ("inject_stylus_motion", "wc_stylus.hover_pos", "wc_stylus.path_samples"):
              assert marker in n, marker
          assert "apply_stylus_ink" in p and "wc_stylus_samples" in p
          assert "WC_ANDROID_STYLUS_HOVER_CURSOR_V1" in overlay
          assert "wc_smooth_stroke" in overlay and "WC_STYLUS_CURVE_SMOOTHING_V1" in smoothing
          source = Path("builder/source/wordcraft/crates/ui-egui/src/ink.rs").read_text()
          assert source.count('    paint_lasso(app, painter, rects, layout, scale);') == 1
          assert source.count('const MIN_STEP_PX: f32 = 1.5;') == 1
          assert source.count('    let pts: Vec<Pos2> = d.pts.iter().map(|p| map(*p)).collect();') == 1
          print("PASS: source preflight for smoother WordCraft stylus and noncontact hover")
          PY
          cp wordcraft/android/stylus_curve.rs.inc /tmp/wc_smoothing_test.rs
          rustc --edition=2024 --crate-name wc_smoothing_test --test /tmp/wc_smoothing_test.rs -o /tmp/wc_smoothing_test
          /tmp/wc_smoothing_test

      - name: Validate pressure width module and pinned upstream overlay before Android setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_pressure_ink.py wordcraft/android/patch_stylus_ink.py
          cp wordcraft/android/stylus_pressure.rs.inc /tmp/wordcraft-pressure-tests.rs
          rustc --edition=2024 --crate-name wordcraft_pressure_tests --test /tmp/wordcraft-pressure-tests.rs -o /tmp/wordcraft-pressure-tests
          /tmp/wordcraft-pressure-tests
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import sys, shutil
          sys.path.insert(0, "wordcraft/android")
          from patch_stylus_ink import apply_stylus_ink
          from patch_pressure_ink import apply_pressure_ink
          with TemporaryDirectory() as d:
              root = Path(d)
              ink = root / "crates" / "ui-egui" / "src" / "ink.rs"
              ink.parent.mkdir(parents=True)
              shutil.copyfile("builder/source/wordcraft/crates/ui-egui/src/ink.rs", ink)
              apply_stylus_ink(root, Path("wordcraft/android/stylus_curve.rs.inc"))
              apply_pressure_ink(root, Path("wordcraft/android/stylus_pressure.rs.inc"))
              text = ink.read_text()
              assert 'wc_pressure_segments(&points, &pressure, base, 12)' in text
              assert 'app.session.join_next_undo()' in text
              assert 'painter.line_segment' in text
              assert 'pressure_on: pressure_requested && had_batch' in text
              assert 'include!("wordcraft-stylus-pressure.rs.inc")' in text
          print("PASS: pressure overlay applied to pinned upstream and module tests.")
          PY

      - name: Verify Android.11 navigation cancellation and ink guard on pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_touch_guard.py
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import shutil, sys
          sys.path.insert(0, "wordcraft/android")
          from patch_stylus_ink import apply_stylus_ink
          from patch_pressure_ink import apply_pressure_ink
          from patch_touch_guard import apply_touch_guard
          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              upstream = Path("builder/source/wordcraft/crates/ui-egui/src")
              target = root / "crates/ui-egui/src"
              target.mkdir(parents=True)
              for name in ("ink.rs", "canvas.rs"):
                  shutil.copyfile(upstream / name, target / name)
              apply_stylus_ink(root, Path("wordcraft/android/stylus_curve.rs.inc"))
              apply_pressure_ink(root, Path("wordcraft/android/stylus_pressure.rs.inc"))
              apply_touch_guard(root)
              canvas, ink = (target / "canvas.rs").read_text(), (target / "ink.rs").read_text()
              assert "WC_ANDROID_NO_SELECTION_DURING_TWO_FINGER_V1" in canvas
              assert "app.canvas.cancel_text_drag()" in canvas
              assert "app.canvas.obj_drag = None" in canvas
              assert "WC_ANDROID_NO_INK_DURING_TWO_FINGER_V1" in ink
              assert "app.canvas.ink = None" in ink
              assert "wc_pressure_segments" in ink
          print("PASS: no-selection navigation guard composes with pressure-ink overlay")
          PY
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v

      - name: Regression gate before installing expensive Android tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_builder.py wordcraft/android/patch_stylus_ink.py
          python3 -m unittest discover -s wordcraft/android -p 'test_v014_overlay.py' -v
          # Pressure-buffer regression now verifies the source owning each
          # symbol: native sample buffer in patch_stylus_ink, variable-width
          # persistence in patch_pressure_ink. No Android tools until this passes.
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          echo "PASS: D/C/S, clipboard, two-finger scrolling, pressure and hover regressions."

      - name: Verify two-finger touchscreen and trackpad source gates before Android setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          python3 - <<'PY'
          from pathlib import Path
          java=Path("wordcraft/android/WordCraftExtension.java.inc").read_text()
          rust=Path("wordcraft/android/wordcraft_android.rs").read_text()
          builder=Path("wordcraft/android/patch_builder.py").read_text()
          assert "WC_TWOFINGER_NAV_NO_SELECTION_V2" in java
          assert "event.getHistoricalX(0, historyIndex)" in java
          assert "wcOnlyFingers(event)" in java
          assert "WC_TWOFINGER_NAV_NO_SELECTION_RUST_V2" in rust
          assert "let Some(canvas) = canvas_rect else { return };" in rust
          assert "wcTouchNavigationCancellingInk" in java
          assert "cancel.setAction(android.view.MotionEvent.ACTION_CANCEL)" in java
          assert "wcTouchNavConsuming = true" in java
          assert "wcTouchNavSuppressInk = true" in java
          assert "egui::Event::Zoom(zoom.clamp(0.5, 2.0))" in rust
          assert 'apply_touch_guard' in builder

          assert "if !canvas.contains(center) { return; }" in rust
          assert "self.inner.canvas.canvas_rect" in builder
          assert 'self.wc.inject_trackpad_scroll(ctx, raw, self.modifiers)' in builder
          assert "wcRejectPalm(event)" in java
          assert "wcCaptureStylusHistory(event)" in java
          print("PASS: two-finger scroll, pinch, palm, pen and document focus safeguards")
          PY

      - name: Preflight candidate updater path derived from package name
        shell: bash
        run: |
          set -euo pipefail
          test "$WORDCRAFT_PACKAGE" = "com.artcraft.wordcraft"
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/wordcraft-v0152-android11-pan-first-test.yml").read_text()
          assert 'java_pkg="$(printf' in workflow
          assert 'java/$java_pkg/ArtCraftUpdater.java' in workflow
          assert ("scroll" + "candidate/ArtCraftUpdater.java") not in workflow
          assert ("stylus" + "candidate/ArtCraftUpdater.java") not in workflow
          print("PASS: updater location follows actual candidate package")
          PY

      - name: Verify Android.11 pinch/trackpad no-drag sources before Android tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/test_wordcraft_android9_gestures.py
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android9_gestures.py' -v
          python3 - <<'PY'
          from pathlib import Path
          java = Path('wordcraft/android/WordCraftExtension.java.inc').read_text()
          native = Path('wordcraft/android/wordcraft_android.rs').read_text()
          assert 'WC_ANDROID9_PINCH_TRACKPAD_GUARD_V1' in java
          assert 'WC_ANDROID9_TRACKPAD_NO_DRAG_RUST_V1' in native
          assert 'wcTouchNavSuppressInk || wcTrackpadNavigationActive()' in java
          assert 'wcTouchPinchEvidence >= 2' in java
          assert 'raw.events.retain(|event| !matches!(event,' in native
          print('PASS: Android.11 pinch and trackpad no-drag source preflight')
          PY

      - name: Validate Android.11 classified MagicOS touchpad and compact menu preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/test_wordcraft_android10_gestures.py
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android10_gestures.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android9_gestures.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          python3 - <<'PY'
          from pathlib import Path
          java = Path('wordcraft/android/WordCraftExtension.java.inc').read_text()
          rust = Path('wordcraft/android/wordcraft_android.rs').read_text()
          menu = Path('wordcraft/android/ribbon_android.rs.inc').read_text()
          assert java.count("wcDispatchClassifiedTrackpad(event)") == 2
          assert 'getBoolean("pressure_ink", true)' in java
          assert 'Some(zoom)' in rust and 'egui::Event::Zoom(zoom.clamp(0.5, 2.0))' in rust
          assert 'ui.menu_button("Stylus & Handwriting"' not in menu
          print("PASS: classified trackpad swipe/pinch, touch pan, pressure-on, compact menu")
          PY

      - name: Validate Android.11 pan-first motion scenarios and Appearance before Android setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/test_wordcraft_android11_panfirst.py
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android11_panfirst.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android10_gestures.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android9_gestures.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          python3 - <<'PY'
          from pathlib import Path
          java = Path('wordcraft/android/WordCraftExtension.java.inc').read_text()
          menu = Path('wordcraft/android/ribbon_android.rs.inc').read_text()
          assert 'WC_ANDROID11_PAN_FIRST_PINCH_HYSTERESIS_V1' in java
          assert 'wcTouchPinchEvidence >= 2' in java
          assert 'wcTouchPanX += dx * .80f + wcTouchPreviousPanX * .20f' in java
          assert 'ui.checkbox(&mut dark, "Dark mode")' not in menu
          assert menu.count('Theme preferences (System / Light / Dark)') == 1
          assert 'wcTouchNavSuppressInk = true' in java
          assert 'getBoolean("pressure_ink", true)' in java
          print('PASS: pan-first navigation, stable horizontal scrolling, appearance and pressure defaults')
          PY

      - name: Guard approved source and isolate production app before expensive build
        shell: bash
        run: |
          set -euo pipefail
          test "$WORDCRAFT_PACKAGE" = "com.artcraft.wordcraft"
          test "$WORDCRAFT_UPSTREAM_COMMIT" = "5574b32600aa7d782c64f5a6c6bb24696152220d"
          test -f wordcraft/android/test_wordcraft_android11_panfirst.py
          test -f wordcraft/android/patch_builder.py
          grep -F 'getBoolean("pressure_ink", true)' wordcraft/android/WordCraftExtension.java.inc
          grep -F 'WC_ANDROID11_PAN_FIRST_PINCH_HYSTERESIS_V1' wordcraft/android/WordCraftExtension.java.inc
          grep -F 'WC_ANDROID11_APPEARANCE_SINGLE_THEME_V1' wordcraft/android/ribbon_android.rs.inc
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_android11_panfirst.py' -v

      - name: Set up Java, Rust and Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          java -version
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          # GitHub's Ubuntu image may have SDK command-line tools installed but not on PATH.
          # Look only under the runner's Android SDK; do not download unverified installers.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root" || { echo "::error::Android SDK root not found"; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [[ ! -x "$sdkmanager_bin" && -x "$sdk_root/tools/bin/sdkmanager" ]]; then
            sdkmanager_bin="$sdk_root/tools/bin/sdkmanager"
          fi
          test -x "$sdkmanager_bin" || { echo "::error::Android SDK command-line tools missing: install them in a reviewed follow-up"; exit 1; }
          "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          python3 -m venv /tmp/wordcraft-icon-env
          /tmp/wordcraft-icon-env/bin/pip install "Pillow==11.3.0"
          echo "/tmp/wordcraft-icon-env/bin" >> "$GITHUB_PATH"

      - name: Generate candidate launcher icon from approved WordCraft PNG
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("tools/approved-branding/assets/WordCraft.png")
          target = Path("wordcraft/android/icon/wordcraft-approved-192.png")
          with Image.open(source) as image:
              assert image.width >= 192 and image.height >= 192, "Approved artwork too small"
              image.convert("RGBA").resize((192, 192), Image.Resampling.LANCZOS).save(target)
          print("Candidate icon generated from tools/approved-branding/assets/WordCraft.png")
          PY

      - name: Verify regression gate remains valid after preparing build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile wordcraft/android/patch_unsaved_dcs.py wordcraft/android/patch_unsaved_dcs_v014.py wordcraft/android/patch_builder.py
          python3 -m unittest discover -s wordcraft/android -p 'test_v014_overlay.py' -v
          python3 -m unittest discover -s wordcraft/android -p 'test_wordcraft_device_fixes.py' -v
          git -C builder/source/wordcraft diff --exit-code

      - name: Apply isolated Android-only candidate version metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # These changes are confined to ephemeral checkouts, never upstream or suite main.
          source = Path('builder/source/wordcraft/Cargo.toml')
          s = source.read_text()
          old = 'version = "0.17.0"'
          assert s.count(old) == 1, 'Review new upstream manifest before changing version'
          source.write_text(s.replace(old, 'version = "0.17.0-android.11"', 1))
          project = Path('builder/lib/android_project.py')
          p = project.read_text()
          formula = 'return (1 << 24) | (major << 16) | (minor << 8) | patch'
          assert p.count(formula) == 1, 'Version-code override location changed: stop'
          project.write_text(p.replace(formula, 'return 100017011', 1))
          print('Candidate metadata set: 0.17.0-android.11 / 100017011')
          PY
          git -C builder/source/wordcraft diff -- Cargo.toml
          git -C builder diff -- lib/android_project.py

      - name: Test asynchronous font refresh feedback
        run: |
          rustc --edition=2024 --test wordcraft/android/refresh_feedback.rs -o /tmp/wordcraft-refresh-tests
          /tmp/wordcraft-refresh-tests

      - name: Integrate WordCraft persistent font import (isolated builder only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          native=Path("wordcraft/android/wordcraft_android.rs").read_text()
          activity=Path("wordcraft/android/WordCraftExtension.java.inc").read_text()
          assert "WC_ANDROID_FAST_INPUT_V1" in native and "WC_ANDROID_FAST_INPUT_V1" in activity
          assert 'self.call_bool("wcFastInputActive")' in native
          assert "return imeWanted;" in activity
          assert "Duration::from_millis(16)" in native
          print("PASS: WordCraft conditional 16ms IME frame delivery, normal typing and clipboard untouched")
          PY
          python3 -m py_compile wordcraft/android/patch_builder.py
          python3 wordcraft/android/patch_builder.py builder
          python3 -m unittest discover -s wordcraft/android -p 'test_workspace_v014.py' -v
          python3 wordcraft/android/workspace_v014.py builder
          bash -n builder/lib/build-common.sh

      - name: Increase pinned Gradle download timeout and retry packaging only
        shell: bash
        run: |
          set -euo pipefail
          # All changes below are isolated to the disposable reference-builder
          # checkout; never alter the upstream repo or production keys.
          python3 - <<'PY'
          from pathlib import Path
          wrapper = Path("builder/templates/gradle/gradle/wrapper/gradle-wrapper.properties")
          w = wrapper.read_text(encoding="utf-8")
          old_timeout = "networkTimeout=10000\n"
          assert w.count(old_timeout) == 1, "Pinned Gradle wrapper timeout changed: review before editing"
          wrapper.write_text(w.replace(old_timeout, "networkTimeout=120000\n", 1), encoding="utf-8")
          shell = Path("builder/lib/build-common.sh")
          s = shell.read_text(encoding="utf-8")
          old_gradle = '    ./gradlew --console=plain "$GRADLE_TASK"\n'
          assert s.count(old_gradle) == 1, "Pinned builder Gradle invocation changed: review first"
          retry_gradle = """    bash -c 'for attempt in 1 2; do
              if ./gradlew --console=plain "$1"; then exit 0; fi
              if [[ "$attempt" == 2 ]]; then exit 1; fi
              echo "Transient Gradle download or packaging failure; retrying only Gradle in 8 seconds"
              sleep 8
          done' -- "$GRADLE_TASK"
          """
          shell.write_text(s.replace(old_gradle, retry_gradle, 1), encoding="utf-8")
          print("Ephemeral Gradle wrapper: timeout 120000ms; one packaging-only retry")
          PY
          bash -n builder/lib/build-common.sh

      - name: Apply updater source to pinned, already patched builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lib/inapp_updater.py
          cp templates/android/ArtCraftUpdater.java builder/templates/android/ArtCraftUpdater.java
          cp templates/android/updater.rs builder/templates/android/updater.rs
          cp lib/inapp_updater.py builder/lib/inapp_updater.py
          # Candidate-only updater identity: leave the production updater source untouched.
          # A separate-package disposable APK must never request installation over production.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("builder/lib/inapp_updater.py")
          script = p.read_text()
          old_tag = '"wordcraft": "wordcraft-v0.15.2-android.3",'
