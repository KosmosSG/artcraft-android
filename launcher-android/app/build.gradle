plugins { id 'com.android.application' }

android {
    namespace 'com.artcraft.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.artcraft.launcher'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.1.0-android.11'
    }
    buildTypes {
        debug {
            minifyEnabled false
            // Install alongside the official permanent-signed v0.1.0-android.9.
            applicationIdSuffix '.test'
            manifestPlaceholders = [launcherLabel: 'ArtCraft Launcher TEST']
        }
        release {
            minifyEnabled true
            manifestPlaceholders = [launcherLabel: 'ArtCraft Launcher']
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
